<!DOCTYPE html>
<html lang="ru" class="app-booting">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Библейские игры</title>
  <meta name="theme-color" content="#eaf3ff" />
  <meta name="description" content="Библейские мини-игры для компании, друзей и семьи" />
  <meta name="application-name" content="Библейские игры" />
  <meta name="app-build" content="telegram-desktop-bootstrap-20260828" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="quartet-backend" content="https://alias-spy-games-quartet.vitaledanilov.workers.dev" />
  <meta name="bible-sketch-backend" content="https://alias-spy-games-bible-sketch.vitaledanilov.workers.dev" />
  <meta name="app-observability" content="https://alias-spy-games-observability.vitaledanilov.workers.dev" />
  <meta name="app-core-backend" content="https://alias-spy-games-core.vitaledanilov.workers.dev" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.workers.dev wss://*.workers.dev https://cdn.jsdelivr.net; frame-src 'self' https://*.workers.dev; font-src 'self' data:;" />
  <script id="telegram-web-app-sdk" src="https://telegram.org/js/telegram-web-app.js?63" async></script>
  <script src="web/js/telegram-launch-context.js?v=2"></script>
  <script>
    (() => {
      try {
        const allowed = new Set(['continue', 'recent', 'progress']);
        const raw = JSON.parse(localStorage.getItem('home_hidden_sections_v1') || '[]');
        const hidden = Array.isArray(raw) ? raw.filter((key) => allowed.has(key)) : [];
        if (hidden.length) document.documentElement.dataset.homeHidden = hidden.join(' ');
      } catch {}
    })();
  </script>
  <script>
    (() => {
      window.setTimeout(() => {
        const root = document.documentElement;
        if (!root.classList.contains('app-booting') && !root.classList.contains('app-menu-preparing')) return;
        if (document.body?.dataset.mode) return;

        const loader = document.getElementById('main-loader');
        const menu = document.getElementById('menu-container');

        if (typeof window.renderMainMenu === 'function' && menu) {
          try { window.renderMainMenu(); } catch {}
          loader?.remove();
          menu.classList.remove('hidden');
          root.classList.remove('app-booting', 'app-menu-preparing');
          root.classList.add('app-ui-ready');
          window.__gamehubBoot?.finish?.();
          return;
        }

        if (!loader) return;
        if (window.__gamehubBoot?.fail) {
          window.__gamehubBoot.fail('Не удалось завершить запуск приложения.');
          return;
        }

        document.getElementById('gamehub-boot-scene')?.remove();
        loader.innerHTML = `
          <div class="app-loader__ring"></div>
          <p>Не удалось завершить запуск приложения.</p>
          <button class="game-button" type="button" onclick="location.reload()">Повторить запуск</button>
        `;
      }, 9000);
    })();
  </script>
  <style>
    html.app-booting,html.app-booting body{
      background:radial-gradient(circle at 50% 30%,#E0F2FE 0%,#DBEAFE 48%,#6366F1 100%)!important
    }
    html.app-booting .app-header,
    html.app-menu-preparing .app-header,
    html.app-booting #menu-container,
    html.app-menu-preparing #menu-container,
    html.app-booting #banned-screen,
    html.app-booting #game-container{visibility:hidden!important;opacity:0!important;pointer-events:none!important}
    #gamehub-boot-scene{
      position:fixed;inset:0;z-index:1340;display:grid;place-items:center;min-height:100vh;min-height:100dvh;
      background:radial-gradient(circle at 50% 32%,rgba(224,242,254,.96) 0%,rgba(219,234,254,.78) 38%,rgba(99,102,241,.44) 100%),#DBEAFE;
    }
    html.app-booting #main-loader,
    html.app-menu-preparing #main-loader{
      position:fixed!important;inset:0!important;z-index:1330!important;display:flex!important;flex-direction:column!important;
      align-items:center!important;justify-content:center!important;width:100%!important;min-width:100%!important;height:100vh!important;
      min-height:100dvh!important;margin:0!important;padding:0 24px!important;visibility:visible!important;opacity:1!important;
      pointer-events:auto!important;background:radial-gradient(circle at 50% 30%,#E0F2FE 0%,#DBEAFE 48%,#6366F1 100%)!important;
    }
  </style>
  <!-- build:css -->
  <link rel="stylesheet" href="web/dist/app.bba7aae2fd.css" />
  <!-- /build:css -->
</head>
<body>
  <div id="gamehub-boot-scene" class="gamehub-boot" role="status" aria-live="polite" aria-label="Запуск Библейских игр">
    <div class="gamehub-boot__art" aria-hidden="true">
      <img class="gamehub-boot__layer gamehub-boot__layer--base" data-gamehub-layer-file="01-gamehub-base.webp" alt="" decoding="async" />
      <img class="gamehub-boot__layer gamehub-boot__layer--atmosphere" data-gamehub-layer-file="02-atmosphere.webp" alt="" decoding="async" />
      <img class="gamehub-boot__layer gamehub-boot__layer--architecture" data-gamehub-layer-file="03-architecture.webp" alt="" decoding="async" />
      <div class="gamehub-boot__veil"></div>
    </div>

    <div class="gamehub-boot__content">
      <div class="gamehub-boot__portal" aria-hidden="true">
        <div class="gamehub-boot__ring"></div>
        <div class="gamehub-boot__crystal"></div>
        <div class="gamehub-boot__icons">
          <img class="gamehub-boot__icon" src="web/assets/icons/alias.webp?v=1" alt="" decoding="async" />
          <img class="gamehub-boot__icon" src="web/assets/icons/spy.webp?v=1" alt="" decoding="async" />
          <img class="gamehub-boot__icon" src="web/assets/icons/quartet.webp?v=1" alt="" decoding="async" />
          <img class="gamehub-boot__icon" src="web/assets/icons/idea.webp?v=1" alt="" decoding="async" />
          <img class="gamehub-boot__icon" src="web/assets/icons/words.webp?v=1" alt="" decoding="async" />
        </div>
      </div>
      <p class="gamehub-boot__eyebrow">Игровой мир</p>
      <h1 class="gamehub-boot__title" data-gamehub-boot-title>Библейские игры</h1>
      <p class="gamehub-boot__status" data-gamehub-boot-status>Открываем игровой мир…</p>
      <div class="gamehub-boot__progress" aria-hidden="true"></div>
      <button class="gamehub-boot__retry" type="button" data-gamehub-boot-retry>Попробовать снова</button>
    </div>
  </div>

  <header class="app-header">
    <p class="app-kicker">Мини-игры для компании</p>
    <h1>Библейские игры</h1>
    <p class="app-subtitle">Выберите игру и начните партию</p>
  </header>

  <div id="main-loader" class="app-loader" aria-live="polite">
    <div class="app-loader__ring"></div>
    <p>Запускаем игры…</p>
  </div>

  <main class="menu-container hidden" id="menu-container">
    <section class="menu-section">
      <div class="menu-section-title">Игры для компании</div>
      <div class="menu-grid" id="company-games"></div>
    </section>

    <section class="menu-section">
      <div class="menu-section-title">Словесные</div>
      <div class="menu-grid" id="word-games"></div>
    </section>

    <section class="menu-section">
      <div class="menu-section-title">Детям</div>
      <div class="menu-grid" id="kids-games"></div>
    </section>

    <section class="menu-section">
      <div class="menu-section-title">Ещё</div>
      <div class="menu-grid" id="system-actions"></div>
    </section>
  </main>

  <section id="banned-screen" class="hidden banned-screen">
    <div class="banned-card">
      <h2>Доступ ограничен</h2>
      <p>Обжаловать блокировку можно через техническую поддержку.</p>
      <button class="game-button" type="button" onclick="openSupportChat()">Написать</button>
    </div>
  </section>

  <main id="game-container" aria-live="polite"></main>

  <script id="three-js" type="application/json" data-src="web/vendor/three.min.js?v=r128"></script>
  <!-- build:js -->
  <script src="web/dist/app.71d5412bdb.js" defer></script>
  <!-- /build:js -->
</body>
</html>
