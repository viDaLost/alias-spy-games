<!DOCTYPE html>
<html lang="ru" class="app-booting">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Библейские игры</title>
  <meta name="theme-color" content="#eaf3ff" />
  <meta name="description" content="Библейские мини-игры для компании, друзей и семьи" />
  <meta name="application-name" content="Библейские игры" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="quartet-backend" content="https://alias-spy-games-quartet.vitaledanilov.workers.dev" />
  <meta name="app-observability" content="https://alias-spy-games-observability.vitaledanilov.workers.dev" />
  <meta name="app-core-backend" content="https://alias-spy-games-core.vitaledanilov.workers.dev" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://telegram.org https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.workers.dev wss://*.workers.dev; font-src 'self' data:;" />
  <script>
    (() => {
      try {
        const allowed = new Set(['continue', 'recent', 'progress']);
        const raw = JSON.parse(localStorage.getItem('home_hidden_sections_v1') || '[]');
        const hidden = Array.isArray(raw) ? raw.filter((key) => allowed.has(key)) : [];
        if (hidden.length) document.documentElement.dataset.homeHidden = hidden.join(' ');
      } catch {}
    })();
  </script>
  <style>
    html.app-booting #menu-container,html.app-menu-preparing #menu-container{visibility:hidden!important;opacity:0!important;pointer-events:none!important}
    html.app-booting #banned-screen{visibility:hidden!important;opacity:0!important;pointer-events:none!important}
    html.app-booting #main-loader{visibility:visible!important;opacity:1!important}
  </style>
  <link rel="preload" as="image" href="assets/icons/alias.png?v=1" />
  <link rel="preload" as="image" href="assets/icons/idea.png?v=1" />
  <link rel="preload" as="image" href="assets/icons/character.png?v=1" />
  <link rel="preload" as="image" href="assets/icons/describe.png?v=1" />
  <link rel="preload" as="image" href="assets/icons/spy.png?v=1" />
  <link rel="preload" as="image" href="assets/icons/quartet.png?v=1" />
  <link rel="preload" as="image" href="assets/icons/words.png?v=1" />
  <link rel="preload" as="image" href="assets/icons/search.png?v=1" />
  <link rel="preload" as="image" href="assets/icons/sacred.png?v=1" />
  <link rel="preload" as="image" href="assets/icons/ark.png?v=1" />
  <link rel="stylesheet" href="style.css?v=22" />
  <link rel="stylesheet" href="admin-enhancements.css?v=22" />
  <link rel="stylesheet" href="home-enhancements.css?v=1" />
  <link rel="stylesheet" href="home-controls.css?v=2" />
  <link rel="stylesheet" href="admin-live-v2.css?v=1" />
  <link rel="stylesheet" href="error-system.css?v=1" />
  <link rel="stylesheet" href="games-mobile-polish.css?v=1" />
  <link rel="stylesheet" href="games/quartet-mobile.css?v=1" />
  <link rel="stylesheet" href="app-motion.css?v=1" />
</head>
<body>
  <header class="app-header">
    <p class="app-kicker">Мини-игры для компании</p>
    <h1>Библейские игры</h1>
    <p class="app-subtitle">Выберите игру и начните партию</p>
  </header>

  <div id="main-loader" class="app-loader" aria-live="polite">
    <div class="app-loader__ring"></div>
    <p>Проверка доступа...</p>
  </div>

  <main class="menu-container hidden" id="menu-container">
    <section class="menu-section">
      <div class="menu-section-title">Игры для компании</div>
      <div class="menu-grid" id="company-games"></div>
    </section>

    <section class="menu-section">
      <div class="menu-section-title">Словесные</div>
      <div class="menu-grid" id="word-games"></div>
    </section>

    <section class="menu-section">
      <div class="menu-section-title">Для детей</div>
      <div class="menu-grid" id="kids-games"></div>
    </section>

    <section class="menu-section">
      <div class="menu-grid" id="system-actions"></div>
    </section>
  </main>

  <section id="banned-screen" class="hidden banned-screen">
    <div class="banned-card">
      <h2>Доступ ограничен</h2>
      <p>Обжаловать блокировку можно через техническую поддержку.</p>
      <button class="game-button" type="button" onclick="openSupportChat()">Написать</button>
    </div>
  </section>

  <main id="game-container" aria-live="polite"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="backend-bridge.js?v=2" defer></script>
  <script src="error-system.js?v=1" defer></script>
  <script src="startup-coordinator.js?v=1" defer></script>
  <script src="app.js?v=22" defer></script>
  <script src="system-icons.js?v=1" defer></script>
  <script src="admin-enhancements.js?v=22" defer></script>
  <script src="home-enhancements.js?v=3" defer></script>
  <script src="home-controls.js?v=3" defer></script>
  <script src="app-motion.js?v=1" defer></script>
  <script src="telemetry.js?v=1" defer></script>
  <script src="presence-identity.js?v=1" defer></script>
  <script src="admin-live-v2.js?v=2" defer></script>
</body>
</html>
