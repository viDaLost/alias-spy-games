ion:codeLayer .92s cubic-bezier(.18,.76,.22,1)}.scene-action-image.play-qr{animation:qrLayer 1.08s ease-in-out}@keyframes roomLayer{0%{opacity:0;transform:scale(.92)}24%{opacity:.98}66%{opacity:.94;transform:scale(1.035)}100%{opacity:0;transform:scale(1.07)}}@keyframes codeLayer{0%{opacity:0;transform:translateY(18px) scale(.96)}22%{opacity:.98}68%{opacity:.95;transform:translateY(-4px) scale(1.02)}100%{opacity:0;transform:translateY(-12px) scale(1.04)}}@keyframes qrLayer{0%{opacity:0;transform:scale(.94)}20%{opacity:.98}70%{opacity:.94;transform:scale(1.025)}100%{opacity:0;transform:scale(1.055)}}
