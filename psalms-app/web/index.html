<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f6">
<title>Песенник</title>
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div class="boot" id="boot">
  <img class="boot__mark" src="assets/icon.png" width="72" height="72" alt="">
  <p class="boot__title">Песенник</p>
</div>

<div class="app" id="app" hidden>
  <main class="stage" id="stage"></main>

  <nav class="nav" id="nav" aria-label="Основные разделы">
    <button class="nav__item" type="button" data-route="#/home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.2 12 4l8 6.2V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-6h5v6"/></svg>
      <span class="nav__label">Главная</span>
    </button>
    <button class="nav__item" type="button" data-route="#/search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.2 16.2 3.8 3.8"/></svg>
      <span class="nav__label">Поиск</span>
    </button>
    <button class="nav__item" type="button" data-route="#/favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.4S3.8 15.5 3.8 9.9A4.1 4.1 0 0 1 12 7.7a4.1 4.1 0 0 1 8.2 2.2c0 5.6-8.2 10.5-8.2 10.5z"/></svg>
      <span class="nav__label">Избранное</span>
    </button>
  </nav>

  <div class="reader" id="reader" hidden></div>
  <div class="sheet-host" id="sheetHost" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script type="module" src="js/app.js"></script>
<script nomodule>
  document.getElementById('boot').innerHTML =
    '<div style="padding:40px 30px;text-align:center;font:15px system-ui;color:#6b6b6b">'
    + '<b style="display:block;font-size:17px;margin-bottom:8px;color:#171717">Нужен свежий WebView</b>'
    + 'Обновите «Android System WebView» или Google Chrome в Play Маркете.</div>';
</script>
</body>
</html>
