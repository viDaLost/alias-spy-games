<!doctype html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf7f2">
<title>Псалмы</title>
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div class="boot" id="boot">
  <img class="boot__mark" src="assets/icon.png" width="96" height="96" alt="">
  <div class="boot__title">Псалмы</div>
  <div class="boot__bar"><i></i></div>
</div>

<div class="app" id="app" hidden>
  <main class="stage" id="stage"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-route="#/home" aria-label="Библиотека">
      <span class="tab__icon">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5zM14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14z"/></svg>
      </span>
      <span class="tab__label">Библиотека</span>
    </button>
    <button class="tab" data-route="#/search" aria-label="Поиск">
      <span class="tab__icon">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      </span>
      <span class="tab__label">Поиск</span>
    </button>
    <button class="tab" data-route="#/favorites" aria-label="Избранное">
      <span class="tab__icon">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-9.6A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/></svg>
      </span>
      <span class="tab__label">Избранное</span>
    </button>
    <button class="tab" data-route="#/settings" aria-label="Настройки">
      <span class="tab__icon">
        <svg viewBox="0 0 24 24"><path d="M5 20.5v-6M5 9.5v-6M12 20.5v-8M12 7.5v-4M19 20.5v-4M19 11.5v-8"/><circle cx="5" cy="12" r="2.1"/><circle cx="12" cy="10" r="2.1"/><circle cx="19" cy="14" r="2.1"/></svg>
      </span>
      <span class="tab__label">Ещё</span>
    </button>
    <span class="tabbar__pill" id="tabPill"></span>
  </nav>

  <div class="reader" id="reader" hidden></div>
  <div class="sheet-host" id="sheetHost" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script type="module" src="js/app.js"></script>
<script nomodule>
  document.getElementById('boot').innerHTML =
    '<div style="padding:40px 30px;text-align:center;font:15px system-ui;color:#5a5449">'
    + '<b style="display:block;font-size:17px;margin-bottom:8px">Нужен свежий WebView</b>'
    + 'Обновите «Android System WebView» или Google Chrome в Play Маркете — '
    + 'приложению нужен современный движок страниц.</div>';
</script>
</body>
</html>
