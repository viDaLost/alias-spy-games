name: Validate access resilience 2.6.7

on:
  push:
    branches: [agent/android-access-retry-2.6.7]
    paths:
      - '.github/workflows/validate-access-resilience-267.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-access-retry-2.6.7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compile fix
        run: python scripts/fix-access-resilience-compile.py
      - name: Run regression checks
        run: |
          node scripts/check-android-ban-enforcement.mjs
          node scripts/check-support-center.mjs
      - name: Build and lint Android
        run: gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon
      - name: Validate core Worker bundle
        working-directory: cloudflare/app-core-worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/app-core-worker-build
      - name: Commit compile fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "viDaLost"
          git config user.email "vitaledanilov@gmail.com"
          git add android-app/app/src/main/java/com/vidalost/biblegames/App.kt
          git commit -m "Fix Android access monitor compile state"
          git push origin HEAD:agent/android-access-retry-2.6.7
