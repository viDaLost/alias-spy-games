name: Validate and merge native Android clean transfer

on:
  push:
    branches:
      - agent/native-android-2.6.0-clean

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/native-android-2.6.0-clean

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify clean transfer scope and native project
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          bad=0
          while IFS= read -r path; do
            case "$path" in
              android-app/*|.github/workflows/build-android-apk.yml|scripts/sync-android-assets.mjs|.gitignore|.github/workflows/validate-native-clean-transfer.yml) ;;
              *) echo "Unexpected non-Android change: $path"; bad=1 ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          test "$bad" -eq 0

          test -f android-app/app/build.gradle.kts
          test -f android-app/app/src/main/AndroidManifest.xml
          test -f android-app/app/src/main/java/com/vidalost/biblegames/MainActivity.kt
          test -f android-app/app/src/main/res/drawable-nodpi/ic_launcher_adaptive.webp
          test -f android-app/app/src/main/res/drawable-nodpi/ic_launcher_art.webp
          test -f scripts/sync-android-assets.mjs

          test ! -f android-app/app/src/main/java/com/vidalost/biblegames/MainActivity.java
          grep -Eq 'compileSdk[ =]+36' android-app/app/build.gradle.kts
          grep -Eq 'targetSdk[ =]+36' android-app/app/build.gradle.kts
          grep -Eq 'versionCode[ =]+12' android-app/app/build.gradle.kts
          grep -Eq 'versionName[ =]+"2\.6\.0-native"' android-app/app/build.gradle.kts
          grep -Rqs 'ANDROID_KEYSTORE_PATH' android-app
          if grep -Rqs 'signingConfigs\.debug\|signingConfig signingConfigs.debug' android-app; then
            echo 'Debug signing fallback found in release configuration'
            exit 1
          fi

      - name: Validate web project remains healthy
        run: npm run check

      - name: Sync, build and lint native Android
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-android-assets.mjs
          gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon

      - name: Remove validation-only workflow and enforce final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-native-clean-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary native transfer validator'
          git push origin HEAD:agent/native-android-2.6.0-clean

          bad=0
          while IFS= read -r path; do
            case "$path" in
              android-app/*|.github/workflows/build-android-apk.yml|scripts/sync-android-assets.mjs|.gitignore) ;;
              *) echo "Unexpected final change: $path"; bad=1 ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          test "$bad" -eq 0

      - name: Merge validated clean transfer PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge 36 --repo viDaLost/alias-spy-games --squash
