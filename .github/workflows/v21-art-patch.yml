name: V21 art integration patch
on:
  push:
    branches:
      - ui/v21-home-icons-board-background
    paths:
      - .github/workflows/v21-art-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v21-home-icons-board-background
          fetch-depth: 0
      - name: Apply V21 artwork integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one marker for {old!r}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          launcher = Path('web/js/biblical-match-three-launcher.js')
          text = launcher.read_text()
          text = text.replace('const VERSION="20";', 'const VERSION="21";', 1)
          text = text.replace('const LEVELS_SRC=`web/data/biblical_match_three_levels.json?v=${VERSION}`;', 'const LEVELS_SRC=`web/data/biblical_match_three_levels.json?v=${VERSION}`;\nconst MENU_ICON=`web/assets/icons/biblical-treasures.webp?v=${VERSION}`;', 1)
          text = text.replace(' `web/styles/biblical-match-three-v15-polish.css?v=${VERSION}`\n];', ' `web/styles/biblical-match-three-v15-polish.css?v=${VERSION}`,\n `web/styles/biblical-match-three-v21-art.css?v=${VERSION}`\n];', 1)
          new_card = '''function addMenuCard(){if(!isAllowedUser()){removeMenuCard();return false}const root=document.getElementById("kids-games");if(!root||document.getElementById("biblical-match-three-card"))return false;const card=document.createElement("button");card.type="button";card.id="biblical-match-three-card";card.className="game-card";card.setAttribute("aria-label",`Открыть игру ${TITLE}`);card.innerHTML=`<span class="game-card__icon game-card__icon--image"><img class="game-card__img" src="${MENU_ICON}" alt="Иконка игры ${TITLE}" loading="eager" decoding="async" draggable="false" data-bmt-menu-art="v21"></span><span class="game-card__body"><span class="game-card__title">${TITLE}</span><span class="game-card__desc">Матч‑3 с Путём света, рекордами и быстрыми комбинациями</span></span>`;card.addEventListener("click",()=>openGame());root.append(card);return true}'''
          text, count = re.subn(r'function addMenuCard\(\)\{.*?\}\nasync function installAuthorized', new_card + '\nasync function installAuthorized', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('launcher addMenuCard marker not found')
          launcher.write_text(text)

          qr = Path('web/js/room-qr-addon.js')
          text = qr.read_text()
          old = '<span class="game-card__icon room-scan-menu-icon" aria-hidden="true">⌗</span>'
          new = '<span class="game-card__icon room-scan-menu-icon" aria-hidden="true"><img class="game-card__img" src="web/assets/icons/qr-scanner.webp?v=4" alt="" draggable="false" loading="eager" decoding="async"></span>'
          if text.count(old) != 1:
              raise SystemExit('QR home icon marker not found')
          qr.write_text(text.replace(old, new, 1))

          index = Path('index.html')
          text = index.read_text()
          replacements = {
              'web/js/biblical-match-three-launcher.js?v=20': 'web/js/biblical-match-three-launcher.js?v=21',
              'web/js/android-download-menu.js?v=1': 'web/js/android-download-menu.js?v=2',
              'web/js/room-qr-addon.js?v=3': 'web/js/room-qr-addon.js?v=4',
              'web/js/system-icons.js?v=1': 'web/js/system-icons.js?v=3',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'index marker missing: {old}')
              text = text.replace(old, new, 1)
          index.write_text(text)

          css = Path('web/styles/biblical-match-three-v21-art.css')
          css.write_text('''/* Biblical Treasures V21: selected ornate board artwork. */
          body[data-current-game="biblical-match-three"] .bmt-board-wrap {
            background-color: #edf2ff !important;
            background-image: linear-gradient(rgba(239,245,255,.04), rgba(239,245,255,.04)), url("../assets/biblical-match-three/board-background-v21.webp") !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            border: 1px solid rgba(135, 117, 198, .18) !important;
            box-shadow: inset 0 0 28px rgba(255,255,255,.16), 0 7px 22px rgba(73,74,124,.08) !important;
            overflow: hidden !important;
          }
          body[data-current-game="biblical-match-three"] .bmt-board {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
          }
          ''')

          check = Path('scripts/check-biblical-match-three.mjs')
          text = check.read_text()
          text = text.replace("css15=read('web/styles/biblical-match-three-v15-polish.css'),launcher=read('web/js/biblical-match-three-launcher.js');", "css15=read('web/styles/biblical-match-three-v15-polish.css'),css21=read('web/styles/biblical-match-three-v21-art.css'),launcher=read('web/js/biblical-match-three-launcher.js'),systemIcons=read('web/js/system-icons.js'),androidMenu=read('web/js/android-download-menu.js'),qrAddon=read('web/js/room-qr-addon.js'),indexHtml=read('index.html');", 1)
          text = text.replace("launcher.includes('VERSION=\"20\"')", "launcher.includes('VERSION=\"21\"')", 1)
          text = text.replace("'V20 three-user private access gate missing'", "'V21 three-user private access gate missing'", 1)
          marker = "const syms=['bible','fish','dove','lamp','crown','ark'];"
          v21 = "const v21Assets=['web/assets/icons/biblical-treasures.webp','web/assets/icons/support.webp','web/assets/icons/android-download.webp','web/assets/icons/qr-scanner.webp','web/assets/icons/admin.webp','web/assets/biblical-match-three/board-background-v21.webp'];for(const f of v21Assets)ok(exists(f),`V21 artwork missing: ${f}`);ok(launcher.includes('MENU_ICON')&&launcher.includes('biblical-treasures-v21-art.css')&&launcher.includes('data-bmt-menu-art=\\\"v21\\\"'),'V21 Biblical menu artwork wiring missing');ok(css21.includes('board-background-v21.webp')&&css21.includes('.bmt-board-wrap')&&css21.includes('.bmt-board'),'V21 board background styling missing');ok(systemIcons.includes('support.webp')&&systemIcons.includes('admin.webp')&&!systemIcons.includes('<svg'),'V21 support/admin artwork wiring missing');ok(androidMenu.includes('android-download.webp')&&!androidMenu.includes('<svg'),'V21 Android artwork wiring missing');ok(qrAddon.includes('qr-scanner.webp'),'V21 QR artwork wiring missing');ok(indexHtml.includes('biblical-match-three-launcher.js?v=21')&&indexHtml.includes('system-icons.js?v=3')&&indexHtml.includes('android-download-menu.js?v=2')&&indexHtml.includes('room-qr-addon.js?v=4'),'V21 cache bust wiring missing');\n"
          if marker not in text:
              raise SystemExit('static checker insertion marker missing')
          text = text.replace(marker, v21 + marker, 1)
          text = text.replace("console.log('OK: Biblical Treasures V20 stable lamps + 3-start-move + dead-board finish checks passed');", "console.log('OK: Biblical Treasures V21 artwork + V20 gameplay checks passed');", 1)
          check.write_text(text)
          PY
          node --check web/js/biblical-match-three-launcher.js
          node --check web/js/system-icons.js
          node --check web/js/android-download-menu.js
          node --check web/js/room-qr-addon.js
          node scripts/check-biblical-match-three.mjs
          git diff --check
      - name: Commit V21 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html web/js/biblical-match-three-launcher.js web/js/room-qr-addon.js web/styles/biblical-match-three-v21-art.css scripts/check-biblical-match-three.mjs
          git commit -m "Integrate V21 home icons and board artwork"
          git push origin HEAD:ui/v21-home-icons-board-background
