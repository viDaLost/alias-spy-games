name: Deploy Bible Find 9 Cloudflare preview

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bible-find9-preview
    paths:
      - 'cloudflare/bible-find9-preview/**'
      - '.github/workflows/deploy-bible-find9-preview.yml'

permissions:
  contents: read

concurrency:
  group: bible-find9-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore verified PNG preview assets
        run: |
          set -euo pipefail
          cat \
            cloudflare/bible-find9-preview/png-src/assets.zip.b64.00 \
            cloudflare/bible-find9-preview/png-src/assets.zip.b64.01 \
            cloudflare/bible-find9-preview/png-src/assets.zip.b64.02 \
            cloudflare/bible-find9-preview/png-src/fix03/00.txt \
            cloudflare/bible-find9-preview/png-src/fix03/01.txt \
            cloudflare/bible-find9-preview/png-src/fix03/02.txt \
            cloudflare/bible-find9-preview/png-src/fix03/03.txt \
            cloudflare/bible-find9-preview/png-src/fix03/04.txt \
            cloudflare/bible-find9-preview/png-src/fix03/05.txt \
            cloudflare/bible-find9-preview/png-src/fix03/06.txt \
            cloudflare/bible-find9-preview/png-src/fix03/07.txt \
            cloudflare/bible-find9-preview/png-src/fix03/08.txt \
            cloudflare/bible-find9-preview/png-src/assets.zip.b64.04 \
            cloudflare/bible-find9-preview/png-src/assets.zip.b64.05 \
            cloudflare/bible-find9-preview/png-src/assets.zip.b64.06 \
            | tr -d '\n\r' \
            | base64 -d > /tmp/bible-find9-png-assets.zip
          echo '24e086c63b0f17ef075427612095a71e4323b4f333d7b0018d207f42bc3c689d  /tmp/bible-find9-png-assets.zip' | sha256sum -c -
          unzip -t /tmp/bible-find9-png-assets.zip
          rm -f cloudflare/bible-find9-preview/public/assets/*.svg
          rm -f cloudflare/bible-find9-preview/public/assets/*.png
          unzip -o /tmp/bible-find9-png-assets.zip -d cloudflare/bible-find9-preview/public/assets

      - name: Validate PNG preview files
        run: |
          set -euo pipefail
          test -f cloudflare/bible-find9-preview/public/index.html
          test -f cloudflare/bible-find9-preview/public/assets/00_base_scene.png
          for n in 01_dove_olive 02_scroll 03_clay_jar 04_fish 05_grapes 06_oil_lamp 07_bread 08_harp 09_rainbow; do
            test -f "cloudflare/bible-find9-preview/public/assets/${n}.png"
          done
          test "$(find cloudflare/bible-find9-preview/public/assets -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 10
          test "$(find cloudflare/bible-find9-preview/public/assets -maxdepth 1 -type f -name '*.svg' | wc -l)" -eq 0
          if grep -Fq '.svg' cloudflare/bible-find9-preview/public/index.html; then
            echo 'SVG reference found in PNG preview' >&2
            exit 1
          fi
          grep -Fq 'assets/00_base_scene.png' cloudflare/bible-find9-preview/public/index.html
          grep -Fq 'assets/09_rainbow.png' cloudflare/bible-find9-preview/public/index.html
          grep -Fq 'Найди 9 деталей' cloudflare/bible-find9-preview/public/index.html
          file cloudflare/bible-find9-preview/public/assets/00_base_scene.png | grep -Fq 'PNG image data, 1536 x 1024'
          python - <<'PY'
          from pathlib import Path
          import zlib
          root = Path('cloudflare/bible-find9-preview/public/assets')
          names = ['00_base_scene.png','01_dove_olive.png','02_scroll.png','03_clay_jar.png','04_fish.png','05_grapes.png','06_oil_lamp.png','07_bread.png','08_harp.png','09_rainbow.png']
          sig = b'\x89PNG\r\n\x1a\n'
          for name in names:
              data = (root / name).read_bytes()
              assert data.startswith(sig), name
          assert f'{zlib.crc32((root / "00_base_scene.png").read_bytes()) & 0xffffffff:08x}' == 'a6e89ea1'
          print('Verified original PNG scene and 9 transparent PNG target layers')
          PY

      - name: Deploy isolated Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          npm_config_cache: /tmp/npm-cache
        run: npx --yes wrangler@4.102.0 deploy --config cloudflare/bible-find9-preview/wrangler.jsonc

      - name: Verify deployed PNG preview
        env:
          PREVIEW_URL: https://alias-spy-games-bible-find9-preview.vitaledanilov.workers.dev/
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 --max-time 30 "${PREVIEW_URL}?build=${GITHUB_SHA}" -o /tmp/preview.html
          grep -Fq 'Найди 9 деталей' /tmp/preview.html
          grep -Fq 'assets/00_base_scene.png' /tmp/preview.html
          grep -Fq 'assets/09_rainbow.png' /tmp/preview.html
          if grep -Fq '.svg' /tmp/preview.html; then
            echo 'Deployed preview still references SVG' >&2
            exit 1
          fi

          curl -fsSL --retry 4 --retry-delay 2 --max-time 30 "${PREVIEW_URL}health?build=${GITHUB_SHA}" -o /tmp/health.json
          cat /tmp/health.json
          grep -Fq 'bible-find9' /tmp/health.json
          grep -Fq 'png' /tmp/health.json

          curl -fsSL --retry 4 --retry-delay 2 --max-time 30 "${PREVIEW_URL}assets/00_base_scene.png?build=${GITHUB_SHA}" -o /tmp/base.png
          curl -fsSL --retry 4 --retry-delay 2 --max-time 30 "${PREVIEW_URL}assets/01_dove_olive.png?build=${GITHUB_SHA}" -o /tmp/layer.png
          file /tmp/base.png
          file /tmp/layer.png
          python - <<'PY'
          from pathlib import Path
          sig = b'\x89PNG\r\n\x1a\n'
          base = Path('/tmp/base.png').read_bytes()
          layer = Path('/tmp/layer.png').read_bytes()
          assert base.startswith(sig), 'base scene is not PNG'
          assert layer.startswith(sig), 'target layer is not PNG'
          assert len(base) > 1000 and len(layer) > 1000
          print('Live PNG assets verified:', len(base), len(layer))
          PY
          echo "Bible Find 9 PNG preview verified: ${PREVIEW_URL}"
