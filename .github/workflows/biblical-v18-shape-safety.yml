name: Biblical V18 shape safety
on:
  push:
    branches:
      - feature/biblical-v18-level-shapes-tutorial
    paths:
      - .github/workflows/biblical-v18-shape-safety.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/biblical-v18-level-shapes-tutorial
      - name: Keep blockers connected to shaped fields
        run: |
          python - <<'PY'
          from pathlib import Path
          game=Path('web/games/biblical-match-three.js')
          t=game.read_text()
          old='for (const group of level?.blockers || []) for (const index of group.cells || []) if (Number(index) >= 0 && Number(index) < mask.length) mask[Number(index)] = true;'
          new='for (const group of level?.blockers || []) for (const rawIndex of group.cells || []) { const index = Number(rawIndex); if (index < 0 || index >= mask.length) continue; mask[index] = true; const row = Math.floor(index / cols); const col = index % cols; for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]) { const nr=row+dr,nc=col+dc; if(nr>=0&&nr<rows&&nc>=0&&nc<cols) mask[nr*cols+nc]=true; } }'
          if t.count(old)!=1: raise SystemExit('game blocker-mask marker missing')
          game.write_text(t.replace(old,new,1))
          check=Path('scripts/check-biblical-match-three.mjs')
          t=check.read_text()
          old="for(const group of level.blockers||[])for(const index of group.cells||[])mask[Number(index)]=true;return mask"
          new="for(const group of level.blockers||[])for(const rawIndex of group.cells||[]){const index=Number(rawIndex),row=Math.floor(index/cols),col=index%cols;mask[index]=true;for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){const nr=row+dr,nc=col+dc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols)mask[nr*cols+nc]=true}}return mask"
          if t.count(old)!=1: raise SystemExit('static mask marker missing')
          t=t.replace(old,new,1)
          old="for(const group of level.blockers||[])for(const cell of group.cells||[])ok(mask[Number(cell)],`level ${level.id} blocker placed in a hole`);"
          new="for(const group of level.blockers||[])for(const cell of group.cells||[]){const index=Number(cell),row=Math.floor(index/data.cols),col=index%data.cols;ok(mask[index],`level ${level.id} blocker placed in a hole`);const neighbors=[[-1,0],[1,0],[0,-1],[0,1]].map(([dr,dc])=>[row+dr,col+dc]).filter(([r,c])=>r>=0&&r<rows&&c>=0&&c<data.cols).map(([r,c])=>r*data.cols+c);ok(neighbors.some(i=>mask[i]),`level ${level.id} blocker ${index} isolated by board shape`)};"
          if t.count(old)!=1: raise SystemExit('blocker audit marker missing')
          check.write_text(t.replace(old,new,1))
          css=Path('web/styles/biblical-match-three-v15-polish.css')
          t=css.read_text()
          old='animation:bmt-v18-blocker-break .3s ease both!important'
          new='animation:bmt-v18-blocker-break .18s ease-out both!important'
          if t.count(old)!=1: raise SystemExit('blocker break animation marker missing')
          css.write_text(t.replace(old,new,1))
          PY
      - name: Commit safety patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/games/biblical-match-three.js web/styles/biblical-match-three-v15-polish.css scripts/check-biblical-match-three.mjs
          git commit -m "Keep V18 obstacles reachable on shaped boards"
          git push origin HEAD:feature/biblical-v18-level-shapes-tutorial
