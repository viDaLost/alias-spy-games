name: Apply Android auth request timeout 2.7.2

on:
  push:
    branches: [fix/android-auth-request-timeout-2.7.2]
    paths:
      - 'scripts/apply-android-auth-request-timeout-272.py'
      - '.github/workflows/apply-android-auth-request-timeout-272.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-auth-request-timeout-2.7.2
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Make patch script tolerate all client user-agent occurrences
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-android-auth-request-timeout-272.py')
          text = p.read_text(encoding='utf-8')
          old = "replace_one(cloud_path, 'BibleGames-Android/2.7.1 Native', 'BibleGames-Android/2.7.2 Native')"
          new = """cloud_file = ROOT / cloud_path
          cloud_text = cloud_file.read_text(encoding='utf-8')
          if 'BibleGames-Android/2.7.1 Native' not in cloud_text:
              raise SystemExit('Expected at least one remaining 2.7.1 user-agent')
          cloud_file.write_text(cloud_text.replace('BibleGames-Android/2.7.1 Native', 'BibleGames-Android/2.7.2 Native'), encoding='utf-8')"""
          if old not in text:
              raise SystemExit('Patch-script user-agent replacement marker missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply retry-safe auth request patch
        run: python scripts/apply-android-auth-request-timeout-272.py

      - name: Update version-sensitive regression checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('scripts/check-android-ban-enforcement.mjs', 'scripts/check-support-center.mjs'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              old = "versionName '2.7.1-native'"
              if old not in text:
                  raise SystemExit(f'Missing 2.7.1 version marker in {name}')
              p.write_text(text.replace(old, "versionName '2.7.2-native'"), encoding='utf-8')
          PY

      - name: Static and security checks
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/app-core-worker/src/index-v4.js
          node --check cloudflare/app-core-worker/src/android-auth-user-store.js
          node scripts/check-android-secure-auth.mjs
          node scripts/check-android-ban-enforcement.mjs
          node scripts/check-support-center.mjs
          grep -q 'deliveryConfirmed = false' android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt
          grep -q '.put("challengeId", challengeId)' android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt
          grep -q 'if (begin.existing)' cloudflare/app-core-worker/src/index-v4.js
          grep -q 'existing: true' cloudflare/app-core-worker/src/android-auth-user-store.js
          grep -q "versionName '2.7.2-native'" android-app/app/build.gradle
          grep -q 'versionCode 22' android-app/app/build.gradle

      - name: Build and lint Android
        run: gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon

      - name: Validate core Worker bundle
        working-directory: cloudflare/app-core-worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/core-auth-272

      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare/app-core-worker/node_modules
          rm -f cloudflare/app-core-worker/package-lock.json
          git checkout -- scripts/apply-android-auth-request-timeout-272.py
          git config user.name "viDaLost"
          git config user.email "vitaledanilov@gmail.com"
          git add \
            android-app/app/build.gradle \
            android-app/app/src/main/java/com/vidalost/biblegames/App.kt \
            android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt \
            cloudflare/app-core-worker/src/index-v4.js \
            cloudflare/app-core-worker/src/android-auth-user-store.js \
            scripts/check-android-secure-auth.mjs \
            scripts/check-android-ban-enforcement.mjs \
            scripts/check-support-center.mjs
          git status --short
          git commit -m "Fix Telegram code request response loss on Android"
          git push origin HEAD:fix/android-auth-request-timeout-2.7.2
