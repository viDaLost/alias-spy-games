name: Biblical V20 lamp and move rules
on:
  push:
    branches:
      - fix/biblical-v20-lamps-move-rules
    paths:
      - .github/workflows/biblical-v20-gameplay-fix.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/biblical-v20-lamps-move-rules
          fetch-depth: 0
      - name: Apply V20 gameplay fixes
        run: |
          python scripts/apply-biblical-v20-fix.py
          node --check web/games/biblical-match-three-core.js
          node --check web/games/biblical-match-three.js
          node scripts/check-biblical-match-three.mjs
          git diff --check
      - name: Commit V20 gameplay fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/games/biblical-match-three-core.js web/games/biblical-match-three.js web/styles/biblical-match-three-v15-polish.css web/js/biblical-match-three-launcher.js index.html scripts/check-biblical-match-three.mjs scripts/check-biblical-match-three-visual.mjs
          git commit -m "Fix Biblical Treasures lamps and dead-board rules"
          git push origin HEAD:fix/biblical-v20-lamps-move-rules
