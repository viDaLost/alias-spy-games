name: Transfer validated native Android core to clean branch

on:
  push:
    branches:
      - agent/native-android-2.6.0
    paths:
      - '.native-upload/COPY_TO_CLEAN'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/native-android-2.6.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Recover native source from transfer payload
        shell: bash
        run: |
          set -euo pipefail
          cat .native-upload/payload-*.b64 > /tmp/native.b64
          base64 --decode /tmp/native.b64 > /tmp/native.tar.xz
          mkdir -p /tmp/native
          tar -xJf /tmp/native.tar.xz -C /tmp/native

          test -f /tmp/native/android-app/app/build.gradle
          test -f /tmp/native/android-app/app/src/main/java/com/vidalost/biblegames/MainActivity.kt
          test -f /tmp/native/scripts/sync-android-assets.mjs

          ICON_DIR=/tmp/native/android-app/app/src/main/res/drawable-nodpi
          mkdir -p "$ICON_DIR"
          gh api repos/viDaLost/alias-spy-games/git/blobs/a693a26463d80941c2eb939bc19853ac99bd0e2d --jq .content | tr -d '\n' | base64 --decode > "$ICON_DIR/ic_launcher_art.webp"
          gh api repos/viDaLost/alias-spy-games/git/blobs/cfdcc801d549d23b692320212c36df6ac180e684 --jq .content | tr -d '\n' | base64 --decode > "$ICON_DIR/ic_launcher_adaptive.webp"
          file "$ICON_DIR/ic_launcher_art.webp" | grep -qi WebP
          file "$ICON_DIR/ic_launcher_adaptive.webp" | grep -qi WebP

          rm -rf android-app
          cp -a /tmp/native/android-app ./android-app
          cp /tmp/native/scripts/sync-android-assets.mjs scripts/sync-android-assets.mjs

      - name: Validate native Android before copying
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon
          grep -Eq 'compileSdk[ =]+36' android-app/app/build.gradle
          grep -Eq 'targetSdk[ =]+36' android-app/app/build.gradle
          grep -Eq 'versionCode[ =]+12' android-app/app/build.gradle
          grep -Eq "versionName[ =]+'2\\.6\\.0-native'" android-app/app/build.gradle
          grep -Rqs 'ANDROID_KEYSTORE_PATH' android-app
          test ! -f android-app/app/src/main/java/com/vidalost/biblegames/MainActivity.java
          if grep -Rqs 'signingConfigs\.debug\|signingConfig signingConfigs.debug' android-app; then
            echo 'Debug signing fallback found'
            exit 1
          fi

      - name: Copy only Android core into clean branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/native-android-2.6.0-clean
          git worktree add /tmp/clean origin/agent/native-android-2.6.0-clean

          rm -rf /tmp/clean/android-app
          cp -a android-app /tmp/clean/android-app
          cp scripts/sync-android-assets.mjs /tmp/clean/scripts/sync-android-assets.mjs
          cp .github/workflows/build-android-apk.yml /tmp/clean/.github/workflows/build-android-apk.yml

          cd /tmp/clean
          if git cat-file -e origin/main:.gitignore 2>/dev/null; then
            git show origin/main:.gitignore > .gitignore
          else
            : > .gitignore
          fi
          cat >> .gitignore <<'EOF'

# Android local/generated files and signing material
android-app/.gradle/
android-app/**/build/
android-app/local.properties
*.jks
*.keystore
*.apk
*.aab
EOF

          rm -f .github/workflows/validate-native-clean-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Android wrapper with native 2.6.0 app'

          bad=0
          while IFS= read -r path; do
            case "$path" in
              android-app/*|.github/workflows/build-android-apk.yml|scripts/sync-android-assets.mjs|.gitignore) ;;
              *) echo "Unexpected non-Android change: $path"; bad=1 ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          test "$bad" -eq 0
          git push origin HEAD:agent/native-android-2.6.0-clean
