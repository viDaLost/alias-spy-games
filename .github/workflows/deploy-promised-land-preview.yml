name: Deploy Promised Land preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/shared/app-access.js'
      - 'web/js/standalone-app-access.js'
      - 'cloudflare/promised-land-preview/**'
      - 'web/js/sabbath-*.js'
      - 'web/styles/sabbath-access.css'
      - 'web/data/sabbath-cities.json'
      - 'scripts/sync-promised-land-art.mjs'
      - '.github/workflows/deploy-promised-land-preview.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/promised-land-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Картинки живут в web/assets/promised-land, а воркер раздаёт только своё
      # public/. Копия собирается здесь и не коммитится: иначе те же три с
      # половиной мегабайта лежали бы в репозитории дважды.
      - name: Copy game art into the bundle
        working-directory: .
        run: node scripts/sync-promised-land-art.mjs
      - name: Install Worker tooling
        run: npm install --no-audit --no-fund
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/promised-land-build
      - name: Wait for application access service
        run: node ../../scripts/wait-app-access-service.mjs
      - name: Create or update Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
