name: Deploy Lera birthday

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/lera-birthday/**'
      - '.github/workflows/deploy-lera-birthday-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: deploy-lera-birthday
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/lera-birthday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        run: npm install --no-audit --no-fund
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/lera-birthday-build
      - name: Create or update Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
