name: V21 test expectation sync
on:
  push:
    branches:
      - ui/v21-home-icons-board-background
    paths:
      - .github/workflows/v21-test-sync.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v21-home-icons-board-background
          fetch-depth: 0
      - name: Update V21 regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/check-room-invites.mjs')
          text = p.read_text()
          old = "requireText(html, 'room-qr-addon.js?v=3', 'updated room QR addon is not mounted');"
          new = "requireText(html, 'room-qr-addon.js?v=4', 'updated room QR addon is not mounted');"
          if text.count(old) != 1:
              raise SystemExit(f'room invite marker count {text.count(old)}')
          p.write_text(text.replace(old, new, 1))

          p = Path('scripts/check-biblical-match-three-visual.mjs')
          text = p.read_text()
          replacements = {
              "const V='20';": "const V='21';",
              "'v13','v15-polish']": "'v13','v15-polish','v21-art']",
              "!allowedState.src.includes('/icons-v17/bible.webp')": "!allowedState.src.includes('assets/icons/biblical-treasures.webp')",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'visual marker {old!r} count {text.count(old)}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          node --check scripts/check-biblical-match-three-visual.mjs
          node scripts/check-room-invites.mjs
          node scripts/check-biblical-match-three.mjs
          git diff --check
      - name: Commit test sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-room-invites.mjs scripts/check-biblical-match-three-visual.mjs
          git commit -m "Update V21 regression expectations"
          git push origin HEAD:ui/v21-home-icons-board-background
