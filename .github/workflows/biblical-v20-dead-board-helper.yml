name: Biblical V20 dead-board helper patch
on:
  push:
    branches:
      - fix/biblical-v20-lamps-move-rules
    paths:
      - .github/workflows/biblical-v20-dead-board-helper.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/biblical-v20-lamps-move-rules
          fetch-depth: 0
      - name: Apply dead-board helper patch
        run: |
          python scripts/patch-biblical-v20-dead-board-helper.py
          node --check web/games/biblical-match-three.js
          node --check scripts/check-biblical-match-three-visual.mjs
          node scripts/check-biblical-match-three.mjs
          git diff --check
      - name: Commit gameplay helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/games/biblical-match-three.js scripts/check-biblical-match-three-visual.mjs scripts/check-biblical-match-three.mjs
          git commit -m "Make V20 dead-board termination deterministic"
          git push origin HEAD:fix/biblical-v20-lamps-move-rules
