name: Deploy Kingdoms Cloudflare backend

# Комнаты «Царств».
#
# Правила партии воркер берёт из web/games — теми же файлами, что отдаются
# браузеру. Поэтому развёртывание слушает и их: поправили карту или движок в
# приложении — сервер обязан уехать следом, иначе он останется со вчерашней
# игрой.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/kingdoms-worker/**'
      - 'web/games/kingdoms-rules.js'
      - 'web/games/kingdoms-engine.js'
      - 'web/games/kingdoms-bots.js'
      - '.github/workflows/deploy-kingdoms-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/kingdoms-worker
    steps:
      - uses: actions/checkout@v4

      # Секрет спрашивается до развёртывания, а не после: иначе воркер уехал бы
      # без ключа сессий и отвечал бы «SESSION_SECRET не настроен» на каждый
      # вход — то есть был бы, но не работал.
      - name: Check repository secret
        env:
          SESSION_SECRET: ${{ secrets.KINGDOMS_SESSION_SECRET }}
        run: |
          if [ -z "$SESSION_SECRET" ]; then
            echo "Нет секрета KINGDOMS_SESSION_SECRET."
            echo "Добавьте его: Settings → Secrets and variables → Actions → New repository secret."
            echo "Значение — любая длинная случайная строка, знаков тридцать и больше."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test room
        run: npm test

      - name: Create or update Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SESSION_SECRET: ${{ secrets.KINGDOMS_SESSION_SECRET }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET

      - name: Verify room service
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "https://alias-spy-games-kingdoms.vitaledanilov.workers.dev/health" -o /tmp/kingdoms-health; then
              grep -q '"ok":true' /tmp/kingdoms-health && exit 0
            fi
            sleep 5
          done
          echo "Комнаты «Царств» не отвечают"; cat /tmp/kingdoms-health 2>/dev/null; exit 1
