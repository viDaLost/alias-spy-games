name: Retire Kingdoms room endpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/kingdoms-worker/**'
      - '.github/workflows/deploy-kingdoms-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the retired endpoint
        run: npx --yes wrangler@4 deploy --config cloudflare/kingdoms-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the former room address returns HTTP 410
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://alias-spy-games-kingdoms.vitaledanilov.workers.dev/health) || status=000
            if [ "$status" = 410 ]; then exit 0; fi
            sleep 5
          done
          exit 1
