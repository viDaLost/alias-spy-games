name: Fix banned support routing
on:
  push:
    branches: [agent/support-center-v1]
    paths: ['.github/workflows/fix-support-banned.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Route blocked user support to support center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-app/app/src/main/java/com/vidalost/biblegames/App.kt')
          s=p.read_text()
          old='''            banned -> AccessRestrictedScreen {\n                prefs.edit().remove(ID_KEY).apply(); userId = ""\n            }'''
          new='''            banned -> AccessRestrictedScreen(\n                onLogout = { prefs.edit().remove(ID_KEY).apply(); userId = "" },\n                onSupport = { supportOpen = true },\n            )'''
          assert old in s
          s=s.replace(old,new,1)
          old='''private fun AccessRestrictedScreen(onLogout: () -> Unit) {\n    val context = LocalContext.current'''
          new='''private fun AccessRestrictedScreen(onLogout: () -> Unit, onSupport: () -> Unit) {'''
          assert old in s
          s=s.replace(old,new,1)
          assert '{ openSupport(context) }' in s
          s=s.replace('{ openSupport(context) }','onSupport',1)
          assert 'openSupport(' not in s
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/java/com/vidalost/biblegames/App.kt
          git commit -m 'Route blocked users to support center'
          git push origin HEAD:agent/support-center-v1
