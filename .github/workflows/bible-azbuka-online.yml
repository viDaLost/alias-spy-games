name: Bible Azbuka online

on:
  pull_request:
    paths:
      - 'cloudflare/bible-azbuka-online/**'
      - 'cloudflare/app-core-worker/**'
      - 'web/games/bible-azbuka.*'
      - 'web/js/room-invite.js'
      - '.github/workflows/bible-azbuka-online.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game and room service syntax
        run: |
          node --check web/games/bible-azbuka.js
          node --check cloudflare/bible-azbuka-online/worker.mjs
      - name: Check room access and multiplayer rules
        run: node cloudflare/bible-azbuka-online/scripts/test.mjs
