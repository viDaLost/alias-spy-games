name: Repair launcher image binaries

on:
  push:
    branches:
      - agent/repair-icon-binaries-2.6.2
    paths:
      - '.github/workflows/repair-launcher-binaries.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore valid launcher PNGs from original native payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/native-android-2.6.0
          : > /tmp/native.b64
          while IFS= read -r path; do
            git show "origin/agent/native-android-2.6.0:$path" >> /tmp/native.b64
          done < <(git ls-tree -r --name-only origin/agent/native-android-2.6.0 -- .native-upload | grep -E '^\.native-upload/payload-[0-9]+\.b64$' | sort)
          base64 --decode /tmp/native.b64 > /tmp/native.tar.xz
          mkdir -p /tmp/native
          tar -xJf /tmp/native.tar.xz -C /tmp/native

          SRC=/tmp/native/android-app/app/src/main/res/drawable-nodpi
          DST=android-app/app/src/main/res/drawable-nodpi
          test -f "$SRC/ic_launcher_art.png"
          test -f "$SRC/ic_launcher_adaptive.png"
          file "$SRC/ic_launcher_art.png" | grep -q 'PNG image data, 512 x 512'
          file "$SRC/ic_launcher_adaptive.png" | grep -q 'PNG image data, 512 x 512'

          mkdir -p "$DST"
          rm -f "$DST/ic_launcher_art.webp" "$DST/ic_launcher_adaptive.webp"
          cp "$SRC/ic_launcher_art.png" "$DST/ic_launcher_art.png"
          cp "$SRC/ic_launcher_adaptive.png" "$DST/ic_launcher_adaptive.png"

          # Advance the Android version so the fixed launcher icon is a real update.
          sed -i "s/versionCode 13/versionCode 14/" android-app/app/build.gradle
          sed -i "s/versionName '2.6.1-native'/versionName '2.6.2-native'/" android-app/app/build.gradle
          sed -i 's/BibleGames-Android-2\.6\.1-native/BibleGames-Android-2.6.2-native/g' .github/workflows/build-android-apk.yml

          # This helper must not remain in main.
          rm -f .github/workflows/repair-launcher-binaries.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore valid launcher PNG resources'
          git push origin HEAD:agent/repair-icon-binaries-2.6.2
