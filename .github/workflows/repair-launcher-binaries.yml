name: Repair launcher image binary

on:
  push:
    branches:
      - agent/repair-icon-binaries-2.6.2
    paths:
      - '.github/workflows/repair-launcher-binaries.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and install validated launcher icon
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .icon-repair -maxdepth 1 -name 'chunk-*.b64' | wc -l)" -eq 8
          cat .icon-repair/chunk-*.b64 | base64 --decode > /tmp/ic_launcher_art.webp
          test "$(stat -c%s /tmp/ic_launcher_art.webp)" -eq 44748
          echo '6061248a80c797d3467c9fcb9436e13d61ff81f0d0bce4052b797486d2bb09df  /tmp/ic_launcher_art.webp' | sha256sum -c -
          file /tmp/ic_launcher_art.webp | grep -qi 'Web/P image'

          DST=android-app/app/src/main/res/drawable-nodpi
          mkdir -p "$DST"
          rm -f "$DST/ic_launcher_art.webp" "$DST/ic_launcher_adaptive.webp"
          cp /tmp/ic_launcher_art.webp "$DST/ic_launcher_art.webp"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@color/launcher_background" />' \
            '    <foreground android:drawable="@drawable/ic_launcher_art" />' \
            '</adaptive-icon>' \
            > android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android-app/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <item android:drawable="@drawable/ic_launcher_art" />' \
            '</layer-list>' \
            > android-app/app/src/main/res/mipmap-anydpi/ic_launcher.xml

          sed -i 's/versionCode 13/versionCode 14/' android-app/app/build.gradle
          sed -i "s/versionName '2.6.1-native'/versionName '2.6.2-native'/" android-app/app/build.gradle
          sed -i 's/BibleGames-Android-2\.6\.1-native/BibleGames-Android-2.6.2-native/g' .github/workflows/build-android-apk.yml

          grep -q 'versionCode 14' android-app/app/build.gradle
          grep -q "versionName '2.6.2-native'" android-app/app/build.gradle
          grep -q '@drawable/ic_launcher_art' android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          rm -rf .icon-repair
          rm -f .github/workflows/repair-launcher-binaries.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore valid launcher icon binary'
          git push origin HEAD:agent/repair-icon-binaries-2.6.2
