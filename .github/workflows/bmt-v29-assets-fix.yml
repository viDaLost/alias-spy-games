name: Repair Biblical Treasures V29 completion art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bmt-v29-assets-fix.yml'

permissions:
  contents: write
  pages: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore valid V29 completion WebP files only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin bmt-v29-assets

          decode() {
            local prefix="$1" out="$2" list
            list="$(git ls-tree -r --name-only origin/bmt-v29-assets .bmt-v29-assets | grep -E "^\\.bmt-v29-assets/${prefix}\\.[0-9]+\\.txt$" | sort -V)"
            if [ -z "$list" ]; then
              echo "::error title=BMT V29 asset repair::No chunks for ${prefix}"
              exit 1
            fi
            : > /tmp/bmt.b64
            while IFS= read -r f; do
              git show "origin/bmt-v29-assets:$f" | tr -d '\r\n' >> /tmp/bmt.b64
            done <<< "$list"
            if ! base64 -d /tmp/bmt.b64 > "$out"; then
              echo "::error title=BMT V29 asset repair::Base64 decode failed for ${prefix}"
              exit 1
            fi
            rm -f /tmp/bmt.b64
          }

          check_webp() {
            local f="$1" size riff webp
            size="$(wc -c < "$f" | tr -d ' ')"
            riff="$(dd if="$f" bs=1 count=4 status=none 2>/dev/null || true)"
            webp="$(dd if="$f" bs=1 skip=8 count=4 status=none 2>/dev/null || true)"
            echo "$f => ${size} bytes; magic=${riff}/${webp}"
            if [ "$size" -lt 50000 ] || [ "$riff" != "RIFF" ] || [ "$webp" != "WEBP" ]; then
              echo "::error title=BMT V29 asset repair::Invalid repaired WebP ${f}: ${size} bytes, ${riff}/${webp}"
              exit 1
            fi
          }

          decode c1 web/assets/biblical-match-three/completion-1-star-v29.webp
          check_webp web/assets/biblical-match-three/completion-1-star-v29.webp
          decode c2 web/assets/biblical-match-three/completion-2-stars-v29.webp
          check_webp web/assets/biblical-match-three/completion-2-stars-v29.webp

          rm -f .github/workflows/bmt-v29-assets-fix.yml
          git add -A .github/workflows/bmt-v29-assets-fix.yml \
            web/assets/biblical-match-three/completion-1-star-v29.webp \
            web/assets/biblical-match-three/completion-2-stars-v29.webp
          git commit -m "Repair Biblical Treasures V29 completion images"
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
