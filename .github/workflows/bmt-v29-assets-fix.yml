name: Repair Biblical Treasures V29 completion art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bmt-v29-assets-fix.yml'

permissions:
  contents: write
  pages: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
      - name: Restore valid V29 completion art only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin bmt-v29-assets

          list="$(git ls-tree -r --name-only origin/bmt-v29-assets .bmt-v29-assets | grep -E '^\.bmt-v29-assets/c1\.[0-9]+\.txt$' | sort -V)"
          if [ -z "$list" ]; then
            echo "::error title=BMT V29 asset repair::No one-star chunks found"
            exit 1
          fi
          : > /tmp/bmt-c1.b64
          while IFS= read -r f; do
            git show "origin/bmt-v29-assets:$f" | tr -d '\r\n' >> /tmp/bmt-c1.b64
          done <<< "$list"
          if ! base64 -d /tmp/bmt-c1.b64 > web/assets/biblical-match-three/completion-1-star-v29.webp; then
            echo "::error title=BMT V29 asset repair::One-star Base64 decode failed"
            exit 1
          fi
          rm -f /tmp/bmt-c1.b64

          check_webp() {
            local f="$1" size riff webp
            size="$(wc -c < "$f" | tr -d ' ')"
            riff="$(dd if="$f" bs=1 count=4 status=none 2>/dev/null || true)"
            webp="$(dd if="$f" bs=1 skip=8 count=4 status=none 2>/dev/null || true)"
            echo "$f => ${size} bytes; magic=${riff}/${webp}"
            if [ "$size" -lt 20000 ] || [ "$riff" != "RIFF" ] || [ "$webp" != "WEBP" ]; then
              echo "::error title=BMT V29 asset repair::Invalid repaired WebP ${f}: ${size} bytes, ${riff}/${webp}"
              exit 1
            fi
          }
          check_webp web/assets/biblical-match-three/completion-1-star-v29.webp

          # Build the two-star result from the valid three-star artwork by restoring
          # the right silver star from the one-star image. The result compositions
          # share the same coordinates.
          if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
          "$IM" web/assets/biblical-match-three/completion-1-star-v29.webp -crop 112x112+398+374 +repage /tmp/bmt-silver-right.png
          "$IM" web/assets/biblical-match-three/completion-3-stars-v29.avif /tmp/bmt-silver-right.png -geometry +398+374 -composite -quality 90 web/assets/biblical-match-three/completion-2-stars-v29.webp
          check_webp web/assets/biblical-match-three/completion-2-stars-v29.webp

          rm -f .github/workflows/bmt-v29-assets-fix.yml
          git add -A .github/workflows/bmt-v29-assets-fix.yml \
            web/assets/biblical-match-three/completion-1-star-v29.webp \
            web/assets/biblical-match-three/completion-2-stars-v29.webp
          git commit -m "Repair Biblical Treasures V29 completion images"
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
