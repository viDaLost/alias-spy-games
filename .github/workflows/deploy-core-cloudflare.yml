name: Deploy app core backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-core-worker/**'
      - '.github/workflows/deploy-core-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/app-core-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        run: npm install --no-audit --no-fund
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/app-core-worker-build
      - name: Create or update Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure Telegram verification secret
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Configure Telegram support webhook and commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CORE_WORKER_URL: 'https://alias-spy-games-core.vitaledanilov.workers.dev'
        run: |
          node <<'NODE'
          const crypto = await import('node:crypto');
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const workerUrl = String(process.env.CORE_WORKER_URL || '').replace(/\/+$/, '');
          if (!token || !workerUrl) throw new Error('Telegram webhook environment is incomplete');

          const secretToken = crypto.createHash('sha256').update(token).digest('hex');
          const webhookUrl = `${workerUrl}/telegram/webhook`;

          async function telegram(method, payload = {}) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data?.ok !== true) {
              throw new Error(`${method} failed: ${data?.description || `HTTP ${response.status}`}`);
            }
            return data.result;
          }

          const previous = await telegram('getWebhookInfo');
          if (previous?.url && previous.url !== webhookUrl) {
            console.log(`Replacing previous Telegram webhook: ${previous.url}`);
          }

          await telegram('setWebhook', {
            url: webhookUrl,
            secret_token: secretToken,
            allowed_updates: ['message'],
            drop_pending_updates: false,
          });

          // Команды бота. /start раньше в списке не значился, хотя это первое,
          // что человек набирает, — в меню он показывался сам по себе, и рядом
          // с ним не было ничего.
          const publicCommands = [
            { command: 'start', description: 'Открыть приложение' },
            { command: 'support', description: 'Написать в техподдержку' },
            { command: 'cancel', description: 'Отменить отправку обращения' },
            { command: 'help', description: 'Список команд' },
          ];
          const adminCommands = [
            ...publicCommands,
            { command: 'write', description: 'Написать пользователю по его ID' },
          ];

          // Список ставится в две области сразу. Область по умолчанию — запас на
          // случай клиента, который не спросил про личные чаты; all_private_chats
          // старше её по важности и отвечает за то, что человек видит в боте.
          await telegram('setMyCommands', { commands: publicCommands });
          await telegram('setMyCommands', { commands: publicCommands, scope: { type: 'all_private_chats' } });

          // /write видит только главный администратор: команда пишет человеку от
          // имени приложения, и показывать её всем в меню бота незачем. Область
          // чата старше остальных, поэтому его список полностью свой. Номер
          // берётся из настроек воркера, чтобы он был записан в одном месте.
          const fs = await import('node:fs');
          const wrangler = fs.readFileSync('cloudflare/app-core-worker/wrangler.jsonc', 'utf8');
          const adminId = wrangler.match(/"ADMIN_TELEGRAM_ID":\s*"(\d{5,20})"/)?.[1] || '';
          if (!adminId) throw new Error('ADMIN_TELEGRAM_ID not found in wrangler.jsonc');
          await telegram('setMyCommands', {
            commands: adminCommands,
            scope: { type: 'chat', chat_id: Number(adminId) },
          });

          // Список молча не применяется: область могла оказаться занята прежней
          // настройкой, и тогда в меню остаётся старое. Раз проверить это можно,
          // деплой должен падать, а не оставлять бота без команд.
          const names = (list) => (list || []).map((item) => item.command).join(',');
          const seenPublic = await telegram('getMyCommands', { scope: { type: 'all_private_chats' } });
          if (names(seenPublic) !== names(publicCommands)) {
            throw new Error(`Bot commands mismatch: expected ${names(publicCommands)}, got ${names(seenPublic) || 'empty'}`);
          }
          const seenAdmin = await telegram('getMyCommands', { scope: { type: 'chat', chat_id: Number(adminId) } });
          if (names(seenAdmin) !== names(adminCommands)) {
            throw new Error(`Admin bot commands mismatch: expected ${names(adminCommands)}, got ${names(seenAdmin) || 'empty'}`);
          }
          console.log(`Bot commands: ${names(publicCommands)}; admin ${adminId}: ${names(adminCommands)}`);

          const configured = await telegram('getWebhookInfo');
          if (configured?.url !== webhookUrl) {
            throw new Error(`Telegram webhook mismatch: ${configured?.url || 'empty'}`);
          }
          console.log(`Telegram support webhook configured: ${configured.url}`);
          NODE
      - name: Verify Android authenticated boundary
        env:
          CORE_WORKER_URL: 'https://alias-spy-games-core.vitaledanilov.workers.dev'
        run: |
          node <<'NODE'
          const base = process.env.CORE_WORKER_URL;
          const origin = 'https://vidalost.github.io';
          if (!base) throw new Error('CORE_WORKER_URL is missing');

          async function assertStatus(path, options, expected, label) {
            const response = await fetch(`${base}${path}`, options);
            const data = await response.json().catch(() => ({}));
            if (response.status !== expected) {
              throw new Error(`${label}: expected HTTP ${expected}, received ${response.status}: ${data?.error || ''}`);
            }
          }

          async function verify() {
            await assertStatus('/android/access', {
              headers: { Origin: origin, Accept: 'application/json' },
            }, 401, 'Unauthenticated access check');

            await assertStatus('/android/auth/me', {
              headers: { Accept: 'application/json' },
            }, 401, 'Unauthenticated session identity');

            await assertStatus('/android/compat', {
              method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' },
              body: JSON.stringify({ androidUserId: '12345', payload: { action: 'supportList' } }),
            }, 401, 'Unauthenticated Android user API');

            await assertStatus('/android/auth/request', {
              method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' },
              body: JSON.stringify({ telegramId: 'invalid' }),
            }, 400, 'Malformed Telegram auth request');
          }

          let lastError;
          for (let attempt = 1; attempt <= 5; attempt += 1) {
            try {
              await verify();
              console.log('Android auth boundary verified on deployed Worker.');
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 5) await new Promise((resolve) => setTimeout(resolve, 2000));
            }
          }
          throw lastError;
          NODE
      - name: Verify hardened admin RBAC boundary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_ID: '1288379477'
          CORE_WORKER_URL: 'https://alias-spy-games-core.vitaledanilov.workers.dev'
        run: |
          node <<'NODE'
          const crypto = await import('node:crypto');
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const adminId = process.env.ADMIN_TELEGRAM_ID;
          const workerUrl = process.env.CORE_WORKER_URL;
          const origin = 'https://vidalost.github.io';
          if (!botToken || !adminId || !workerUrl) throw new Error('Admin RBAC verification environment is incomplete');

          function createInitData(id = adminId) {
            const params = new URLSearchParams();
            params.set('auth_date', String(Math.floor(Date.now() / 1000)));
            params.set('user', JSON.stringify({ id: Number(id), first_name: 'RBAC verification' }));
            const checkString = [...params.entries()]
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([key, value]) => `${key}=${value}`)
              .join('\n');
            const secret = crypto.createHmac('sha256', 'WebAppData').update(botToken).digest();
            params.set('hash', crypto.createHmac('sha256', secret).update(checkString).digest('hex'));
            return params.toString();
          }

          async function compat(body) {
            const response = await fetch(`${workerUrl}/compat`, {
              method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            return { response, data: await response.json().catch(() => ({})) };
          }

          let result = await compat({
            telegramInitData: createInitData(),
            payload: { action: 'adminRoleStatus', adminId: '999999999' },
          });
          if (!result.response.ok || result.data?.isAdmin !== true || result.data?.isRoot !== true || String(result.data?.userId) !== String(adminId)) {
            throw new Error(`Root RBAC verification failed: HTTP ${result.response.status} ${JSON.stringify(result.data)}`);
          }

          result = await compat({
            telegramInitData: '',
            payload: { action: 'getAdminData', adminId },
          });
          if (result.response.status !== 401) {
            throw new Error(`Client-supplied adminId bypassed signed Telegram proof: HTTP ${result.response.status}`);
          }

          result = await compat({
            telegramInitData: 'auth_date=1&user=%7B%22id%22%3A1288379477%7D&hash=' + '0'.repeat(64),
            payload: { action: 'adminRoleGrant', targetId: adminId, adminId },
          });
          if (result.response.status !== 401) {
            throw new Error(`Forged Telegram signature reached role mutation: HTTP ${result.response.status}`);
          }

          console.log('Admin RBAC boundary verified: root is server-derived and forged/client-only identity cannot authorize admin actions.');
          NODE
      - name: Verify registration code delivery to administrator
        env:
          ADMIN_TELEGRAM_ID: '1288379477'
          CORE_WORKER_URL: 'https://alias-spy-games-core.vitaledanilov.workers.dev'
        run: |
          node <<'NODE'
          const adminId = process.env.ADMIN_TELEGRAM_ID;
          const workerUrl = process.env.CORE_WORKER_URL;
          const challengeId = `ach_${crypto.randomUUID().replaceAll('-', '')}`;
          const response = await fetch(`${workerUrl}/android/auth/request`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Origin': 'https://vidalost.github.io',
            },
            body: JSON.stringify({ telegramId: adminId, challengeId }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || data?.success !== true) {
            throw new Error(`Registration delivery failed: HTTP ${response.status} ${data?.error || ''}`);
          }
          if (data?.adminCopyDelivered !== true) {
            throw new Error('Registration code reached the player but not the configured administrator');
          }
          console.log(`Registration code and administrator copy delivered for Telegram ID ${adminId}.`);
          NODE
      - name: Verify SQL user migration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_ID: '1288379477'
          CORE_WORKER_URL: 'https://alias-spy-games-core.vitaledanilov.workers.dev'
        run: |
          node <<'NODE'
          const crypto = await import('node:crypto');

          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const adminId = process.env.ADMIN_TELEGRAM_ID;
          const workerUrl = process.env.CORE_WORKER_URL;
          if (!botToken || !adminId || !workerUrl) throw new Error('Migration verification environment is incomplete');

          function createInitData() {
            const params = new URLSearchParams();
            params.set('auth_date', String(Math.floor(Date.now() / 1000)));
            params.set('user', JSON.stringify({ id: Number(adminId), first_name: 'Deploy verification' }));
            const checkString = [...params.entries()]
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([key, value]) => `${key}=${value}`)
              .join('\n');
            const secret = crypto.createHmac('sha256', 'WebAppData').update(botToken).digest();
            const hash = crypto.createHmac('sha256', secret).update(checkString).digest('hex');
            params.set('hash', hash);
            return params.toString();
          }

          async function verify() {
            const response = await fetch(`${workerUrl}/compat`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Origin': 'https://vidalost.github.io',
              },
              body: JSON.stringify({
                telegramInitData: createInitData(),
                payload: { action: 'getAdminData', adminId },
              }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data?.success === false) {
              throw new Error(`Core verification failed: HTTP ${response.status} ${data?.error || ''}`.trim());
            }
            if (data?.source !== 'cloudflare-sql-rbac') throw new Error(`Unexpected storage source: ${data?.source || 'missing'}`);
            if (data?.storage?.engine !== 'sqlite-sql') throw new Error(`Unexpected storage engine: ${data?.storage?.engine || 'missing'}`);
            const sqlCount = Number(data?.storage?.sqlUserCount || 0);
            const usersCount = Array.isArray(data?.users) ? data.users.length : 0;
            if (sqlCount <= 0 || usersCount <= 0) throw new Error(`SQL migration produced no users: sql=${sqlCount}, admin=${usersCount}`);
            if (sqlCount !== usersCount) throw new Error(`SQL/admin count mismatch: sql=${sqlCount}, admin=${usersCount}`);
            if (data?.storage?.kvBackupRetained !== true) throw new Error('KV backup retention was not confirmed');
            console.log(`SQL migration verified: ${sqlCount} users; KV backup: ${Number(data?.storage?.kvBackupCount || 0)} records.`);
          }

          let lastError;
          for (let attempt = 1; attempt <= 5; attempt += 1) {
            try {
              await verify();
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 5) await new Promise((resolve) => setTimeout(resolve, 2000));
            }
          }
          throw lastError;
          NODE
