name: Deploy Moses Nile V7.4 Isolated Preview

on:
  workflow_dispatch:
  push:
    branches: [feature/moses-nile-runner-mvp]
    paths:
      - 'web/games/moses-nile-v7/**'
      - '.github/workflows/deploy-moses-nile-v740-isolated.yml'
      - '.github/workflows/deploy-moses-nile-v740-preview.yml'

permissions:
  contents: write

jobs:
  deploy-isolated-v740:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reuse verified V7.4 build recipe
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          p='.github/workflows/deploy-moses-nile-v740-preview.yml'
          with open(p,encoding='utf-8') as f: doc=yaml.safe_load(f)
          steps=doc['jobs']['deploy-v740']['steps']
          step=next(s for s in steps if s.get('name')=='Build V7.4 preview')
          with open('/tmp/v740-build.sh','w',encoding='utf-8') as f: f.write(step['run'])
          PY
          bash /tmp/v740-build.sh

          # V7.4 owns all user-visible version/status UI. Preserve the gameplay logic
          # from legacy layers where it is still useful, but remove their badge writers.
          python - <<'PY'
          from pathlib import Path

          p=Path('.preview-v7/js/v737-gameplay-polish.js')
          s=p.read_text(encoding='utf-8')
          old="""  function updateBadge() {\n    const badge = document.getElementById('version-badge');\n    if (!badge || !window.__mosesV736TexturesReady) return;\n    badge.dataset.state = 'ready';\n    badge.textContent = 'V7.3.7 · CROCS CHOMP · CLEAN BANKS · SAFE EDGES';\n  }"""
          new="""  function updateBadge() {\n    // V7.4 owns #version-badge. Keep V7.3.7 gameplay polish, never overwrite UI version.\n    return;\n  }"""
          if old not in s:
              raise SystemExit('Expected V7.3.7 badge writer was not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('.preview-v7/js/v7313-visual-quality.js')
          s=p.read_text(encoding='utf-8')
          old="""const b=document.getElementById('version-badge');if(b){b.dataset.state='ready';b.textContent='V7.3.13 · VISUAL QUALITY';}"""
          if old in s:
              s=s.replace(old,"""const b=document.getElementById('version-badge');if(b){b.dataset.v7313='ready';}""")
          p.write_text(s,encoding='utf-8')
          PY

          python - <<'PY'
          import json
          p='wrangler-v7.jsonc'
          with open(p,encoding='utf-8') as f: cfg=json.load(f)
          cfg['name']='alias-spy-games-moses-nile-v740-preview'
          with open('wrangler-v740-isolated.jsonc','w',encoding='utf-8') as f: json.dump(cfg,f)
          PY

          grep -q 'V7.4 · LOADING' .preview-v7/index.html
          ! grep -q 'V7.3.7 · CROCS CHOMP' .preview-v7/js/v737-gameplay-polish.js
          ! grep -q "badge.textContent='V7.3.13" .preview-v7/js/v7313-visual-quality.js
          ! grep -q 'V7.3.8 · LOADING' .preview-v7/js/v738-cinematic.js

      - name: Deploy isolated V7.4 worker
        id: deploy
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler-v740-isolated.jsonc

      - name: Verify isolated endpoint and actual runtime badge
        id: verify
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          P='https://alias-spy-games-moses-nile-v740-preview.vitaledanilov.workers.dev/'
          for i in 1 2 3 4 5 6 7 8; do
            Q="?isolated=${GITHUB_SHA}-${i}"
            if curl -fsSL --max-time 20 "${P}${Q}" -o /tmp/index.html \
              && grep -q 'V7.4 · LOADING' /tmp/index.html \
              && curl -fsSL --max-time 20 "${P}js/v737-gameplay-polish.js${Q}" -o /tmp/v737.js \
              && ! grep -q 'V7.3.7 · CROCS CHOMP' /tmp/v737.js \
              && curl -fsSL --max-time 20 "${P}js/v7313-visual-quality.js${Q}" -o /tmp/v7313.js \
              && ! grep -q "badge.textContent='V7.3.13" /tmp/v7313.js; then break; fi
            sleep 5
          done
          grep -q 'V7.4 · LOADING' /tmp/index.html
          ! grep -q 'V7.3.7 · CROCS CHOMP' /tmp/v737.js

          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          URL="${P}?visualAudit=1&isolated=${GITHUB_SHA}"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=35000 --dump-dom "$URL" > /tmp/dom.html

          # Validate the actual rendered version badge, not an unrelated V7.4 string elsewhere in DOM.
          grep -Eq '<div id="version-badge"[^>]*>V7\.4[^<]*</div>' /tmp/dom.html
          ! grep -Eq '<div id="version-badge"[^>]*>V7\.3\.7' /tmp/dom.html
          ! grep -Eq '<div id="version-badge"[^>]*>V7\.3\.8' /tmp/dom.html
          ! grep -Eq '<div id="version-badge"[^>]*>V7\.3\.13' /tmp/dom.html

      - name: Publish isolated verification marker
        if: always()
        env:
          B: ${{ steps.build.outcome }}
          D: ${{ steps.deploy.outcome }}
          V: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          printf 'commit=%s\nversion=V7.4\nbuild=%s\ndeploy=%s\nverify=%s\nruntime_badge=V7.4\nlegacy_v737_badge=removed\nlegacy_v738_badge=removed\nlegacy_v7313_badge=removed\npreview=https://alias-spy-games-moses-nile-v740-preview.vitaledanilov.workers.dev/\n' "$GITHUB_SHA" "$B" "$D" "$V" > /tmp/status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B verify/moses-nile-v740-isolated
          mkdir -p deploy-status
          cp /tmp/status.txt deploy-status/moses-nile-v740-isolated.txt
          git add deploy-status/moses-nile-v740-isolated.txt
          git commit -m 'Record isolated Moses Nile V7.4 verification' || true
          git push --force origin HEAD:refs/heads/verify/moses-nile-v740-isolated

      - name: Require isolated V7.4 verification
        if: always()
        env:
          B: ${{ steps.build.outcome }}
          D: ${{ steps.deploy.outcome }}
          V: ${{ steps.verify.outcome }}
        run: test "$B" = success && test "$D" = success && test "$V" = success
