name: Fix Android Spy role handoff

on:
  push:
    branches: [agent/fix-spy-role-handoff-2.6.3]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/fix-spy-role-handoff.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Spy role card layout and secure handoff'
          git push origin HEAD:agent/fix-spy-role-handoff-2.6.3
