name: Biblical V20 lamp state cleanup
on:
  push:
    branches:
      - fix/biblical-v20-lamps-move-rules
    paths:
      - .github/workflows/biblical-v20-lamp-state-cleanup.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/biblical-v20-lamps-move-rules
          fetch-depth: 0
      - name: Remove empty unlit lamp state marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/games/biblical-match-three.js')
          text=p.read_text()
          old='  if (blocker.type === "lamp") return `<span class="bmt-blocker__lamp" data-blocker-type="lamp" data-blocker-lit="${blocker.lit ? "true" : "false"}">${blocker.lit ? "" : (art || \'<i class="bmt-blocker-fallback">✦</i>\')}<i class="bmt-blocker__lamp-state" aria-hidden="true">${blocker.lit ? "✦" : ""}</i></span>`;'
          new='  if (blocker.type === "lamp") return `<span class="bmt-blocker__lamp" data-blocker-type="lamp" data-blocker-lit="${blocker.lit ? "true" : "false"}">${blocker.lit ? \'<i class="bmt-blocker__lamp-state" aria-hidden="true">✦</i>\' : (art || \'<i class="bmt-blocker-fallback">✦</i>\')}</span>`;'
          if text.count(old)!=1: raise SystemExit(f'lamp markup marker count {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
          node --check web/games/biblical-match-three.js
          node scripts/check-biblical-match-three.mjs
          git diff --check
      - name: Commit lamp cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/games/biblical-match-three.js
          git commit -m "Remove empty unlit lamp markers"
          git push origin HEAD:fix/biblical-v20-lamps-move-rules
