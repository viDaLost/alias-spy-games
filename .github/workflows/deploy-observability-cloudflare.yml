name: Deploy app observability backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-observability-worker/**'
      - '.github/workflows/deploy-observability-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/app-observability-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker tooling
        run: npm install --no-audit --no-fund
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/app-observability-worker-build
      - name: Create or update Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure Telegram verification secret
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Configure administrator identity secret
        run: |
          # Номер администратора больше не лежит в wrangler.jsonc — он хранится
          # секретом. Если секрета нет, деплой должен падать: молча оставленный
          # без владельца воркер закрывает панель управления для всех.
          if ! printf '%s' "$ADMIN_TELEGRAM_ID" | grep -Eq '^[0-9]{5,20}$'; then
            echo "::error::Секрет ADMIN_TELEGRAM_ID не задан или не похож на Telegram ID. Задайте его в Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$ADMIN_TELEGRAM_ID" | npx wrangler secret put ADMIN_TELEGRAM_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
