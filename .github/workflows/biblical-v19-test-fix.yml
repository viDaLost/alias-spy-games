name: Biblical V19 obstacle QA fix
on:
  push:
    branches:
      - fix/biblical-v19-visible-obstacles
    paths:
      - .github/workflows/biblical-v19-test-fix.yml
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/biblical-v19-visible-obstacles
      - name: Fix obstacle source assertion scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-biblical-match-three-visual.mjs')
          t=p.read_text()
          old="hardState.obstacles.some(x=>!goodSrc(x.src)||x.w<64||x.h<64||x.tag!=='webp-v17'||x.visibility==='hidden'||x.opacity<.95)"
          new="hardState.obstacles.some(x=>!String(x.src||'').includes('/icons-v17/')||!/\\.webp(?:\\?|$)/i.test(String(x.src||''))||x.w<64||x.h<64||x.tag!=='webp-v17'||x.visibility==='hidden'||x.opacity<.95)"
          if t.count(old)!=1: raise SystemExit('V19 obstacle QA marker not found exactly once')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-biblical-match-three-visual.mjs
          git commit -m "Fix V19 obstacle visual QA scope"
          git push origin HEAD:fix/biblical-v19-visible-obstacles
