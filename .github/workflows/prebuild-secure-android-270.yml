name: Prebuild secure Android 2.7.0

on:
  push:
    branches: [agent/secure-android-telegram-auth-2.7.0]
    paths:
      - '.github/workflows/prebuild-secure-android-270.yml'

permissions:
  contents: read

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secure-android-telegram-auth-2.7.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 1; }
          done
      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/biblegames-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Validate release key
        shell: bash
        run: |
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null
      - name: Build signed APK and AAB
        run: gradle -p android-app :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/app-release.apk dist/BibleGames-Android-2.7.0-native.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab dist/BibleGames-Android-2.7.0-native.aab
          sha256sum dist/BibleGames-Android-2.7.0-native.apk | tee dist/BibleGames-Android-2.7.0-native.apk.sha256
          sha256sum dist/BibleGames-Android-2.7.0-native.aab | tee dist/BibleGames-Android-2.7.0-native.aab.sha256
      - name: Verify release signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs dist/BibleGames-Android-2.7.0-native.apk 2>&1)"
          printf '%s\n' "$VERIFY_OUTPUT"
          if printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Android Debug|CN=Android Debug'; then
            echo 'Refusing debug-signed APK'
            exit 1
          fi
      - name: Remove restored keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/biblegames-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: BibleGames-Android-2.7.0-native-signed-predeploy
          path: dist/*
          if-no-files-found: error
          retention-days: 30
