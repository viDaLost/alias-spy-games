name: Deploy Moses Nile V7.5 Preview

on:
  workflow_dispatch:
  push:
    branches: [feature/moses-nile-runner-mvp]
    paths:
      - 'web/games/moses-nile-v7/**'
      - '.github/workflows/deploy-moses-nile-v740-preview.yml'

permissions:
  contents: write

jobs:
  deploy-v740:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build V7.5 preview
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .preview-v7
          mkdir -p .preview-v7/js .preview-v7/assets .preview-v7/vendor .preview-v7/textures/water .preview-v7/textures/terrain .preview-v7/models
          cp web/games/moses-nile-v7/index.html .preview-v7/index.html
          cp -R web/games/moses-nile-v7/js/. .preview-v7/js/
          cp -R web/games/moses-nile-v7/assets/. .preview-v7/assets/
          cp web/assets/models/moses-nile/woven-basket.obj .preview-v7/models/basket.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-v7/models/woven-basket.obj
          printf '/*\n  Cache-Control: no-store, no-cache, max-age=0, must-revalidate\n' > .preview-v7/_headers

          THREE_REV=r128; RAW="https://raw.githubusercontent.com/mrdoob/three.js/${THREE_REV}"
          curl -fsSL --retry 3 "$RAW/build/three.min.js" -o .preview-v7/vendor/three-r128.min.js
          curl -fsSL --retry 3 "$RAW/examples/js/loaders/GLTFLoader.js" -o .preview-v7/vendor/GLTFLoader-r128.js
          curl -fsSL --retry 3 "$RAW/examples/js/loaders/OBJLoader.js" -o .preview-v7/vendor/OBJLoader-r128.js

          WATER_REV=83d8667898fd32a6a0f1af92f6d91065db272ce2
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${WATER_REV}/examples/textures/water/Water_1_M_Normal.jpg" -o .preview-v7/textures/water/water-normal.jpg
          declare -A ASSET=([wet_mud]=brown_mud_02 [wet_sand]=coast_sand_01 [sand]=sand_01 [cracked_mud]=mud_cracked_dry_03 [gravel]=gravelly_sand)
          for layer in wet_mud wet_sand sand cracked_mud gravel; do
            asset="${ASSET[$layer]}"; dir=".preview-v7/textures/terrain/$layer"; mkdir -p "$dir"; base="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/${asset}"
            curl -fsSL --retry 3 "$base/${asset}_diff_1k.jpg" -o "$dir/color.jpg"
          done

          for file in .preview-v7/js/*.js; do node --check "$file"; done
          grep -q 'V7.5 · LOADING' .preview-v7/index.html
          grep -q 'game-v75.js?v=751' .preview-v7/index.html
          grep -q '__mosesV75ReferenceRebuild' .preview-v7/js/game-v75.js
          grep -q 'V75DistantPyramid' .preview-v7/js/game-v75.js
          grep -q 'oneRenderLoop: true' .preview-v7/js/game-v75.js
          grep -q 'fallback-mode' .preview-v7/index.html
          test -s .preview-v7/assets/nile-reference-bg-v75.webp
          test "$(stat -c %s .preview-v7/assets/nile-reference-bg-v75.webp)" -lt 250000
          ! grep -q 'type="module"' .preview-v7/index.html
          ! grep -q 'v740-visual-overhaul.js' .preview-v7/index.html
          test "$(find .preview-v7/js -maxdepth 1 -name '*.js' | wc -l)" -eq 3
          cat > wrangler-v7.jsonc <<'JSON'
          {"$schema":"./node_modules/wrangler/config-schema.json","name":"alias-spy-games-moses-nile-v7-preview","compatibility_date":"2026-08-19","workers_dev":true,"assets":{"directory":"./.preview-v7","not_found_handling":"single-page-application"}}
          JSON
      - name: Deploy V7.5 preview
        id: deploy
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler-v7.jsonc
      - name: Verify V7.5 endpoint
        id: verify
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          P='https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/'
          for i in 1 2 3 4 5 6; do
            q="?v750=${GITHUB_SHA}-${i}"
            if curl -fsSL --max-time 20 "${P}${q}" -o /tmp/i && grep -q 'V7.5 · LOADING' /tmp/i \
              && curl -fsSL --max-time 20 "${P}js/game-v75.js${q}" -o /tmp/v && grep -q '__mosesV75ReferenceRebuild' /tmp/v \
              && curl -fsSL --max-time 20 "${P}assets/nile-reference-bg-v75.webp${q}" -o /tmp/bg && test -s /tmp/bg; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Publish V7.5 marker
        if: always()
        env:
          B: ${{ steps.build.outcome }}
          D: ${{ steps.deploy.outcome }}
          V: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          printf 'commit=%s\nversion=V7.5\nbuild=%s\ndeploy=%s\nverify=%s\nrenderer=single-loop\nfallback=playable-cinematic\nwater=silty-green-brown\nbasket=closed-at-waterline\nbackground=reference-driven\npyramids=restored-distance\ndecor=instanced-bank-detail\npreview=https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/?v=751\n' "$GITHUB_SHA" "$B" "$D" "$V" > /tmp/status.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B verify/moses-nile-v750
          mkdir -p deploy-status; cp /tmp/status.txt deploy-status/moses-nile-v750.txt
          git add deploy-status/moses-nile-v750.txt; git commit -m 'Record Moses Nile V7.5 deploy status' || true; git push --force origin HEAD:refs/heads/verify/moses-nile-v750
      - name: Require verified V7.5
        if: always()
        env:
          B: ${{ steps.build.outcome }}
          D: ${{ steps.deploy.outcome }}
          V: ${{ steps.verify.outcome }}
        run: test "$B" = success && test "$D" = success && test "$V" = success
