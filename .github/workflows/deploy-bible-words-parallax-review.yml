name: Deploy Bible Words Parallax Review

on:
  push:
    branches:
      - preview/bible-words-parallax-review-v1
    paths:
      - preview/bible-words-parallax/**
      - .github/workflows/deploy-bible-words-parallax-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bible-words-parallax-review
  cancel-in-progress: true

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: preview/bible-words-parallax

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.0.0

      - name: Validate layers and levels
        run: python validate_layers.py

      - name: Validate source
        run: |
          node --check public/app.js
          node --check worker.js
          grep -q 'bible-words-parallax-review-v1' public/index.html
          grep -q 'requestAnimationFrame(renderParallax)' public/app.js
          ! grep -Rq 'setInterval' public worker.js
          ! grep -Eq 'animation:[^;]*infinite' public/styles.css
          test "$(find public/layers -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 10

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.102.0 deploy --dry-run

      - name: Deploy isolated review Worker
        run: npx --yes wrangler@4.102.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live review
        env:
          PREVIEW_URL: https://alias-spy-games-bible-words-parallax-preview.vitaledanilov.workers.dev
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ["PREVIEW_URL"].rstrip("/")

          def get(path):
              request = urllib.request.Request(base + path, headers={"User-Agent": "bible-words-preview-ci"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.status, response.headers, response.read()

          def get_ready(path):
              last_error = None
              for _ in range(12):
                  try:
                      return get(path)
                  except Exception as error:
                      last_error = error
                      time.sleep(5)
              raise RuntimeError(f"Asset did not become ready: {path}: {last_error}")

          last_error = None
          for _ in range(12):
              try:
                  status, headers, body = get("/__preview_version")
                  data = json.loads(body)
                  assert status == 200
                  assert data["version"] == "bible-words-parallax-review-v1"
                  assert data["game"] == "bible-words"
                  assert data["review"] is True
                  assert data["productionMainTouched"] is False
                  assert data["levels"] == 100
                  assert data["layers"] == 10
                  assert data["continuousVisualLoops"] == 0
                  assert data["parallax"] == "event-driven-smoothed-raf"
                  break
              except Exception as error:
                  last_error = error
                  time.sleep(5)
          else:
              raise RuntimeError(f"Preview did not become ready: {last_error}")

          checks = {
              "/": ("text/html", b"bible-words-parallax-review-v1"),
              "/app.js?v=words1": ("javascript", b"generateLayout"),
              "/styles.css?v=words1": ("text/css", b".word-wheel"),
              "/data/bible_wow_levels.json": ("application/json", b'"levels"'),
          }
          for path, (content_type, marker) in checks.items():
              status, headers, body = get_ready(path)
              assert status == 200, (path, status)
              assert content_type in headers.get_content_type(), (path, headers.get("Content-Type"))
              assert marker in body, path

          for name in [
              "01-temple-base", "02-distant-sanctuary", "03-left-arch", "04-right-arch",
              "05-scriptorium-ledge", "06-moonbeams", "07-dust-motes",
              "event-correct-inscription", "event-error-shards", "event-level-complete",
          ]:
              status, headers, body = get_ready(f"/layers/{name}.webp")
              assert status == 200, (name, status)
              assert headers.get_content_type() == "image/webp", (name, headers.get("Content-Type"))
              assert len(body) > 1_000, (name, len(body))

          print("Live Bible Words review verified")
          PY
