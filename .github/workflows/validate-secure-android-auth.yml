name: Validate secure Android Telegram auth

on:
  push:
    branches: [agent/secure-android-telegram-auth-2.7.0]
    paths:
      - '.github/workflows/validate-secure-android-auth.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secure-android-telegram-auth-2.7.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply secure auth migration
        run: python scripts/apply-secure-android-auth.py

      - name: Static security assertions
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/app-core-worker/src/index-v4.js
          node --check cloudflare/app-core-worker/src/android-auth-user-store.js
          node --check cloudflare/app-observability-worker/src/index-v3.js
          grep -q "Authorization.*Bearer" android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt
          grep -q "AndroidSessionStore" android-app/app/src/main/java/com/vidalost/biblegames/App.kt
          grep -q "android/auth/verify" cloudflare/app-core-worker/src/index-v4.js
          grep -q "requireAndroidSession" cloudflare/app-core-worker/src/index-v4.js
          if grep -q 'android/access?id=' android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt; then
            echo 'Legacy ID-only access endpoint is still referenced' >&2
            exit 1
          fi

      - name: Existing regression checks
        run: |
          node scripts/check-android-ban-enforcement.mjs
          node scripts/check-support-center.mjs

      - name: Build and lint Android
        run: gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon

      - name: Validate core Worker bundle
        working-directory: cloudflare/app-core-worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/core-auth-build

      - name: Validate observability Worker bundle
        working-directory: cloudflare/app-observability-worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/observability-auth-build

      - name: Commit secure auth implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "viDaLost"
          git config user.email "vitaledanilov@gmail.com"
          git add \
            android-app/app/src/main/java/com/vidalost/biblegames/App.kt \
            android-app/app/src/main/java/com/vidalost/biblegames/MainActivity.kt \
            android-app/app/src/main/java/com/vidalost/biblegames/data/AppPresenceClient.kt \
            android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt \
            android-app/app/build.gradle \
            cloudflare/app-core-worker/src/index-v4.js \
            cloudflare/app-observability-worker/src/index-v3.js \
            cloudflare/app-observability-worker/wrangler.jsonc \
            .github/workflows/build-android-apk.yml
          git commit -m "Require Telegram code verification for Android sessions"
          git push origin HEAD:agent/secure-android-telegram-auth-2.7.0

