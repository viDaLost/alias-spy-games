name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.android-release-trigger'
  pull_request:
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'web/**'
      - 'scripts/sync-android-assets.mjs'
      - 'cloudflare/app-core-worker/**'
      - 'cloudflare/app-observability-worker/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  validate-debug-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build debug APK without release secrets
        run: gradle -p android-app :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon

  build-signed-release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/biblegames-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Validate release key
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" >/dev/null

      - name: Test and build signed APK and AAB
        run: gradle -p android-app :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/app-release.apk dist/BibleGames-Android-2.9.0-native.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab dist/BibleGames-Android-2.9.0-native.aab
          sha256sum dist/BibleGames-Android-2.9.0-native.apk | tee dist/BibleGames-Android-2.9.0-native.apk.sha256
          sha256sum dist/BibleGames-Android-2.9.0-native.aab | tee dist/BibleGames-Android-2.9.0-native.aab.sha256

      - name: Verify APK signature and reject debug certificates
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in Android SDK"
            exit 1
          fi
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs dist/BibleGames-Android-2.9.0-native.apk 2>&1)"
          printf '%s\n' "$VERIFY_OUTPUT"
          if printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Android Debug|CN=Android Debug'; then
            echo "Refusing to publish an APK signed with an Android debug certificate."
            exit 1
          fi

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/biblegames-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: BibleGames-Android-2.9.0-native-signed
          path: |
            dist/BibleGames-Android-2.9.0-native.apk
            dist/BibleGames-Android-2.9.0-native.aab
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-latest"
          TITLE="Библейские игры для Android"
          NOTES="Официальная подписанная сборка Android. Стабильная ссылка из главного меню мини-приложения всегда ведёт на актуальный APK."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          gh release upload "$TAG" \
            dist/BibleGames-Android-2.9.0-native.apk \
            dist/BibleGames-Android-2.9.0-native.apk.sha256 \
            --clobber
