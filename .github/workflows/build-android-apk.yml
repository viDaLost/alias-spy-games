name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - 'android-runtime.js'
      - 'backend-bridge.js'
      - 'index.html'
      - 'cloudflare/app-core-worker/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable release APK
        run: gradle -p android-app :app:assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/app-release.apk dist/BibleGames-Android-1.0.1.apk
          ls -lh dist/BibleGames-Android-1.0.1.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in Android SDK"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs dist/BibleGames-Android-1.0.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BibleGames-Android-1.0.1
          path: dist/BibleGames-Android-1.0.1.apk
          if-no-files-found: error
          retention-days: 30
