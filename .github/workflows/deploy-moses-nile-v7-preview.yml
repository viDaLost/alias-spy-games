name: Deploy Moses Nile V7.3.3 Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/moses-nile-runner-mvp
    paths:
      - 'web/games/moses-nile-v7/**'
      - 'web/assets/models/moses-nile/woven-basket.obj'
      - 'docs/moses-nile-3d-assets.md'
      - '.github/workflows/deploy-moses-nile-v7-preview.yml'

permissions:
  contents: read

jobs:
  deploy-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout current V7.3.3 preview source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build V7.3.3 enhanced world
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .preview-v7
          mkdir -p \
            .preview-v7/js \
            .preview-v7/vendor \
            .preview-v7/models/environment/nature_pack \
            .preview-v7/models/environment/survival_pack \
            .preview-v7/models/v73

          cp web/games/moses-nile-v7/index.html .preview-v7/index.html
          cp web/games/moses-nile-v7/js/*.js .preview-v7/js/
          cp web/games/moses-nile-v7/models/lotus-flower.obj .preview-v7/models/v73/lotus-flower.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-v7/models/basket.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-v7/models/woven-basket.obj

          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/build/three.min.js -o .preview-v7/vendor/three-r128.min.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/GLTFLoader.js -o .preview-v7/vendor/GLTFLoader-r128.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/OBJLoader.js -o .preview-v7/vendor/OBJLoader-r128.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/utils/SkeletonUtils.js -o .preview-v7/vendor/SkeletonUtils-r128.js

          MODEL_REV=d6aacfb25dd969ead90cddd94ad901e74aede5d8
          MODEL_BASE="https://raw.githubusercontent.com/trebeljahr/quaternius-showcase/${MODEL_REV}/public/glb"
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Rock_1.glb" -o .preview-v7/models/environment/nature_pack/Rock_1.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Plant_2.glb" -o .preview-v7/models/environment/nature_pack/Plant_2.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Bush_1.glb" -o .preview-v7/models/environment/nature_pack/Bush_1.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Grass.glb" -o .preview-v7/models/environment/nature_pack/Grass.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Plant_1.glb" -o .preview-v7/models/environment/nature_pack/Plant_1.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/PalmTree_4.glb" -o .preview-v7/models/environment/nature_pack/PalmTree_4.glb
          curl -fsSL --retry 3 "$MODEL_BASE/survival_pack/WoodLog.glb" -o .preview-v7/models/environment/survival_pack/WoodLog.glb

          # V7.3+ scene upgrades. Wooden boat replaces the old raft asset.
          curl -fsSL --retry 3 "$MODEL_BASE/cute_fish_pack/Boat.glb" -o .preview-v7/models/v73/Boat.glb
          cp .preview-v7/models/v73/Boat.glb .preview-v7/models/environment/survival_pack/Raft.glb
          # Generic flower remains bundled only as a lightweight fallback if the project-owned lotus OBJ fails.
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Flowers.glb" -o .preview-v7/models/v73/Flowers.glb

          # Higher-detail gameplay crocodile (CC BY 4.0). Keep original if image optimization fails.
          curl -fsSL --retry 3 https://raw.githubusercontent.com/sandeshdamkondwar/3d-viewer/a33f107378e79b4458d2a400bb5e32fddcedbf73/models/crocodile.glb -o .preview-v7/models/v73/crocodile-original.glb
          cp .preview-v7/models/v73/crocodile-original.glb .preview-v7/models/v73/crocodile.glb
          npx --yes @gltf-transform/cli@latest resize .preview-v7/models/v73/crocodile-original.glb .preview-v7/models/v73/crocodile.glb --width 512 --height 512 || cp .preview-v7/models/v73/crocodile-original.glb .preview-v7/models/v73/crocodile.glb
          rm -f .preview-v7/models/v73/crocodile-original.glb

          # CC0 Quaternius upright low-poly Farmer body; runtime builds multiple period-styled silhouettes and behaviors.
          curl -fsSL --retry 3 "$MODEL_BASE/modular_men/Farmer.glb" -o .preview-v7/models/v73/human.glb

          node --check .preview-v7/js/sound.js
          node --check .preview-v7/js/assets.js
          node --check .preview-v7/js/game.js
          node --check .preview-v7/js/v73-enhancements.js
          node --check .preview-v7/js/v731-polish.js
          node --check .preview-v7/js/v732-lotus.js
          node --check .preview-v7/js/v733-life.js
          grep -q 'V7.3.3 · LOADING' .preview-v7/index.html
          grep -q 'SkeletonUtils-r128.js' .preview-v7/index.html
          grep -q 'v73-enhancements.js?v=733' .preview-v7/index.html
          grep -q 'v731-polish.js?v=733' .preview-v7/index.html
          grep -q 'v732-lotus.js?v=733' .preview-v7/index.html
          grep -q 'v733-life.js?v=733' .preview-v7/index.html
          grep -q 'models/v73/crocodile.glb' .preview-v7/js/v73-enhancements.js
          grep -q 'models/v73/human.glb' .preview-v7/js/v73-enhancements.js
          grep -q 'models/v73/lotus-flower.obj' .preview-v7/js/v732-lotus.js
          grep -q 'project-owned-obj' .preview-v7/js/v732-lotus.js
          grep -q 'ClosedWovenLid' .preview-v7/js/v73-enhancements.js
          grep -q 'V731FallbackWaveArm' .preview-v7/js/v731-polish.js
          grep -q 'v733CrocScale' .preview-v7/js/v733-life.js
          grep -q 'TARGET_PEOPLE = 14' .preview-v7/js/v733-life.js
          grep -q "'wave', 'point', 'walk', 'cheer', 'carry', 'bow'" .preview-v7/js/v733-life.js
          test -s .preview-v7/vendor/SkeletonUtils-r128.js
          test -s .preview-v7/models/v73/crocodile.glb
          test -s .preview-v7/models/v73/human.glb
          test -s .preview-v7/models/v73/Boat.glb
          test -s .preview-v7/models/v73/Flowers.glb
          test -s .preview-v7/models/v73/lotus-flower.obj
          test -s .preview-v7/models/basket.obj
          node -e "const fs=require('fs');const s=fs.readFileSync('.preview-v7/models/basket.obj','utf8');const v=s.split(/\r?\n/).filter(x=>x.startsWith('v ')).length;const f=s.split(/\r?\n/).filter(x=>x.startsWith('f ')).length;if(v!==213||f!==344)throw new Error('Unexpected basket '+v+'/'+f);console.log('Woven basket OK:',v,'vertices,',f,'faces');"
          node -e "const fs=require('fs');const s=fs.readFileSync('.preview-v7/models/v73/lotus-flower.obj','utf8');const v=s.split(/\r?\n/).filter(x=>x.startsWith('v ')).length;const f=s.split(/\r?\n/).filter(x=>x.startsWith('f ')).length;if(v!==957||f!==1260)throw new Error('Unexpected lotus '+v+'/'+f);console.log('Nile lotus OK:',v,'vertices,',f,'faces');"
          for file in Rock_1.glb Plant_2.glb Bush_1.glb Grass.glb Plant_1.glb PalmTree_4.glb; do test -s ".preview-v7/models/environment/nature_pack/$file"; done
          test -s .preview-v7/models/environment/survival_pack/WoodLog.glb
          test -s .preview-v7/models/environment/survival_pack/Raft.glb
          ! grep -q 'cdnjs.cloudflare.com' .preview-v7/index.html
          ! grep -q 'cdn.jsdelivr.net' .preview-v7/index.html
          du -h .preview-v7/models/v73/*

          cat > wrangler-v7.jsonc <<'JSON'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "alias-spy-games-moses-nile-v7-preview",
            "compatibility_date": "2026-08-19",
            "workers_dev": true,
            "assets": {
              "directory": "./.preview-v7",
              "not_found_handling": "single-page-application"
            }
          }
          JSON

      - name: Deploy V7.3.3 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler-v7.jsonc

      - name: Print URL
        run: echo 'https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/'
