name: Deploy Moses Nile V7.3.7 Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-moses-nile-v7-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/games/moses-nile-v7/**'
      - '.github/workflows/deploy-moses-nile-v7-preview.yml'

permissions:
  contents: write

jobs:
  deploy-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout V7.3.7 game branch
        uses: actions/checkout@v4
        with:
          ref: feature/moses-nile-runner-mvp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build V7.3.7 full standalone package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .preview-v7
          mkdir -p .preview-v7/js .preview-v7/vendor .preview-v7/textures .preview-v7/models/environment/nature_pack .preview-v7/models/environment/survival_pack .preview-v7/models/v73
          cp web/games/moses-nile-v7/index.html .preview-v7/index.html
          cp web/games/moses-nile-v7/js/*.js .preview-v7/js/
          cp web/games/moses-nile-v7/models/lotus-flower.obj .preview-v7/models/v73/lotus-flower.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-v7/models/basket.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-v7/models/woven-basket.obj

          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/build/three.min.js -o .preview-v7/vendor/three-r128.min.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/GLTFLoader.js -o .preview-v7/vendor/GLTFLoader-r128.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/OBJLoader.js -o .preview-v7/vendor/OBJLoader-r128.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/utils/SkeletonUtils.js -o .preview-v7/vendor/SkeletonUtils-r128.js

          MODEL_REV=d6aacfb25dd969ead90cddd94ad901e74aede5d8
          MODEL_BASE="https://raw.githubusercontent.com/trebeljahr/quaternius-showcase/${MODEL_REV}/public/glb"
          for file in Rock_1.glb Plant_2.glb Bush_1.glb Grass.glb Plant_1.glb PalmTree_4.glb; do curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/$file" -o ".preview-v7/models/environment/nature_pack/$file"; done
          curl -fsSL --retry 3 "$MODEL_BASE/survival_pack/WoodLog.glb" -o .preview-v7/models/environment/survival_pack/WoodLog.glb
          curl -fsSL --retry 3 "$MODEL_BASE/cute_fish_pack/Boat.glb" -o .preview-v7/models/v73/Boat.glb
          cp .preview-v7/models/v73/Boat.glb .preview-v7/models/environment/survival_pack/Raft.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Flowers.glb" -o .preview-v7/models/v73/Flowers.glb
          curl -fsSL --retry 3 "$MODEL_BASE/modular_men/Farmer.glb" -o .preview-v7/models/v73/human.glb

          curl -fsSL --retry 3 https://raw.githubusercontent.com/sandeshdamkondwar/3d-viewer/a33f107378e79b4458d2a400bb5e32fddcedbf73/models/crocodile.glb -o .preview-v7/models/v73/crocodile-original.glb
          cp .preview-v7/models/v73/crocodile-original.glb .preview-v7/models/v73/crocodile.glb
          npx --yes @gltf-transform/cli@latest resize .preview-v7/models/v73/crocodile-original.glb .preview-v7/models/v73/crocodile.glb --width 512 --height 512 || cp .preview-v7/models/v73/crocodile-original.glb .preview-v7/models/v73/crocodile.glb
          rm -f .preview-v7/models/v73/crocodile-original.glb

          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/sand_03/sand_03_diff_1k.jpg -o .preview-v7/textures/sand-03-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/sand_03/sand_03_nor_gl_1k.jpg -o .preview-v7/textures/sand-03-normal-gl-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/damp_sand/damp_sand_diff_1k.jpg -o .preview-v7/textures/damp-sand-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/damp_sand/damp_sand_nor_gl_1k.jpg -o .preview-v7/textures/damp-sand-normal-gl-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/ganges_river_pebbles/ganges_river_pebbles_diff_1k.jpg -o .preview-v7/textures/ganges-pebbles-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/ganges_river_pebbles/ganges_river_pebbles_nor_gl_1k.jpg -o .preview-v7/textures/ganges-pebbles-normal-gl-1k.jpg

          THREE_WATER_REV=83d8667898fd32a6a0f1af92f6d91065db272ce2
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${THREE_WATER_REV}/examples/textures/water/Water_1_M_Normal.jpg" -o .preview-v7/textures/Water_1_M_Normal.jpg
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${THREE_WATER_REV}/examples/textures/water/Water_2_M_Normal.jpg" -o .preview-v7/textures/Water_2_M_Normal.jpg

          node --check .preview-v7/js/v73-enhancements.js
          node --check .preview-v7/js/v731-polish.js
          node --check .preview-v7/js/v733-life.js
          node --check .preview-v7/js/v734-stability.js
          node --check .preview-v7/js/v735-crocs-textures.js
          node --check .preview-v7/js/v736-water-banks.js
          node --check .preview-v7/js/v737-gameplay-polish.js
          grep -q 'V7.3.7 · LOADING' .preview-v7/index.html
          grep -q 'v737-gameplay-polish.js?v=737' .preview-v7/index.html
          grep -q 'v737Chomp' .preview-v7/js/v737-gameplay-polish.js
          test -s .preview-v7/models/v73/crocodile.glb
          test -s .preview-v7/models/v73/human.glb
          test -s .preview-v7/models/v73/lotus-flower.obj
          test -s .preview-v7/models/basket.obj
          test -s .preview-v7/textures/sand-03-diffuse-1k.jpg
          test -s .preview-v7/textures/damp-sand-diffuse-1k.jpg
          test -s .preview-v7/textures/ganges-pebbles-diffuse-1k.jpg
          test -s .preview-v7/textures/Water_1_M_Normal.jpg
          test -s .preview-v7/textures/Water_2_M_Normal.jpg

          cat > .preview-v7/README.txt <<'TXT'
          Moses: Nile Run — V7.3.7 full standalone web build

          All runtime JavaScript, vendor files, textures and 3D models are included in this folder.

          Run through a local HTTP server; opening index.html directly as file:// may block model/texture loading.

          Example:
            python3 -m http.server 8080
          Then open:
            http://localhost:8080/

          Build assembled from branch: feature/moses-nile-runner-mvp
          TXT

          cat > wrangler-v7.jsonc <<'JSON'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "alias-spy-games-moses-nile-v7-preview",
            "compatibility_date": "2026-08-19",
            "workers_dev": true,
            "assets": {"directory": "./.preview-v7", "not_found_handling": "single-page-application"}
          }
          JSON

      - name: Create one-file ZIP package
        shell: bash
        run: |
          rm -f moses-nile-v737-full.zip
          (cd .preview-v7 && zip -q -r ../moses-nile-v737-full.zip .)
          test -s moses-nile-v737-full.zip

      - name: Upload full standalone game archive
        uses: actions/upload-artifact@v4
        with:
          name: moses-nile-v737-full
          path: moses-nile-v737-full.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish ZIP to package branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cp moses-nile-v737-full.zip /tmp/moses-nile-v737-full.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B package/moses-nile-v737 origin/main
          mkdir -p downloads
          cp /tmp/moses-nile-v737-full.zip downloads/moses-nile-v737-full.zip
          git add downloads/moses-nile-v737-full.zip
          git commit -m 'Add Moses Nile V7.3.7 full standalone archive' || true
          git push --force origin HEAD:refs/heads/package/moses-nile-v737

      - name: Deploy V7.3.7 preview
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler-v7.jsonc

      - name: Print URL
        run: echo 'https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/'
