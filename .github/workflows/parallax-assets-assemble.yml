name: Assemble parallax assets

on:
  push:
    branches:
      - parallax-direct-assets-v2
    paths:
      - '.parallax-upload/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallax-direct-assets-v2
          fetch-depth: 0

      - name: Assemble source-resolution WebP layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/assets/home-parallax-v2
          for asset in 01-base 02-clouds 03-mountains 04-city 05-olives 06-foreground; do
            cat ".parallax-upload/${asset}"/*.b64 | tr -d '\n\r ' | base64 --decode > "web/assets/home-parallax-v2/${asset}.webp"
            test -s "web/assets/home-parallax-v2/${asset}.webp"
            file "web/assets/home-parallax-v2/${asset}.webp" | grep -qi webp
          done

          # The application no longer assembles browser-side .part files.
          rm -rf web/assets/home-parallax-hq
          rm -rf .parallax-upload
          rm -f .github/workflows/parallax-assets-assemble.yml

          # Bust Telegram/WebView caches for the new direct-image runtime.
          sed -i 's#home-parallax-v1.css?v=[0-9]*#home-parallax-v1.css?v=10#g' index.html
          sed -i 's#home-parallax-v1.js?v=[0-9]*#home-parallax-v1.js?v=10#g' index.html

      - name: Commit final direct assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(home): publish direct HQ parallax assets"
          git push origin HEAD:parallax-direct-assets-v2
