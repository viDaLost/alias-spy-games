name: Deploy Moses Nile V7.3.14 Preview

on:
  workflow_dispatch:
  push:
    branches: [feature/moses-nile-runner-mvp]
    paths:
      - 'web/games/moses-nile-v7/**'
      - '.github/workflows/deploy-moses-nile-v734-preview.yml'

permissions:
  contents: write

jobs:
  deploy-v7314:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build V7.3.14 preview
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .preview-v7
          mkdir -p .preview-v7/js .preview-v7/vendor/addons/{objects,loaders,libs} .preview-v7/vendor/basis .preview-v7/build .preview-v7/textures/water .preview-v7/textures/terrain .preview-v7/models/environment/{nature_pack,survival_pack} .preview-v7/models/v73
          cp web/games/moses-nile-v7/index.html .preview-v7/index.html
          cp -R web/games/moses-nile-v7/js/. .preview-v7/js/
          cp web/games/moses-nile-v7/models/lotus-flower.obj .preview-v7/models/v73/lotus-flower.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-v7/models/basket.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-v7/models/woven-basket.obj

          THREE_REV=r128
          RAW="https://raw.githubusercontent.com/mrdoob/three.js/${THREE_REV}"
          curl -fsSL --retry 3 "$RAW/build/three.min.js" -o .preview-v7/vendor/three-r128.min.js
          curl -fsSL --retry 3 "$RAW/build/three.module.js" -o .preview-v7/build/three.module.js
          curl -fsSL --retry 3 "$RAW/examples/jsm/objects/Water.js" -o .preview-v7/vendor/addons/objects/Water.js
          curl -fsSL --retry 3 "$RAW/examples/jsm/loaders/KTX2Loader.js" -o .preview-v7/vendor/addons/loaders/KTX2Loader.js
          curl -fsSL --retry 3 "$RAW/examples/jsm/loaders/BasisTextureLoader.js" -o .preview-v7/vendor/addons/loaders/BasisTextureLoader.js
          curl -fsSL --retry 3 "$RAW/examples/jsm/libs/ktx-parse.module.js" -o .preview-v7/vendor/addons/libs/ktx-parse.module.js
          curl -fsSL --retry 3 "$RAW/examples/jsm/libs/zstddec.module.js" -o .preview-v7/vendor/addons/libs/zstddec.module.js
          curl -fsSL --retry 3 "$RAW/examples/js/libs/basis/basis_transcoder.js" -o .preview-v7/vendor/basis/basis_transcoder.js
          curl -fsSL --retry 3 "$RAW/examples/js/libs/basis/basis_transcoder.wasm" -o .preview-v7/vendor/basis/basis_transcoder.wasm
          curl -fsSL --retry 3 "$RAW/examples/js/loaders/GLTFLoader.js" -o .preview-v7/vendor/GLTFLoader-r128.js
          curl -fsSL --retry 3 "$RAW/examples/js/loaders/OBJLoader.js" -o .preview-v7/vendor/OBJLoader-r128.js
          curl -fsSL --retry 3 "$RAW/examples/js/utils/SkeletonUtils.js" -o .preview-v7/vendor/SkeletonUtils-r128.js

          MODEL_REV=d6aacfb25dd969ead90cddd94ad901e74aede5d8
          MODEL_BASE="https://raw.githubusercontent.com/trebeljahr/quaternius-showcase/${MODEL_REV}/public/glb"
          for file in Rock_1.glb Plant_2.glb Bush_1.glb Grass.glb Plant_1.glb PalmTree_4.glb; do curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/$file" -o ".preview-v7/models/environment/nature_pack/$file"; done
          curl -fsSL --retry 3 "$MODEL_BASE/survival_pack/WoodLog.glb" -o .preview-v7/models/environment/survival_pack/WoodLog.glb
          curl -fsSL --retry 3 "$MODEL_BASE/cute_fish_pack/Boat.glb" -o .preview-v7/models/v73/Boat.glb
          cp .preview-v7/models/v73/Boat.glb .preview-v7/models/environment/survival_pack/Raft.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Flowers.glb" -o .preview-v7/models/v73/Flowers.glb
          curl -fsSL --retry 3 https://raw.githubusercontent.com/sandeshdamkondwar/3d-viewer/a33f107378e79b4458d2a400bb5e32fddcedbf73/models/crocodile.glb -o .preview-v7/models/v73/crocodile.glb

          WATER_REV=83d8667898fd32a6a0f1af92f6d91065db272ce2
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${WATER_REV}/examples/textures/water/Water_1_M_Normal.jpg" -o .preview-v7/textures/water/water-normal.jpg
          cp .preview-v7/textures/water/water-normal.jpg .preview-v7/textures/Water_1_M_Normal.jpg
          cp .preview-v7/textures/water/water-normal.jpg .preview-v7/textures/Water_2_M_Normal.jpg

          python -m pip install --quiet pillow
          declare -A ASSET
          ASSET[wet_mud]=brown_mud_02
          ASSET[wet_sand]=coast_sand_01
          ASSET[sand]=sand_01
          ASSET[cracked_mud]=mud_cracked_dry_03
          ASSET[gravel]=gravelly_sand
          for layer in wet_mud wet_sand sand cracked_mud gravel; do
            asset="${ASSET[$layer]}"; dir=".preview-v7/textures/terrain/$layer"; mkdir -p "$dir/src"; base="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/${asset}"
            curl -fsSL --retry 3 "$base/${asset}_diff_1k.jpg" -o "$dir/color.jpg"
            curl -fsSL --retry 3 "$base/${asset}_nor_gl_1k.jpg" -o "$dir/src/normal.jpg"
            curl -fsSL --retry 3 "$base/${asset}_rough_1k.jpg" -o "$dir/src/rough.jpg"
            curl -fsSL --retry 3 "$base/${asset}_ao_1k.jpg" -o "$dir/src/ao.jpg"
          done
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('.preview-v7/textures/terrain')
          for d in root.iterdir():
              if not d.is_dir(): continue
              n=Image.open(d/'src/normal.jpg').convert('RGB')
              r=Image.open(d/'src/rough.jpg').convert('L').resize(n.size)
              a=Image.open(d/'src/ao.jpg').convert('L').resize(n.size)
              out=Image.new('RGBA',n.size); np=n.load(); rp=r.load(); ap=a.load(); op=out.load()
              for y in range(n.height):
                  for x in range(n.width):
                      p=np[x,y]; op[x,y]=(p[0],p[1],rp[x,y],ap[x,y])
              out.save(d/'nrmao.png',optimize=True)
          PY

          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/sand_03/sand_03_diff_1k.jpg -o .preview-v7/textures/sand-03-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/sand_03/sand_03_nor_gl_1k.jpg -o .preview-v7/textures/sand-03-normal-gl-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/damp_sand/damp_sand_diff_1k.jpg -o .preview-v7/textures/damp-sand-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/damp_sand/damp_sand_nor_gl_1k.jpg -o .preview-v7/textures/damp-sand-normal-gl-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/ganges_river_pebbles/ganges_river_pebbles_diff_1k.jpg -o .preview-v7/textures/ganges-pebbles-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/ganges_river_pebbles/ganges_river_pebbles_nor_gl_1k.jpg -o .preview-v7/textures/ganges-pebbles-normal-gl-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/coast_sand_02/coast_sand_02_diff_1k.jpg -o .preview-v7/textures/coast-sand-02-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/coast_sand_02/coast_sand_02_nor_gl_1k.jpg -o .preview-v7/textures/coast-sand-02-normal-gl-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/coast_sand_02/coast_sand_02_rough_1k.jpg -o .preview-v7/textures/coast-sand-02-rough-1k.jpg

          for file in .preview-v7/js/*.js; do node --check "$file"; done
          for file in .preview-v7/js/water/*.js .preview-v7/js/terrain/*.js; do node --input-type=module --check < "$file"; done
          grep -q 'V7.3.14 · LOADING' .preview-v7/index.html
          grep -q 'v7314-visual-final.js?v=7314' .preview-v7/index.html
          grep -q 'riverHalfWidth:6.18' .preview-v7/js/terrain/TerrainSystem.js
          grep -q 'width=12.9' .preview-v7/js/water/WaterSystem.js
          grep -q 'NileReedsInstancedV7314' .preview-v7/js/terrain/VegetationSystem.js
          ! test -e .preview-v7/models/v73/human.glb

          cat > wrangler-v7.jsonc <<'JSON'
          {"$schema":"./node_modules/wrangler/config-schema.json","name":"alias-spy-games-moses-nile-v7-preview","compatibility_date":"2026-08-19","workers_dev":true,"assets":{"directory":"./.preview-v7","not_found_handling":"single-page-application"}}
          JSON
      - name: Deploy V7.3.14 preview
        id: deploy
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler-v7.jsonc
      - name: Verify V7.3.14 endpoint
        id: verify
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/'
          for attempt in 1 2 3 4 5 6; do
            Q="?verify=${GITHUB_SHA}-${attempt}"
            if curl -fsSL --max-time 20 "${PREVIEW}${Q}" -o /tmp/index.html \
              && grep -q 'V7.3.14 · LOADING' /tmp/index.html \
              && curl -fsSL --max-time 20 "${PREVIEW}js/v7314-visual-final.js${Q}" -o /tmp/visual.js \
              && grep -q 'FINAL VISUAL' /tmp/visual.js \
              && curl -fsSL --max-time 20 "${PREVIEW}js/terrain/TerrainSystem.js${Q}" -o /tmp/terrain-system.js \
              && grep -q 'riverHalfWidth:6.18' /tmp/terrain-system.js \
              && curl -fsSL --max-time 20 "${PREVIEW}js/water/WaterSystem.js${Q}" -o /tmp/water.js \
              && grep -q 'width=12.9' /tmp/water.js; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Publish V7.3.14 marker
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          PREVIEW='https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/'
          printf 'commit=%s\npreview=%s\nversion=V7.3.14\nbuild=%s\ndeploy=%s\nverify=%s\nshoreline=soft-continuous\nlegacy_water_guides=removed\nvegetation=sparse-clustered\natmosphere=neutral-nile-daylight\nwater=calm-muted\nchecked_at=%s\n' "$GITHUB_SHA" "$PREVIEW" "${BUILD_OUTCOME:-skipped}" "${DEPLOY_OUTCOME:-skipped}" "${VERIFY_OUTCOME:-skipped}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/status.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B verify/moses-nile-v7314
          mkdir -p deploy-status; cp /tmp/status.txt deploy-status/moses-nile-v7314.txt
          git add deploy-status/moses-nile-v7314.txt; git commit -m 'Record Moses Nile V7.3.14 deploy status' || true; git push --force origin HEAD:refs/heads/verify/moses-nile-v7314
      - name: Require verified preview
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$BUILD_OUTCOME" = success
          test "$DEPLOY_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
