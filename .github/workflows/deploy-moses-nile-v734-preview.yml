name: Deploy Moses Nile V7.3.11 Preview

on:
  workflow_dispatch:
  push:
    branches: [feature/moses-nile-runner-mvp]
    paths:
      - 'web/games/moses-nile-v7/**'
      - '.github/workflows/deploy-moses-nile-v734-preview.yml'

permissions:
  contents: write

jobs:
  deploy-v7311:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout V7.3.11 source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build V7.3.11 preview
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .preview-v7
          mkdir -p .preview-v7/js .preview-v7/vendor/addons/objects .preview-v7/build .preview-v7/textures/water .preview-v7/models/environment/nature_pack .preview-v7/models/environment/survival_pack .preview-v7/models/v73
          cp web/games/moses-nile-v7/index.html .preview-v7/index.html
          cp -R web/games/moses-nile-v7/js/. .preview-v7/js/
          cp web/games/moses-nile-v7/models/lotus-flower.obj .preview-v7/models/v73/lotus-flower.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-v7/models/basket.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-v7/models/woven-basket.obj

          THREE_REV=r128
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${THREE_REV}/build/three.min.js" -o .preview-v7/vendor/three-r128.min.js
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${THREE_REV}/build/three.module.js" -o .preview-v7/build/three.module.js
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${THREE_REV}/examples/jsm/objects/Water.js" -o .preview-v7/vendor/addons/objects/Water.js
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${THREE_REV}/examples/js/loaders/GLTFLoader.js" -o .preview-v7/vendor/GLTFLoader-r128.js
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${THREE_REV}/examples/js/loaders/OBJLoader.js" -o .preview-v7/vendor/OBJLoader-r128.js
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${THREE_REV}/examples/js/utils/SkeletonUtils.js" -o .preview-v7/vendor/SkeletonUtils-r128.js

          MODEL_REV=d6aacfb25dd969ead90cddd94ad901e74aede5d8
          MODEL_BASE="https://raw.githubusercontent.com/trebeljahr/quaternius-showcase/${MODEL_REV}/public/glb"
          for file in Rock_1.glb Plant_2.glb Bush_1.glb Grass.glb Plant_1.glb PalmTree_4.glb; do curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/$file" -o ".preview-v7/models/environment/nature_pack/$file"; done
          curl -fsSL --retry 3 "$MODEL_BASE/survival_pack/WoodLog.glb" -o .preview-v7/models/environment/survival_pack/WoodLog.glb
          curl -fsSL --retry 3 "$MODEL_BASE/cute_fish_pack/Boat.glb" -o .preview-v7/models/v73/Boat.glb
          cp .preview-v7/models/v73/Boat.glb .preview-v7/models/environment/survival_pack/Raft.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Flowers.glb" -o .preview-v7/models/v73/Flowers.glb
          curl -fsSL --retry 3 https://raw.githubusercontent.com/sandeshdamkondwar/3d-viewer/a33f107378e79b4458d2a400bb5e32fddcedbf73/models/crocodile.glb -o .preview-v7/models/v73/crocodile.glb

          # Sand: Poly Haven Coast Sand 02 (CC0).
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/coast_sand_02/coast_sand_02_diff_1k.jpg -o .preview-v7/textures/coast-sand-02-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/coast_sand_02/coast_sand_02_nor_gl_1k.jpg -o .preview-v7/textures/coast-sand-02-normal-gl-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/coast_sand_02/coast_sand_02_rough_1k.jpg -o .preview-v7/textures/coast-sand-02-rough-1k.jpg

          # Legacy maps are retained for old terrain layers; Water_1 becomes the V7.3.11 normal source.
          THREE_WATER_REV=83d8667898fd32a6a0f1af92f6d91065db272ce2
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${THREE_WATER_REV}/examples/textures/water/Water_1_M_Normal.jpg" -o .preview-v7/textures/Water_1_M_Normal.jpg
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/mrdoob/three.js/${THREE_WATER_REV}/examples/textures/water/Water_2_M_Normal.jpg" -o .preview-v7/textures/Water_2_M_Normal.jpg
          cp .preview-v7/textures/Water_1_M_Normal.jpg .preview-v7/textures/water/water-normal.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/sand_03/sand_03_diff_1k.jpg -o .preview-v7/textures/sand-03-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/sand_03/sand_03_nor_gl_1k.jpg -o .preview-v7/textures/sand-03-normal-gl-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/damp_sand/damp_sand_diff_1k.jpg -o .preview-v7/textures/damp-sand-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/damp_sand/damp_sand_nor_gl_1k.jpg -o .preview-v7/textures/damp-sand-normal-gl-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/ganges_river_pebbles/ganges_river_pebbles_diff_1k.jpg -o .preview-v7/textures/ganges-pebbles-diffuse-1k.jpg
          curl -fsSL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/ganges_river_pebbles/ganges_river_pebbles_nor_gl_1k.jpg -o .preview-v7/textures/ganges-pebbles-normal-gl-1k.jpg

          # Syntax/static architecture checks.
          for file in .preview-v7/js/*.js; do node --check "$file"; done
          for file in .preview-v7/js/water/*.js; do node --input-type=module --check < "$file"; done
          grep -q 'V7.3.11 · LOADING' .preview-v7/index.html
          grep -q 'type="module" src="js/water/main.js?v=7311"' .preview-v7/index.html
          grep -q 'three/addons/' .preview-v7/index.html
          grep -q 'class WaterSystem' .preview-v7/js/water/WaterSystem.js
          grep -q 'class WakeTrail' .preview-v7/js/water/WakeTrail.js
          grep -q 'class BoatWake' .preview-v7/js/water/BoatWake.js
          grep -q 'class RippleSystem' .preview-v7/js/water/RippleSystem.js
          grep -q 'class SplashSystem' .preview-v7/js/water/SplashSystem.js
          grep -q 'class FoamSystem' .preview-v7/js/water/FoamSystem.js
          grep -q 'class WaterInteractionSystem' .preview-v7/js/water/WaterInteractionSystem.js
          grep -q 'distortionScale: 2.15' .preview-v7/js/water/main.js
          grep -q 'maxParticles: 420' .preview-v7/js/water/main.js
          grep -q 'wakeInterval: 0.075' .preview-v7/js/water/main.js
          grep -q 'from .*Water.js' .preview-v7/js/water/WaterSystem.js
          test -s .preview-v7/build/three.module.js
          test -s .preview-v7/vendor/addons/objects/Water.js
          test -s .preview-v7/textures/water/water-normal.jpg
          ! test -e .preview-v7/models/v73/human.glb

          cat > wrangler-v7.jsonc <<'JSON'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "alias-spy-games-moses-nile-v7-preview",
            "compatibility_date": "2026-08-19",
            "workers_dev": true,
            "assets": {"directory": "./.preview-v7", "not_found_handling": "single-page-application"}
          }
          JSON

      - name: Deploy V7.3.11 preview
        id: deploy
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler-v7.jsonc

      - name: Verify Cloudflare V7.3.11 preview
        id: verify
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/'
          for attempt in 1 2 3 4 5 6; do
            Q="?verify=${GITHUB_SHA}-${attempt}"
            if curl -fsSL --max-time 20 --retry 2 -H 'Cache-Control: no-cache' "${PREVIEW}${Q}" -o /tmp/index.html \
              && grep -q 'V7.3.11 · LOADING' /tmp/index.html \
              && grep -q 'js/water/main.js?v=7311' /tmp/index.html \
              && curl -fsSL --max-time 20 --retry 2 "${PREVIEW}js/water/WaterSystem.js${Q}" -o /tmp/water-system.js \
              && grep -q 'class WaterSystem' /tmp/water-system.js \
              && curl -fsSL --max-time 20 --retry 2 "${PREVIEW}js/water/WaterInteractionSystem.js${Q}" -o /tmp/interaction.js \
              && grep -q 'class WaterInteractionSystem' /tmp/interaction.js \
              && curl -fsSL --max-time 20 --retry 2 "${PREVIEW}vendor/addons/objects/Water.js${Q}" -o /tmp/Water.js \
              && grep -q 'class Water extends Mesh' /tmp/Water.js \
              && curl -fsSL --max-time 20 --retry 2 "${PREVIEW}build/three.module.js${Q}" -o /tmp/three.module.js \
              && test "$(wc -c < /tmp/three.module.js)" -gt 500000 \
              && curl -fsSL --max-time 20 --retry 2 "${PREVIEW}textures/water/water-normal.jpg${Q}" -o /tmp/water-normal.jpg \
              && test "$(wc -c < /tmp/water-normal.jpg)" -gt 10000; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish V7.3.11 diagnostic marker
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          PREVIEW='https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/'
          printf 'commit=%s\npreview=%s\nversion=V7.3.11\nbuild=%s\ndeploy=%s\nverify=%s\nwater=three-water-river\nwake=buffergeometry-pooled\nboat_wake=v-shaped\nripples=pooled\nsplash=points-pooled\nfoam=pooled\ninteraction=surface-crossing-lod\nparticles_max=420\nripples_max=72\npeople_model=removed\nchecked_at=%s\n' \
            "$GITHUB_SHA" "$PREVIEW" "${BUILD_OUTCOME:-skipped}" "${DEPLOY_OUTCOME:-skipped}" "${VERIFY_OUTCOME:-skipped}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/moses-nile-v7311-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B verify/moses-nile-v7311
          mkdir -p deploy-status
          cp /tmp/moses-nile-v7311-status.txt deploy-status/moses-nile-v7311.txt
          git add deploy-status/moses-nile-v7311.txt
          git commit -m 'Record Moses Nile V7.3.11 deploy status' || true
          git push --force origin HEAD:refs/heads/verify/moses-nile-v7311

      - name: Require verified V7.3.11 preview
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$BUILD_OUTCOME" = success
          test "$DEPLOY_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
