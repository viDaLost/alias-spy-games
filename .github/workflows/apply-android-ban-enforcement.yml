name: Apply Android ban enforcement

on:
  push:
    branches: [agent/android-ban-enforcement-2.6.5]
    paths:
      - '.github/workflows/apply-android-ban-enforcement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply ban enforcement patch
        run: python3 scripts/apply-android-ban-enforcement.py
      - name: Run regression check
        run: node scripts/check-android-ban-enforcement.mjs
      - name: Commit production changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-app/app/src/main/java/com/vidalost/biblegames/App.kt \
            android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt \
            android-app/app/build.gradle \
            cloudflare/app-core-worker/src/index-v4.js \
            scripts/check-android-ban-enforcement.mjs
          git commit -m 'Enforce Android bans immediately'
          git push origin HEAD:agent/android-ban-enforcement-2.6.5
