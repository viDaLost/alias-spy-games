name: Deploy home menu Cloudflare preview

on:
  push:
    branches:
      - preview/home-menu-redesign-v1
    paths:
      - 'preview/home-menu/**'
      - '.github/workflows/deploy-home-menu-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-menu-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild verified original animated background
        run: |
          set -euxo pipefail
          base64 -d preview/home-menu/video-src/home-bg-original-v10.webp.b64 > preview/home-menu/public/home-bg-original-v10.webp
          test -s preview/home-menu/public/home-bg-original-v10.webp
          echo '8944bb56c9b892c15ca4c6694d41e18734c8d481476cc6598b6d0b53d8815e90  preview/home-menu/public/home-bg-original-v10.webp' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview/home-menu/public/home-bg-original-v10.webp').read_bytes()
          assert len(p) == 213524, len(p)
          assert p[:4] == b'RIFF' and p[8:12] == b'WEBP', p[:12]
          assert b'ANIM' in p and b'ANMF' in p, 'WebP is not animated'
          print('V10 original animated WebP verified:', len(p), 'bytes')
          PY

      - name: Verify V10 source contracts
        run: |
          grep -Fq 'home-menu-v10-original-animated-webp' preview/home-menu/worker.js
          grep -Fq 'HOME V10 · ORIGINAL ANIM BG' preview/home-menu/worker.js
          grep -Fq '/home-bg-original-v10.webp' preview/home-menu/worker.js
          grep -Fq 'original-webp-v10' preview/home-menu/worker.js
          grep -Fq 'homeAnimatedBg' preview/home-menu/worker.js
          grep -Fq 'bible-sketch.webp' preview/home-menu/public/index.html
          grep -Fq 'view-profile' preview/home-menu/public/index.html
          grep -Fq 'view-settings' preview/home-menu/public/index.html

      - name: Validate Worker bundle
        working-directory: preview/home-menu
        env:
          npm_config_cache: /tmp/npm-cache
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir /tmp/home-menu-preview-build

      - name: Deploy isolated Cloudflare Worker
        working-directory: preview/home-menu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          npm_config_cache: /tmp/npm-cache
        run: npx --yes wrangler@4.102.0 deploy

      - name: Verify deployed V10 and exact animated background
        env:
          PREVIEW_URL: https://alias-spy-games-home-menu-preview.vitaledanilov.workers.dev/
        run: |
          set -euxo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --retry 2 --max-time 20 "${PREVIEW_URL}?build=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/home-menu-preview.html \
              && grep -Fq 'HOME V10 · ORIGINAL ANIM BG' /tmp/home-menu-preview.html \
              && grep -Fq 'home-menu-v10-original-animated-webp' /tmp/home-menu-preview.html \
              && grep -Fq 'homeAnimatedBg' /tmp/home-menu-preview.html; then

              curl -fsSL --retry 2 --max-time 20 "${PREVIEW_URL}__preview_version?build=${GITHUB_SHA}" -o /tmp/home-menu-version.json
              jq -e '.version == "home-menu-v10-original-animated-webp" and .background == "original-animated-webp-v10" and .autoplayRequired == false and .source == "user-original-upload"' /tmp/home-menu-version.json >/dev/null

              curl -fsS --retry 2 --max-time 30 \
                -D /tmp/webp-headers.txt \
                "${PREVIEW_URL}home-bg-original-v10.webp?v=10&build=${GITHUB_SHA}" \
                -o /tmp/home-bg-original-v10.webp

              grep -Eiq '^content-type: *image/webp' /tmp/webp-headers.txt
              grep -Eiq '^x-home-menu-animated-bg: *original-webp-v10' /tmp/webp-headers.txt
              grep -Eiq '^x-home-menu-build: *home-menu-v10-original-animated-webp' /tmp/webp-headers.txt
              echo '8944bb56c9b892c15ca4c6694d41e18734c8d481476cc6598b6d0b53d8815e90  /tmp/home-bg-original-v10.webp' | sha256sum -c -
              python3 - <<'PY'
              from pathlib import Path
              p=Path('/tmp/home-bg-original-v10.webp').read_bytes()
              assert len(p) == 213524
              assert p[:4] == b'RIFF' and p[8:12] == b'WEBP'
              assert b'ANIM' in p and b'ANMF' in p
              print('Remote V10 animated WebP verified:', len(p), 'bytes')
              PY
              echo "Home menu V10 preview verified: ${PREVIEW_URL}"
              exit 0
            fi
            sleep 3
          done
          echo 'Home menu V10 Cloudflare preview verification failed' >&2
          exit 1

      - name: Record verified V10 preview
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_PATH: .preview-status/home-menu.json
          PREVIEW_URL: https://alias-spy-games-home-menu-preview.vitaledanilov.workers.dev/
        run: |
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          status_json="$(jq -nc --arg sha "$GITHUB_SHA" --arg url "$PREVIEW_URL" --arg verified "$verified_at" '{source_sha:$sha,url:$url,version:"home-menu-v10-original-animated-webp",verified_at:$verified}')"
          encoded="$(printf '%s' "$status_json" | base64 -w0)"
          current_sha="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}?ref=${GITHUB_REF_NAME}" | jq -r '.sha // empty' 2>/dev/null || true)"
          body="$(jq -nc --arg msg "chore: record home menu V10 preview ${GITHUB_SHA::7}" --arg content "$encoded" --arg branch "$GITHUB_REF_NAME" --arg sha "$current_sha" 'if $sha == "" then {message:$msg,content:$content,branch:$branch} else {message:$msg,content:$content,branch:$branch,sha:$sha} end')"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" \
            -d "$body" >/dev/null
