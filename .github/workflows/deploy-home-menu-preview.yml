name: Deploy Home Menu Preview
on:
  push:
    branches: [preview/home-menu-redesign-v1]
    paths:
      - 'preview/home-menu/**'
      - '.github/workflows/deploy-home-menu-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-menu-preview
  cancel-in-progress: true
jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source snapshot V22
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -f preview/home-menu/public/index.html
          test -f preview/home-menu/public/home-menu-v22.js
          grep -Fq 'home-menu-v22-games-profile' preview/home-menu/public/index.html
          grep -Fq '/home-menu-v22.js?v=22' preview/home-menu/public/index.html
          grep -Fq 'data-nav="games"' preview/home-menu/public/index.html
          grep -Fq 'data-nav="profile"' preview/home-menu/public/index.html
          grep -Fq 'data-action="code"' preview/home-menu/public/index.html
          grep -Fq 'data-action="qr"' preview/home-menu/public/index.html
          ! grep -Fq 'title-v21.webp' preview/home-menu/public/index.html
          ! grep -Fq 'data-action="create"' preview/home-menu/public/index.html
          ! grep -Fq 'Создать комнату' preview/home-menu/public/index.html
          ! grep -Fq 'action-stage' preview/home-menu/public/index.html
          ! grep -Fq '/actions/' preview/home-menu/public/home-menu-v22.js
          grep -Fq "openModal(button.dataset.action)" preview/home-menu/public/home-menu-v22.js
          grep -Fq 'current+=delta*.115' preview/home-menu/public/home-menu-v22.js
          grep -Fq 'requestAnimationFrame(render)' preview/home-menu/public/home-menu-v22.js
          echo 'source=success · V22 no-title/no-room/direct-actions/two-tab/smooth-parallax verified'
      - name: Validate Worker bundle
        id: validate
        working-directory: preview/home-menu
        env:
          npm_config_cache: /tmp/npm-cache
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir /tmp/home-menu-preview-build
      - name: Deploy V22 Cloudflare Worker
        id: deploy
        working-directory: preview/home-menu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          npm_config_cache: /tmp/npm-cache
        run: npx --yes wrangler@4.102.0 deploy
      - name: Verify deployed V22
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base='https://alias-spy-games-home-menu-preview.vitaledanilov.workers.dev'
          contract='.version=="home-menu-v22-games-profile" and .roomRemoved==true and .roomFunctionalityRemoved==true and .titleImageRemoved==true and .actionAnimationsRemoved==true and .profileEnabled==true and .assets.title==null and .assets.actionLayers.count==0 and .navigation.count==2 and .navigation.items==["games","profile"] and .entryActions.items==["code","qr"] and .entryActions.animations==false and .performance.parallax=="requestAnimationFrame-interpolated" and .performance.idleRaf==false and .performance.qualityReduction==false and .modal.opensDirectly==true'
          ready=0
          for attempt in $(seq 1 30); do
            stamp="$(date +%s)-$attempt"
            if curl -fsS --retry 2 --retry-all-errors --retry-delay 1 -H 'Cache-Control: no-cache' "$base/__preview_version?v=22&ci=$stamp" -o /tmp/version.json; then
              echo "verify propagation attempt $attempt: $(jq -c '{version,navigation,entryActions,performance}' /tmp/version.json 2>/dev/null || cat /tmp/version.json)"
              if jq -e "$contract" /tmp/version.json >/dev/null 2>&1; then ready=1; break; fi
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Complete V22 runtime contract did not propagate in time'
            cat /tmp/version.json 2>/dev/null || true
            exit 1
          fi
          stamp="$(date +%s)"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 1 -H 'Cache-Control: no-cache' "$base/?v=22&ci=$stamp" -o /tmp/index.html
          grep -Fq '/home-menu-v22.js?v=22' /tmp/index.html
          grep -Fq 'data-nav="games"' /tmp/index.html
          grep -Fq 'data-nav="profile"' /tmp/index.html
          grep -Fq 'data-action="code"' /tmp/index.html
          grep -Fq 'data-action="qr"' /tmp/index.html
          ! grep -Fq 'title-v21.webp' /tmp/index.html
          ! grep -Fq 'data-action="create"' /tmp/index.html
          ! grep -Fq 'action-stage' /tmp/index.html
          curl -fsS --retry 5 --retry-all-errors --retry-delay 1 -H 'Cache-Control: no-cache' "$base/home-menu-v22.js?v=22&ci=$stamp" -o /tmp/app.js
          ! grep -Fq '/actions/' /tmp/app.js
          grep -Fq "openModal(button.dataset.action)" /tmp/app.js
          grep -Fq 'current+=delta*.115' /tmp/app.js
          echo 'verify=success · V22 games/profile, direct QR/code, and smooth full-quality parallax are live'
