name: Deploy home menu Cloudflare preview

on:
  push:
    branches:
      - preview/home-menu-redesign-v1
    paths:
      - 'preview/home-menu/**'
      - '.github/workflows/deploy-home-menu-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-menu-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify preview contracts
        run: |
          grep -Fq 'CLOUDFLARE PREVIEW · MAIN НЕ ЗАТРОНУТ · V2' preview/home-menu/public/index.html
          grep -Fq 'Быстрая игра' preview/home-menu/public/index.html
          grep -Fq 'Создать комнату' preview/home-menu/public/index.html
          grep -Fq 'Не знаете, что выбрать?' preview/home-menu/public/index.html
          grep -Fq 'data-filter="company"' preview/home-menu/public/index.html
          grep -Fq 'Библейский художник' preview/home-menu/public/index.html
          grep -Fq 'bible-sketch.webp' preview/home-menu/public/index.html
          grep -Fq 'view-profile' preview/home-menu/public/index.html
          grep -Fq 'view-settings' preview/home-menu/public/index.html
          grep -Fq '#4f46e5' preview/home-menu/public/index.html

      - name: Validate Worker bundle
        working-directory: preview/home-menu
        env:
          npm_config_cache: /tmp/npm-cache
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir /tmp/home-menu-preview-build

      - name: Verify real game icon sources
        run: |
          curl -fsSL --retry 2 --max-time 20 -o /tmp/bible-sketch.webp https://raw.githubusercontent.com/viDaLost/alias-spy-games/main/web/assets/icons/bible-sketch.webp
          test -s /tmp/bible-sketch.webp
          curl -fsSL --retry 2 --max-time 20 -o /tmp/quartet.png https://raw.githubusercontent.com/viDaLost/alias-spy-games/main/web/assets/icons/quartet.png
          test -s /tmp/quartet.png

      - name: Deploy isolated Cloudflare Worker
        working-directory: preview/home-menu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          npm_config_cache: /tmp/npm-cache
        run: npx --yes wrangler@4.102.0 deploy

      - name: Verify deployed preview
        env:
          PREVIEW_URL: https://alias-spy-games-home-menu-preview.vitaledanilov.workers.dev/
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --max-time 20 "${PREVIEW_URL}?build=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/home-menu-preview.html \
              && grep -Fq 'CLOUDFLARE PREVIEW · MAIN НЕ ЗАТРОНУТ · V2' /tmp/home-menu-preview.html \
              && grep -Fq 'bible-sketch.webp' /tmp/home-menu-preview.html \
              && grep -Fq 'view-profile' /tmp/home-menu-preview.html \
              && grep -Fq 'view-settings' /tmp/home-menu-preview.html; then
              echo "Home menu V2 preview verified: ${PREVIEW_URL}"
              exit 0
            fi
            sleep 3
          done
          echo 'Home menu Cloudflare preview verification failed' >&2
          exit 1

      - name: Record verified preview
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_PATH: .preview-status/home-menu.json
          PREVIEW_URL: https://alias-spy-games-home-menu-preview.vitaledanilov.workers.dev/
        run: |
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          status_json="$(jq -nc --arg sha "$GITHUB_SHA" --arg url "$PREVIEW_URL" --arg verified "$verified_at" '{source_sha:$sha,url:$url,version:"home-menu-v2",verified_at:$verified}')"
          encoded="$(printf '%s' "$status_json" | base64 -w0)"
          current_sha="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}?ref=${GITHUB_REF_NAME}" | jq -r '.sha // empty' 2>/dev/null || true)"
          body="$(jq -nc --arg msg "chore: record home menu v2 preview ${GITHUB_SHA::7}" --arg content "$encoded" --arg branch "$GITHUB_REF_NAME" --arg sha "$current_sha" 'if $sha == "" then {message:$msg,content:$content,branch:$branch} else {message:$msg,content:$content,branch:$branch,sha:$sha} end')"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" \
            -d "$body" >/dev/null
