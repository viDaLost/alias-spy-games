name: Deploy Home Menu Preview
on:
  push:
    branches: [preview/home-menu-redesign-v1]
    paths:
      - 'preview/home-menu/**'
      - '.github/workflows/deploy-home-menu-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-menu-preview
  cancel-in-progress: true
jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V20 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          public='preview/home-menu/public'
          html="$public/index.html"
          js="$public/home-menu-v20.js"
          worker='preview/home-menu/worker.js'
          test -f "$html" && test -f "$js" && test -f "$public/layers/title-v20.webp"
          test "$(wc -c < "$public/layers/title-v20.webp")" -eq 55460
          echo 'f5244b39f0fff3dd5c30c919539c67d68bee0f5edc64bbe2032c86cc3f937132  preview/home-menu/public/layers/title-v20.webp' | sha256sum -c -
          grep -Fq 'home-menu-v20-title-centered-actions' "$html"
          grep -Fq '/layers/title-v20.webp?v=20' "$html"
          grep -Fq 'modal-overlay' "$html"
          grep -Fq '<script src="/home-menu-v20.js?v=20" defer></script>' "$html"
          ! grep -Fq 'Игровой маршрут' "$html"
          ! grep -Fq 'nightPlanner' "$html"
          ! grep -Fq 'view-profile' "$html"
          ! grep -Fq 'view-settings' "$html"
          ! grep -Fq 'falling-stars-v19.webp' "$html"
          ! test -e "$public/home-menu-v19.js"
          ! test -e "$public/actions/falling-stars-v19.webp"
          grep -Fq "create:{asset:'room',src:'/actions/room-v19.webp?v=20'" "$js"
          grep -Fq "code:{asset:'code',src:'/actions/code-v19.webp?v=20'" "$js"
          grep -Fq "qr:{asset:'qr',src:'/actions/qr-v19.webp?v=20'" "$js"
          grep -Fq 'await playRasterAction(kind);openModal(kind)' "$js"
          ! grep -Fq 'PLANNER_STORAGE_KEY' "$js"
          ! grep -Fq 'falling-stars-v19.webp' "$js"
          grep -Fq "gameNightPlanner:false" "$worker"
          grep -Fq "profileRemoved:true" "$worker"
          grep -Fq "settingsRemoved:true" "$worker"
          grep -Fq "fallingStarsRemoved:true" "$worker"
          grep -Fq "placement:'center'" "$worker"
          grep -Fq "opensAfterAnimation:true" "$worker"
          node --check "$js"
          node --input-type=module --check < "$worker"
      - name: Validate Worker bundle
        id: validate
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir /tmp/home-menu-preview-build
        working-directory: preview/home-menu
      - name: Deploy V20 Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: preview/home-menu
          command: deploy
      - name: Verify deployed V20
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base='https://alias-spy-games-home-menu-preview.vitaledanilov.workers.dev'
          stamp="$(date +%s)"
          curl -fsS "$base/__preview_version?v=20&ci=$stamp" -o /tmp/version.json
          jq -e '.version=="home-menu-v20-title-centered-actions" and .gameNightPlanner==false and .profileRemoved==true and .settingsRemoved==true and .fallingStarsRemoved==true and .modal.placement=="center" and .modal.opensAfterAnimation==true' /tmp/version.json >/dev/null
          curl -fsS "$base/?v=20&ci=$stamp" -o /tmp/index.html
          grep -Fq '/layers/title-v20.webp?v=20' /tmp/index.html
          grep -Fq '/home-menu-v20.js?v=20' /tmp/index.html
          ! grep -Fq 'Игровой маршрут' /tmp/index.html
          ! grep -Fq 'view-profile' /tmp/index.html
          ! grep -Fq 'view-settings' /tmp/index.html
          ! grep -Fq 'falling-stars-v19.webp' /tmp/index.html
          curl -fsS "$base/home-menu-v20.js?v=20&ci=$stamp" -o /tmp/app.js
          grep -Fq 'await playRasterAction(kind);openModal(kind)' /tmp/app.js
          ! grep -Fq 'PLANNER_STORAGE_KEY' /tmp/app.js
          curl -fsS "$base/layers/title-v20.webp?v=20&ci=$stamp" -o /tmp/title.webp
          test "$(wc -c < /tmp/title.webp)" -eq 55460
          echo 'f5244b39f0fff3dd5c30c919539c67d68bee0f5edc64bbe2032c86cc3f937132  /tmp/title.webp' | sha256sum -c -