name: Check Kingdoms strategy
on:
  push:
    branches: [claude/kingdoms-strategy-game-b70afy]
  pull_request:
    paths:
      - 'web/games/kingdoms*'
      - 'web/assets/kingdoms/**'
      - 'scripts/check-kingdoms*'
      - '.github/workflows/check-kingdoms.yml'
permissions:
  contents: read
jobs:
  strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:kingdoms
      - run: npm run check:build
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Test mobile layouts
        run: node scripts/check-kingdoms-browser.mjs
        env:
          KINGDOMS_SCREENSHOTS: /tmp/kingdoms-screenshots
      - name: Test the 3D diorama map
        run: node scripts/check-kingdoms-3d.mjs
        env:
          KINGDOMS_SCREENSHOTS: /tmp/kingdoms-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kingdoms-screenshots
          path: /tmp/kingdoms-screenshots
