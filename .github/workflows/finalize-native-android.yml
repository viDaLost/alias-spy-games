name: Finalize native Android transfer

on:
  push:
    branches:
      - agent/native-android-2.6.0
    paths:
      - '.native-upload/FINALIZE'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/native-android-2.6.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure native Android source is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android-app/app/build.gradle.kts ]; then
            test -d .native-upload
            cat .native-upload/payload-*.b64 > /tmp/native.b64
            base64 --decode /tmp/native.b64 > /tmp/native-truncated.zip
            zip -FF /tmp/native-truncated.zip --out /tmp/native.zip >/tmp/repair.log 2>&1 || { cat /tmp/repair.log; exit 1; }
            unzip -t /tmp/native.zip
            mkdir -p /tmp/native
            unzip -oq /tmp/native.zip -d /tmp/native
            test -f /tmp/native/android-app/app/build.gradle.kts
            test -f /tmp/native/android-app/app/src/main/java/com/vidalost/biblegames/MainActivity.kt
            test -f /tmp/native/android-app/app/src/main/res/drawable-nodpi/ic_launcher_adaptive.webp
            test -f /tmp/native/android-app/app/src/main/res/drawable-nodpi/ic_launcher_art.webp
            test -f /tmp/native/scripts/sync-android-assets.mjs
            rm -rf android-app
            cp -a /tmp/native/android-app ./android-app
            cp /tmp/native/scripts/sync-android-assets.mjs scripts/sync-android-assets.mjs
          fi

          test -f android-app/app/build.gradle.kts
          test -f android-app/app/src/main/AndroidManifest.xml
          test -f android-app/app/src/main/java/com/vidalost/biblegames/MainActivity.kt
          test -f android-app/app/src/main/res/drawable-nodpi/ic_launcher_adaptive.webp
          test -f android-app/app/src/main/res/drawable-nodpi/ic_launcher_art.webp
          test -f scripts/sync-android-assets.mjs

          if grep -R --line-number --fixed-strings 'class MainActivity' android-app/app/src/main/java/com/vidalost/biblegames/MainActivity.java 2>/dev/null; then
            echo 'Old Java/WebView wrapper is still present'
            exit 1
          fi

      - name: Preserve root ignore rules and add Android secret protection
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e origin/main:.gitignore 2>/dev/null; then
            git show origin/main:.gitignore > .gitignore
          else
            : > .gitignore
          fi
          cat >> .gitignore <<'EOF'

# Android local/generated files and signing material
android-app/.gradle/
android-app/**/build/
android-app/local.properties
*.jks
*.keystore
*.apk
*.aab
EOF

      - name: Install final native Android build workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/build-android-apk.yml <<'YAML'
          name: Build Android APK

          on:
            workflow_dispatch:
            pull_request:
              paths:
                - 'android-app/**'
                - 'scripts/sync-android-assets.mjs'
                - '.github/workflows/build-android-apk.yml'

          permissions:
            contents: read

          jobs:
            validate-debug-build:
              if: github.event_name == 'pull_request'
              runs-on: ubuntu-latest
              timeout-minutes: 25
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.11.1'
                - name: Sync Android packaged assets
                  run: node scripts/sync-android-assets.mjs
                - name: Build and lint native debug app
                  run: gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon

            build-signed-release:
              if: github.event_name == 'workflow_dispatch'
              runs-on: ubuntu-latest
              timeout-minutes: 30
              env:
                ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.11.1'

                - name: Validate release signing secrets
                  shell: bash
                  run: |
                    set -euo pipefail
                    for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
                      if [ -z "${!name:-}" ]; then
                        echo "Required GitHub Actions secret is missing: $name"
                        exit 1
                      fi
                    done

                - name: Restore release keystore
                  shell: bash
                  run: |
                    set -euo pipefail
                    KEYSTORE_PATH="$RUNNER_TEMP/biblegames-release.jks"
                    printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
                    chmod 600 "$KEYSTORE_PATH"
                    echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

                - name: Validate release key
                  shell: bash
                  run: |
                    set -euo pipefail
                    keytool -list \
                      -keystore "$ANDROID_KEYSTORE_PATH" \
                      -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                      -alias "$ANDROID_KEY_ALIAS" \
                      -keypass "$ANDROID_KEY_PASSWORD" >/dev/null

                - name: Sync Android packaged assets
                  run: node scripts/sync-android-assets.mjs

                - name: Build signed native APK and AAB
                  run: gradle -p android-app :app:assembleRelease :app:bundleRelease --no-daemon

                - name: Prepare release artifacts
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p dist
                    cp android-app/app/build/outputs/apk/release/app-release.apk dist/BibleGames-Android-2.6.0-native.apk
                    cp android-app/app/build/outputs/bundle/release/app-release.aab dist/BibleGames-Android-2.6.0-native.aab
                    sha256sum dist/BibleGames-Android-2.6.0-native.apk | tee dist/BibleGames-Android-2.6.0-native.apk.sha256
                    sha256sum dist/BibleGames-Android-2.6.0-native.aab | tee dist/BibleGames-Android-2.6.0-native.aab.sha256

                - name: Verify APK signature and reject debug certificates
                  shell: bash
                  run: |
                    set -euo pipefail
                    APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
                    test -n "$APKSIGNER"
                    VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs dist/BibleGames-Android-2.6.0-native.apk 2>&1)"
                    printf '%s\n' "$VERIFY_OUTPUT"
                    if printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'Android Debug|CN=Android Debug'; then
                      echo 'Refusing to publish an APK signed with an Android debug certificate.'
                      exit 1
                    fi

                - name: Remove restored keystore
                  if: always()
                  shell: bash
                  run: rm -f "$RUNNER_TEMP/biblegames-release.jks"

                - uses: actions/upload-artifact@v4
                  with:
                    name: BibleGames-Android-2.6.0-native-signed
                    path: |
                      dist/BibleGames-Android-2.6.0-native.apk
                      dist/BibleGames-Android-2.6.0-native.apk.sha256
                      dist/BibleGames-Android-2.6.0-native.aab
                      dist/BibleGames-Android-2.6.0-native.aab.sha256
                    if-no-files-found: error
                    retention-days: 30
          YAML

      - name: Document permanent signing setup without secrets
        shell: bash
        run: |
          set -euo pipefail
          cat > android-app/SIGNING.md <<'EOF'
          # Android release signing

          Native release builds use one permanent private signing key and never fall back to the Android debug key.

          Repository Actions secrets required by `Build Android APK`:

          - `ANDROID_KEYSTORE_BASE64`
          - `ANDROID_KEYSTORE_PASSWORD`
          - `ANDROID_KEY_ALIAS`
          - `ANDROID_KEY_PASSWORD`

          Keep the `.jks` file, Base64 value and passwords outside Git. Make at least two protected backups of the private key. All future self-distributed releases for `com.vidalost.biblegames` must keep the same signing key.

          The manual GitHub Actions release restores the keystore only in the temporary runner directory, validates the key, builds APK + AAB, verifies the APK with `apksigner`, rejects Android Debug certificates, emits SHA-256 checksums, and removes the temporary keystore.
          EOF

      - name: Validate native project before commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-android-assets.mjs
          gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon
          grep -Eq 'compileSdk[ =]+36' android-app/app/build.gradle.kts
          grep -Eq 'targetSdk[ =]+36' android-app/app/build.gradle.kts
          grep -Eq 'versionCode[ =]+12' android-app/app/build.gradle.kts
          grep -Eq 'versionName[ =]+"2\.6\.0-native"' android-app/app/build.gradle.kts
          grep -Rqs 'ANDROID_KEYSTORE_PATH' android-app
          if grep -Rqs 'signingConfigs\.debug\|signingConfig signingConfigs.debug' android-app; then
            echo 'Debug signing fallback found in native Android release configuration'
            exit 1
          fi

      - name: Remove transfer-only files and validate final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .native-upload
          rm -f __placeholder
          rm -f .github/workflows/check-native-partial-upload.yml
          rm -f .github/workflows/apply-native-android-upload.yml
          rm -f .github/workflows/apply-native-android-core.yml
          rm -f .github/workflows/finalize-native-android.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize native Android 2.6.0 transfer' || true

          bad=0
          while IFS= read -r path; do
            case "$path" in
              android-app/*|.github/workflows/build-android-apk.yml|scripts/sync-android-assets.mjs|.gitignore) ;;
              *) echo "Unexpected non-Android change: $path"; bad=1 ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          test "$bad" -eq 0
          git push origin HEAD:agent/native-android-2.6.0
