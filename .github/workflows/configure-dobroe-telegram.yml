name: Configure Dobroe ispovedanie Telegram bot

# Запускается вручную, один раз после создания бота у @BotFather. Токен бота
# хранится в секрете DOBROE_TELEGRAM_BOT_TOKEN. Шаг ставит боту кнопку меню,
# которая открывает приложение, и подписи, которые видны до нажатия «Старт».

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Point the bot menu button at the app
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DOBROE_TELEGRAM_BOT_TOKEN }}
          APP_URL: https://dobroe-ispovedanie.vitaledanilov.workers.dev/
        run: |
          node <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const appUrl = process.env.APP_URL;
          if (!token) throw new Error('Secret DOBROE_TELEGRAM_BOT_TOKEN is not set');

          async function telegram(method, payload = {}) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data?.ok !== true) throw new Error(`${method} failed: ${data?.description || `HTTP ${response.status}`}`);
            return data.result;
          }

          await telegram('setChatMenuButton', { menu_button: { type: 'web_app', text: 'Открыть', web_app: { url: appUrl } } });
          await telegram('setMyShortDescription', { short_description: 'Вопросы и ответы «Доброго исповедания» с текстами Писания.' });
          await telegram('setMyDescription', { description: 'Изучение «Доброго исповедания»: все вопросы и ответы с текстами Писания, карточки, заучивание наизусть и тесты. Нажмите «Открыть» внизу.' });

          const button = await telegram('getChatMenuButton');
          if (button?.web_app?.url !== appUrl) throw new Error(`Menu button mismatch: ${JSON.stringify(button)}`);
          console.log(`Menu button opens ${appUrl}`);
          NODE
