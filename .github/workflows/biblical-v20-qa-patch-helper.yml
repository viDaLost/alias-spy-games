name: Biblical V20 QA patch helper
on:
  push:
    branches:
      - fix/biblical-v20-lamps-move-rules
    paths:
      - .github/workflows/biblical-v20-qa-patch-helper.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/biblical-v20-lamps-move-rules
          fetch-depth: 0
      - name: Apply QA patch
        run: |
          python scripts/patch-biblical-v20-qa.py
          node --check scripts/check-biblical-match-three-visual.mjs
          git diff --check
      - name: Commit QA patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-biblical-match-three-visual.mjs
          git commit -m "Stabilize V20 lamp interaction QA"
          git push origin HEAD:fix/biblical-v20-lamps-move-rules
