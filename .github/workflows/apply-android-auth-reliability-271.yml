name: Apply Android auth reliability 2.7.1

on:
  push:
    branches: [fix/android-auth-reliability-2.7.1]
    paths:
      - 'scripts/apply-android-auth-reliability-271.py'
      - '.github/workflows/apply-android-auth-reliability-271.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-auth-reliability-2.7.1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reliability and Android-admin isolation patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-android-auth-reliability-271.py
          # The workflow token cannot update other workflow files. The release
          # artifact name is updated separately through the GitHub API after
          # this validated source commit lands on the branch.
          git checkout -- .github/workflows/build-android-apk.yml

      - name: Static and security checks
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/app-core-worker/src/index-v4.js
          node --check cloudflare/app-core-worker/src/android-auth-user-store.js
          node scripts/check-android-secure-auth.mjs
          node scripts/check-android-ban-enforcement.mjs
          node scripts/check-support-center.mjs
          if grep -q 'Вход администратора через Android недоступен' android-app/app/src/main/java/com/vidalost/biblegames/App.kt cloudflare/app-core-worker/src/index-v4.js; then
            echo 'Android still blocks the administrator account' >&2
            exit 1
          fi
          if grep -q 'ADMIN_ID' android-app/app/src/main/java/com/vidalost/biblegames/App.kt; then
            echo 'Android still contains an administrator special case' >&2
            exit 1
          fi
          grep -q 'TELEGRAM_BOT_USERNAME = "bibleiskie_bot"' android-app/app/src/main/java/com/vidalost/biblegames/App.kt
          grep -q 'INSERT OR IGNORE INTO android_sessions' cloudflare/app-core-worker/src/android-auth-user-store.js
          grep -q 'executeSmallJsonWithRetry' android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt

      - name: Build and lint Android
        run: gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon

      - name: Validate core Worker bundle
        working-directory: cloudflare/app-core-worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/core-auth-271

      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare/app-core-worker/node_modules
          rm -f cloudflare/app-core-worker/package-lock.json
          rm -f scripts/apply-android-auth-reliability-271.py .github/workflows/apply-android-auth-reliability-271.yml
          git config user.name "viDaLost"
          git config user.email "vitaledanilov@gmail.com"
          git add \
            android-app/app/build.gradle \
            android-app/app/src/main/java/com/vidalost/biblegames/App.kt \
            android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt \
            cloudflare/app-core-worker/src/index-v4.js \
            cloudflare/app-core-worker/src/android-auth-user-store.js \
            scripts/check-android-secure-auth.mjs \
            scripts/check-android-ban-enforcement.mjs \
            scripts/check-support-center.mjs
          git add -u scripts/apply-android-auth-reliability-271.py .github/workflows/apply-android-auth-reliability-271.yml
          git status --short
          test -z "$(git status --porcelain --untracked-files=no | grep 'node_modules' || true)"
          git commit -m "Fix Android Telegram auth reliability and admin isolation"
          git pull --rebase origin fix/android-auth-reliability-2.7.1
          git push origin HEAD:fix/android-auth-reliability-2.7.1
