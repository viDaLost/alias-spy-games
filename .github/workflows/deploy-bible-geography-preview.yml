name: Deploy Bible Geography preview

# Превью «Библейской географии» до публикации: игра живёт в своей ветке, в main
# и в меню приложения её ещё нет. Выкладывается отдельным воркером без кода —
# только страница игры и её файлы (scripts/build-bible-geography-preview.mjs).
# Основное приложение, его страницы на GitHub Pages и серверы не затрагиваются.
#
# Когда игра уйдёт в main, этот workflow удаляется, а воркер
# alias-spy-games-bible-geography-preview — через cleanup-cloudflare-previews.yml.

on:
  workflow_dispatch:
  push:
    branches: [claude/bible-geography]

permissions:
  contents: read

concurrency:
  group: bible-geography-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://alias-spy-games-bible-geography-preview.vitaledanilov.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tooling
        run: npm ci --no-audit --no-fund
      # Превью собирается из закоммиченных файлов сборки, поэтому сначала —
      # что они свежие, а данные игры сходятся с источником.
      - name: Check committed build is fresh
        run: npm run check:build
      - name: Check game data offline
        run: npm run check:bible-geography
      - name: Build preview
        run: node scripts/build-bible-geography-preview.mjs
      - name: Deploy preview Worker
        run: npx --yes wrangler@4.131.2 deploy --config preview-dist/bible-geography/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed preview
        run: |
          marker="bible-geography-${GITHUB_SHA::7}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 "${PREVIEW_URL}?check=${attempt}" | grep -Fq "$marker" \
              && curl -fsSL --max-time 20 "${PREVIEW_URL}web/games/bible-geography.js" | grep -Fq 'startBibleGeographyGame' \
              && curl -fsSL --max-time 20 "${PREVIEW_URL}web/locales/en/data/bible_geography.json" | grep -Fq '"heroes"'; then
              echo "Preview verified: ${PREVIEW_URL}"
              exit 0
            fi
            sleep 5
          done
          echo "Preview marker ${marker} not found at ${PREVIEW_URL}" >&2
          exit 1
