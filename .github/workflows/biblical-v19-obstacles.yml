name: Biblical V19 visible obstacles
on:
  push:
    branches:
      - fix/biblical-v19-visible-obstacles
    paths:
      - .github/workflows/biblical-v19-obstacles.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/biblical-v19-visible-obstacles
          fetch-depth: 0
      - name: Apply V19 obstacle patch
        run: python scripts/apply-biblical-v19-obstacles.py
      - name: Commit V19 obstacle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/games/biblical-match-three.js web/styles/biblical-match-three-v15-polish.css web/js/biblical-match-three-launcher.js index.html scripts/check-biblical-match-three.mjs scripts/check-biblical-match-three-visual.mjs
          git commit -m "Render Biblical Treasures obstacles with visible WebP art"
          git push origin HEAD:fix/biblical-v19-visible-obstacles
