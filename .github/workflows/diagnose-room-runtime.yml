name: Diagnose live room workers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-room-runtime.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4.120.0
      - name: Reproduce Quartet create and capture live exception
        shell: bash
        run: |
          set +e
          timeout 18s npx wrangler tail alias-spy-games-quartet --format json --status error > /tmp/quartet-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 4
          echo '--- quartet response ---'
          curl -sS -i -X POST 'https://alias-spy-games-quartet.vitaledanilov.workers.dev/rooms' \
            -H 'Origin: https://vidalost.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"guestId":"diag_quartet_20260813","name":"Diag","requestId":"diag-quartet-20260813"}'
          echo
          sleep 4
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo '--- quartet tail ---'
          cat /tmp/quartet-tail.log || true
      - name: Reproduce Bible Sketch create and capture live exception
        shell: bash
        run: |
          set +e
          echo '--- bible sketch catalog ---'
          CATALOG="$(curl -sS 'https://alias-spy-games-bible-sketch.vitaledanilov.workers.dev/catalog' -H 'Origin: https://vidalost.github.io')"
          printf '%s\n' "$CATALOG"
          CATEGORY="$(printf '%s' "$CATALOG" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const a=j.categories||j.catalog||[];process.stdout.write(String(a[0]?.id||a[0]?.categoryId||'people'))}catch{process.stdout.write('people')}})")"
          timeout 18s npx wrangler tail alias-spy-games-bible-sketch --format json --status error > /tmp/sketch-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 4
          echo '--- bible sketch response ---'
          curl -sS -i -X POST 'https://alias-spy-games-bible-sketch.vitaledanilov.workers.dev/rooms' \
            -H 'Origin: https://vidalost.github.io' \
            -H 'Content-Type: application/json' \
            --data "{\"guestId\":\"diag_sketch_20260813\",\"name\":\"Diag\",\"requestId\":\"diag-sketch-20260813\",\"categoryId\":\"$CATEGORY\"}"
          echo
          sleep 4
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo '--- bible sketch tail ---'
          cat /tmp/sketch-tail.log || true
