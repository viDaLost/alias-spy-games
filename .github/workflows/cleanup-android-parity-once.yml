name: Cleanup Android parity once

on:
  push:
    branches: [android-web-parity-v210]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-web-parity-v210
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove duplicate App parity insertions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'android-app/app/src/main/java/com/vidalost/biblegames/App.kt';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace('import androidx.compose.foundation.lazy.rememberLazyListState\nimport androidx.compose.foundation.lazy.rememberLazyListState\n', 'import androidx.compose.foundation.lazy.rememberLazyListState\n');
          s = s.replace('import com.vidalost.biblegames.ui.HomeContinueCard\nimport com.vidalost.biblegames.ui.HomeParallaxBackground\nimport com.vidalost.biblegames.ui.HomeProgressSummary\nimport com.vidalost.biblegames.ui.HomeContinueCard\nimport com.vidalost.biblegames.ui.HomeParallaxBackground\nimport com.vidalost.biblegames.ui.HomeProgressSummary\n', 'import com.vidalost.biblegames.ui.HomeContinueCard\nimport com.vidalost.biblegames.ui.HomeParallaxBackground\nimport com.vidalost.biblegames.ui.HomeProgressSummary\n');
          const block = `            history.firstOrNull()?.let(GameKey::fromRoute)?.let { latest ->\n                item { HomeContinueCard(latest, assets) { onOpenGame(latest) } }\n            }\n            item { HomeProgressSummary(profile) }\n`;
          const doubled = block + block;
          if (s.includes(doubled)) s = s.replace(doubled, block);
          fs.writeFileSync(path, s);
          NODE
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/java/com/vidalost/biblegames/App.kt
          git commit -m 'fix(android): remove duplicate home parity blocks'
          git push origin HEAD:android-web-parity-v210
