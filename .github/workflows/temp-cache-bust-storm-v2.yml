name: Temporary request-storm cache bust patch

on:
  push:
    branches: [perf/stop-cloudflare-reconnect-storm-v2]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cache-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/stop-cloudflare-reconnect-storm-v2
      - name: Patch cache keys and dynamic game versions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace('index.html', 'request-budget-v1-20260823', 'request-storm-v2-20260824')
          replace('index.html', 'web/js/error-system.js?v=2', 'web/js/error-system.js?v=3')
          replace('index.html', 'web/js/app.js?v=24', 'web/js/app.js?v=25')
          replace('index.html', 'web/js/cloudflare-request-budget.js?v=1', 'web/js/cloudflare-request-budget.js?v=2')
          replace('index.html', 'web/js/quartet-production-v43-loader.js?v=43', 'web/js/quartet-production-v43-loader.js?v=44')
          replace('index.html', 'web/js/bible-sketch-launcher.js?v=5', 'web/js/bible-sketch-launcher.js?v=6')
          replace('index.html', 'web/js/presence-identity.js?v=6', 'web/js/presence-identity.js?v=7')
          replace('web/js/app.js', 'script.src = `${fileName}?v=20`;', 'script.src = `${fileName}?v=21`;')
          replace('web/js/bible-sketch-launcher.js', "script.src = 'web/games/bible-sketch.js?v=2';", "script.src = 'web/games/bible-sketch.js?v=3';")
          replace('scripts/check-presence-freshness.mjs', "presence-identity.js?v=6", "presence-identity.js?v=7")
          replace('scripts/check-cloudflare-request-budget.mjs', "cloudflare-request-budget.js?v=1", "cloudflare-request-budget.js?v=2")
          replace('scripts/check-cloudflare-request-budget.mjs', "presence-identity.js?v=6", "presence-identity.js?v=7")
          replace('scripts/check-cloudflare-request-budget.mjs', "request-budget-v1-20260823", "request-storm-v2-20260824")
          replace('scripts/check-cloudflare-request-budget.mjs', "web/js/app.js?v=24", "web/js/app.js?v=25")
          replace('scripts/check-cloudflare-request-budget.mjs', "web/js/cloudflare-request-budget.js?v=1", "web/js/cloudflare-request-budget.js?v=2")
          replace('scripts/check-request-budget-browser.mjs', '/web/js/cloudflare-request-budget.js?v=1', '/web/js/cloudflare-request-budget.js?v=2')
          PY
          git rm .github/workflows/temp-cache-bust-storm-v2.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bust request-storm client caches [cache-patched]"
          git push origin HEAD:perf/stop-cloudflare-reconnect-storm-v2
