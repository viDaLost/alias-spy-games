name: Apply optimized upload

on:
  push:
    branches:
      - agent/optimize-existing-games-nopwa
    paths:
      - ".github/workflows/apply-optimized-upload.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild optimized project
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/chunk-*.b64 > /tmp/project.b64
          base64 --decode /tmp/project.b64 > /tmp/project-truncated.zip

          # The uploaded stream contains all local file records; only the final ZIP directory tail
          # is absent, so rebuild the ZIP directory before extraction.
          zip -FF /tmp/project-truncated.zip --out /tmp/project.zip >/tmp/zip-repair.log 2>&1
          unzip -t /tmp/project.zip
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project

          # Never import local repository metadata or temporary upload files.
          rm -rf /tmp/project/.git /tmp/project/.upload

          # Replace the branch working tree while preserving this checkout's .git directory.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/project/. .

          npm run check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize existing games without PWA"
          git push origin HEAD:"$GITHUB_REF_NAME"
