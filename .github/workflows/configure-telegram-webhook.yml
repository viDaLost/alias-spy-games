name: Configure Telegram webhook updates

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy app core backend"]
    types: [completed]

permissions:
  contents: read

jobs:
  configure:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable Telegram message and callback updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CORE_WORKER_URL: https://alias-spy-games-core.vitaledanilov.workers.dev
        run: |
          node <<'NODE'
          const crypto = await import('node:crypto');
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const workerUrl = String(process.env.CORE_WORKER_URL || '').replace(/\/+$/, '');
          if (!token || !workerUrl) throw new Error('Telegram webhook environment is incomplete');

          const secretToken = crypto.createHash('sha256').update(token).digest('hex');
          const webhookUrl = `${workerUrl}/telegram/webhook`;

          async function telegram(method, payload = {}) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data?.ok !== true) {
              throw new Error(`${method} failed: ${data?.description || `HTTP ${response.status}`}`);
            }
            return data.result;
          }

          await telegram('setWebhook', {
            url: webhookUrl,
            secret_token: secretToken,
            allowed_updates: ['message', 'callback_query'],
            drop_pending_updates: false,
          });

          const configured = await telegram('getWebhookInfo');
          const allowed = Array.isArray(configured?.allowed_updates) ? configured.allowed_updates : [];
          if (configured?.url !== webhookUrl) {
            throw new Error(`Telegram webhook mismatch: ${configured?.url || 'empty'}`);
          }
          if (!allowed.includes('message') || !allowed.includes('callback_query')) {
            throw new Error(`Telegram allowed_updates mismatch: ${allowed.join(', ') || 'empty'}`);
          }

          console.log(`Telegram webhook configured with updates: ${allowed.join(', ')}`);
          NODE
