name: Deploy Quartet preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-quartet-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_REF: agent/quartet-cloudflare-v2
  PAGES_PROJECT: vidalost-alias-spy-games-quartet-preview-20260808
  PREVIEW_ORIGIN: https://vidalost-alias-spy-games-quartet-preview-20260808.pages.dev

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartet v2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@4.120.0 pages project list | grep -Fq "$PAGES_PROJECT"; then
            npx --yes wrangler@4.120.0 pages project create "$PAGES_PROJECT" --production-branch=quartet-v2
          fi

      - name: Prepare public preview files
        run: |
          rm -rf preview-dist
          mkdir preview-dist
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -exec cp '{}' preview-dist/ \;
          cp -R assets data games preview-dist/

      - name: Allow preview origin and redeploy Quartet Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SESSION_SECRET: ${{ secrets.QUARTET_SESSION_SECRET }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'cloudflare/quartet-worker/wrangler.jsonc';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace(
            '"ALLOWED_ORIGINS": "https://vidalost.github.io"',
            `"ALLOWED_ORIGINS": "https://vidalost.github.io,${process.env.PREVIEW_ORIGIN}"`
          );
          fs.writeFileSync(path, text);
          NODE
          cd cloudflare/quartet-worker
          npm install --no-audit --no-fund
          npx wrangler deploy
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET

      - name: Deploy frontend preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.120.0 pages deploy preview-dist \
            --project-name="$PAGES_PROJECT" \
            --branch=quartet-v2 \
            --commit-hash="$GITHUB_SHA"
          echo "### Quartet v2 preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
