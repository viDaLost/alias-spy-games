name: Deploy Moses Nile Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/moses-nile-runner-mvp
    paths:
      - 'web/games/moses-nile-v7/**'
      - 'web/assets/models/moses-nile/woven-basket.obj'
      - '.github/workflows/deploy-moses-nile-preview.yml'

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build AI Studio V7 standalone
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .preview-dist
          mkdir -p .preview-dist/js .preview-dist/vendor .preview-dist/models
          cp web/games/moses-nile-v7/index.html .preview-dist/index.html
          cp web/games/moses-nile-v7/js/*.js .preview-dist/js/
          cp web/assets/models/moses-nile/woven-basket.obj .preview-dist/models/basket.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-dist/models/woven-basket.obj

          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/build/three.min.js -o .preview-dist/vendor/three-r128.min.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/GLTFLoader.js -o .preview-dist/vendor/GLTFLoader-r128.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/OBJLoader.js -o .preview-dist/vendor/OBJLoader-r128.js

          cat > .preview-dist/README.txt <<'TXT'
          Моисей: Путь по Нилу — V7 AI Studio
          Автономная браузерная 3D-сборка. Three.js, loaders и корзина лежат локально.
          Запуск локально: python3 -m http.server 8080
          Затем открыть http://localhost:8080/
          TXT

          cat > .preview-wrangler.jsonc <<'JSON'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "alias-spy-games-moses-nile-preview",
            "compatibility_date": "2026-08-19",
            "workers_dev": true,
            "assets": {
              "directory": "./.preview-dist",
              "not_found_handling": "single-page-application"
            }
          }
          JSON

      - name: Validate V7 bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check .preview-dist/js/sound.js
          node --check .preview-dist/js/assets.js
          node --check .preview-dist/js/game.js
          test -s .preview-dist/index.html
          test -s .preview-dist/vendor/three-r128.min.js
          test -s .preview-dist/vendor/GLTFLoader-r128.js
          test -s .preview-dist/vendor/OBJLoader-r128.js
          test -s .preview-dist/models/basket.obj
          grep -q 'PerspectiveCamera' .preview-dist/js/game.js
          grep -q 'loadBasketModel' .preview-dist/js/assets.js
          grep -q 'models/basket.obj' .preview-dist/js/assets.js
          grep -q 'powerPreference' .preview-dist/js/game.js
          grep -q 'V7 · AI STUDIO' .preview-dist/index.html
          ! grep -q 'cdnjs.cloudflare.com' .preview-dist/index.html
          ! grep -q 'cdn.jsdelivr.net' .preview-dist/index.html

      - name: Upload V7 standalone ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: moses-nile-runner-v7-ai-studio
          path: .preview-dist
          if-no-files-found: error
          retention-days: 7

      - name: Deploy isolated V7 preview to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config .preview-wrangler.jsonc

      - name: Print preview URL
        run: echo 'Preview: https://alias-spy-games-moses-nile-preview.vitaledanilov.workers.dev/'
