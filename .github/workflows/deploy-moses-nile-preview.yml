name: Deploy Moses Nile V7.1 Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/moses-nile-runner-mvp
    paths:
      - 'web/games/moses-nile-v7/**'
      - 'web/assets/models/moses-nile/woven-basket.obj'
      - '.github/workflows/deploy-moses-nile-preview.yml'

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build V7.1 with project models
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .preview-dist
          mkdir -p \
            .preview-dist/js \
            .preview-dist/vendor \
            .preview-dist/models/environment/nature_pack \
            .preview-dist/models/environment/survival_pack

          cp web/games/moses-nile-v7/index.html .preview-dist/index.html
          cp web/games/moses-nile-v7/js/*.js .preview-dist/js/
          cp web/assets/models/moses-nile/woven-basket.obj .preview-dist/models/basket.obj
          cp web/assets/models/moses-nile/woven-basket.obj .preview-dist/models/woven-basket.obj

          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/build/three.min.js -o .preview-dist/vendor/three-r128.min.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/GLTFLoader.js -o .preview-dist/vendor/GLTFLoader-r128.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/OBJLoader.js -o .preview-dist/vendor/OBJLoader-r128.js

          MODEL_REV=d6aacfb25dd969ead90cddd94ad901e74aede5d8
          MODEL_BASE="https://raw.githubusercontent.com/trebeljahr/quaternius-showcase/${MODEL_REV}/public/glb"
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Rock_1.glb" -o .preview-dist/models/environment/nature_pack/Rock_1.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Plant_2.glb" -o .preview-dist/models/environment/nature_pack/Plant_2.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Bush_1.glb" -o .preview-dist/models/environment/nature_pack/Bush_1.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Grass.glb" -o .preview-dist/models/environment/nature_pack/Grass.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/Plant_1.glb" -o .preview-dist/models/environment/nature_pack/Plant_1.glb
          curl -fsSL --retry 3 "$MODEL_BASE/nature_pack/PalmTree_4.glb" -o .preview-dist/models/environment/nature_pack/PalmTree_4.glb
          curl -fsSL --retry 3 "$MODEL_BASE/survival_pack/WoodLog.glb" -o .preview-dist/models/environment/survival_pack/WoodLog.glb
          curl -fsSL --retry 3 "$MODEL_BASE/survival_pack/Raft.glb" -o .preview-dist/models/environment/survival_pack/Raft.glb

          cat > .preview-dist/README.txt <<'TXT'
          Моисей: Путь по Нилу — V7.1 OUR MODELS
          В сборку локально включены корзина и модели окружения проекта.
          Запуск локально: python3 -m http.server 8080
          TXT

          cat > .preview-wrangler.jsonc <<'JSON'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "alias-spy-games-moses-nile-v7-preview",
            "compatibility_date": "2026-08-19",
            "workers_dev": true,
            "assets": {
              "directory": "./.preview-dist",
              "not_found_handling": "single-page-application"
            }
          }
          JSON

      - name: Validate V7.1 model bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check .preview-dist/js/sound.js
          node --check .preview-dist/js/assets.js
          node --check .preview-dist/js/game.js
          grep -q 'V7.1 · OUR MODELS' .preview-dist/index.html
          grep -q 'preloadEnvironmentModels' .preview-dist/js/assets.js
          grep -q "cloneModel('rock'" .preview-dist/js/game.js
          grep -q "cloneModel('log'" .preview-dist/js/game.js
          grep -q "modelDecor('palm'" .preview-dist/js/game.js
          test -s .preview-dist/models/basket.obj
          for file in Rock_1.glb Plant_2.glb Bush_1.glb Grass.glb Plant_1.glb PalmTree_4.glb; do test -s ".preview-dist/models/environment/nature_pack/$file"; done
          for file in WoodLog.glb Raft.glb; do test -s ".preview-dist/models/environment/survival_pack/$file"; done
          ! grep -q 'cdnjs.cloudflare.com' .preview-dist/index.html
          ! grep -q 'cdn.jsdelivr.net' .preview-dist/index.html

      - name: Upload V7.1 standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: moses-nile-runner-v7-1-project-models
          path: .preview-dist
          if-no-files-found: error
          retention-days: 7

      - name: Deploy V7.1 preview to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config .preview-wrangler.jsonc

      - name: Print preview URL
        run: echo 'https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/'
