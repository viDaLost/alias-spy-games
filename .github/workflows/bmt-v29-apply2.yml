name: Apply Biblical Treasures V29 fixes retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bmt-v29-apply2.yml'

permissions:
  contents: write
  pages: write

env:
  SRC_BRANCH: bmt-v29-assets
  ASSET_BRANCH: bmt-v28-targeted-fix

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish Biblical Treasures V29 only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error file=.github/workflows/bmt-v29-apply2.yml,line=${LINENO}::V29 failed: ${BASH_COMMAND}"; exit $rc' ERR
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/${SRC_BRANCH}:refs/remotes/origin/${SRC_BRANCH}" "+refs/heads/${ASSET_BRANCH}:refs/remotes/origin/${ASSET_BRANCH}"

          copy_stage() {
            local source="$1" target="$2"
            mkdir -p "$(dirname "$target")"
            git show "refs/remotes/origin/${SRC_BRANCH}:.bmt-v29-src/${source}" > "$target"
          }
          copy_stage index.html index.html
          copy_stage web/js/v22-game-loader.js web/js/v22-game-loader.js
          copy_stage web/js/v22-home-art.js web/js/v22-home-art.js
          copy_stage web/js/v23-biblical-treasures-polish.js web/js/v23-biblical-treasures-polish.js
          copy_stage web/js/v24-biblical-treasures-board.js web/js/v24-biblical-treasures-board.js
          copy_stage web/js/v29-biblical-treasures-hotfix.js web/js/v29-biblical-treasures-hotfix.js
          copy_stage web/styles/biblical-match-three-v21-art.css web/styles/biblical-match-three-v21-art.css
          copy_stage web/styles/biblical-match-three-v23-polish.css web/styles/biblical-match-three-v23-polish.css
          copy_stage web/styles/biblical-match-three-v24-board.css web/styles/biblical-match-three-v24-board.css

          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/js/biblical-match-three-launcher.js')
          s=p.read_text()
          if 'const VERSION="28";' not in s:
              raise SystemExit('launcher V28 marker missing')
          p.write_text(s.replace('const VERSION="28";','const VERSION="29";',1))
          PY

          mkdir -p web/assets/biblical-match-three/icons-v29

          decode_chunks() {
            local prefix="$1" out="$2"
            local list tmp
            list="$(mktemp)"; tmp="$(mktemp)"
            git ls-tree -r --name-only "refs/remotes/origin/${ASSET_BRANCH}" .bmt-v28-assets > "$list"
            grep -E "^\.bmt-v28-assets/${prefix}\.[0-9]+\.txt$" "$list" | sort -V > "${list}.sorted"
            test -s "${list}.sorted"
            : > "$tmp"
            while IFS= read -r f; do git show "refs/remotes/origin/${ASSET_BRANCH}:$f" >> "$tmp"; done < "${list}.sorted"
            tr -d '\r\n' < "$tmp" | base64 -d > "$out"
            rm -f "$list" "${list}.sorted" "$tmp"
          }
          decode_chunks completion-1 web/assets/biblical-match-three/completion-1-star-v29.webp
          decode_chunks completion-2 web/assets/biblical-match-three/completion-2-stars-v29.webp

          # The original V28 asset job defined these exact decoded content hashes.
          test "$(git hash-object web/assets/biblical-match-three/completion-1-star-v29.webp)" = "6f4f21f4bee439f446acd481285c6c5b174f141c"
          test "$(git hash-object web/assets/biblical-match-three/completion-2-stars-v29.webp)" = "99041d52f35ba315589ab382ca609979c0623b47"

          if command -v magick >/dev/null 2>&1; then
            IM=magick
          elif command -v convert >/dev/null 2>&1; then
            IM=convert
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            IM=convert
          fi
          "$IM" web/assets/biblical-match-three/completion-2-stars-v29.webp -crop 112x112+196+374 +repage /tmp/bmt-gold-star.png
          "$IM" web/assets/biblical-match-three/completion-2-stars-v29.webp /tmp/bmt-gold-star.png -geometry +398+374 -composite -quality 94 web/assets/biblical-match-three/completion-3-stars-v29.webp

          # Fix the real file format for the board background and keep the real raster lamp.
          cp web/assets/biblical-match-three/board-background-v28.avif web/assets/biblical-match-three/board-background-v29.webp
          cp web/assets/biblical-match-three/icons-v28/lamp-unlit.webp web/assets/biblical-match-three/icons-v29/lamp-unlit.webp

          # Restore the proper Bible icon in the main menu.
          cp web/assets/biblical-match-three/icons-v17/bible.webp web/assets/icons/biblical-treasures.webp

          # Remove stale Biblical Treasures V27/V28 assets and scripts only.
          find web/assets/biblical-match-three -maxdepth 1 -type f -name 'completion-*' ! -name '*-v29.webp' -delete
          find web/assets/biblical-match-three -maxdepth 1 -type f -name 'board-background-*' ! -name 'board-background-v29.webp' -delete
          rm -rf web/assets/biblical-match-three/icons-v27 web/assets/biblical-match-three/icons-v28
          rm -f web/js/v27-biblical-treasures-hotfix.js
          rm -f .github/workflows/bmt-v29-apply.yml .github/workflows/bmt-v29-apply2.yml

          # Browser-decodable files, correct icon, and syntactically valid V29 code are mandatory.
          for f in \
            web/assets/biblical-match-three/completion-1-star-v29.webp \
            web/assets/biblical-match-three/completion-2-stars-v29.webp \
            web/assets/biblical-match-three/completion-3-stars-v29.webp \
            web/assets/biblical-match-three/board-background-v29.webp \
            web/assets/biblical-match-three/icons-v29/lamp-unlit.webp; do
            test -s "$f"
            file "$f" | grep -qiE 'Web/P|WebP'
          done
          test "$(git hash-object web/assets/icons/biblical-treasures.webp)" = "38452e11d051afe2eb94afbe4f1e137d5f10078c"

          node --check web/js/biblical-match-three-launcher.js
          node --check web/js/v22-game-loader.js
          node --check web/js/v22-home-art.js
          node --check web/js/v23-biblical-treasures-polish.js
          node --check web/js/v24-biblical-treasures-board.js
          node --check web/js/v29-biblical-treasures-hotfix.js

          grep -q 'const VERSION="29";' web/js/biblical-match-three-launcher.js
          grep -q 'completion-3-stars-v29.webp' web/js/v23-biblical-treasures-polish.js
          grep -q 'board-background-v29.webp' web/styles/biblical-match-three-v24-board.css
          grep -q 'icons-v29/lamp-unlit.webp' web/js/v24-biblical-treasures-board.js
          grep -q 'has-lamp' web/js/v29-biblical-treasures-hotfix.js
          grep -q 'bmtArkGuardV29' web/js/v29-biblical-treasures-hotfix.js
          test ! -e web/js/v27-biblical-treasures-hotfix.js
          test ! -e web/assets/biblical-match-three/board-background-v28.avif

          ! grep -nE 'board-background-v28|completion-[123].*v28|icons-v28/lamp-unlit|v27-biblical-treasures-hotfix|[?&]v=28' \
            index.html web/js/biblical-match-three-launcher.js web/js/v22-game-loader.js web/js/v22-home-art.js \
            web/js/v23-biblical-treasures-polish.js web/js/v24-biblical-treasures-board.js web/js/v29-biblical-treasures-hotfix.js \
            web/styles/biblical-match-three-v21-art.css web/styles/biblical-match-three-v23-polish.css web/styles/biblical-match-three-v24-board.css

          # Scope guard: no other game or unrelated application file may be modified.
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/bmt-v29-apply.yml|.github/workflows/bmt-v29-apply2.yml|index.html|\
              web/js/biblical-match-three-launcher.js|web/js/v22-game-loader.js|web/js/v22-home-art.js|\
              web/js/v23-biblical-treasures-polish.js|web/js/v24-biblical-treasures-board.js|\
              web/js/v27-biblical-treasures-hotfix.js|web/js/v29-biblical-treasures-hotfix.js|\
              web/styles/biblical-match-three-v21-art.css|web/styles/biblical-match-three-v23-polish.css|web/styles/biblical-match-three-v24-board.css|\
              web/assets/icons/biblical-treasures.webp|web/assets/biblical-match-three/board-background-*|\
              web/assets/biblical-match-three/completion-*|web/assets/biblical-match-three/icons-v27/*|\
              web/assets/biblical-match-three/icons-v28/*|web/assets/biblical-match-three/icons-v29/*) ;;
              *) echo "Refusing unrelated change: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only HEAD)

          git add -A
          git commit -m "Fix Biblical Treasures V29 art and lamp interactions"
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
