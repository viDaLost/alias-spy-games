name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Картинки и библиотеки превью «Земли обетованной» в репозитории не
      # лежат: они копируются из web/assets и web/games тем же скриптом, что
      # и при развёртывании. Без этого шага проверка ссылок честно ругается на
      # три-r128 и GLTFLoader — файлов и правда нет, пока их не разложат.
      - name: Sync Promised Land preview art
        run: node scripts/sync-promised-land-art.mjs
      - name: Validate project
        run: npm run check
      - name: Check rich admin broadcast mount
        run: node scripts/check-broadcast-ui.mjs
      - name: Enforce Cloudflare-only core data
        run: npm run check:cloudflare-core
      - name: Test Quartet server engine
        run: node --test cloudflare/quartet-worker/test/*.test.mjs
      - name: Test Bible Sketch server engine
        run: node --test cloudflare/bible-sketch-worker/test/*.test.mjs
      - name: Check presence freshness logic
        run: node scripts/check-presence-freshness.mjs
      - name: Check support center integration
        run: node scripts/check-support-center.mjs
      - name: Check referral survey and inactive cleanup
        run: node scripts/check-referral-retention.mjs
      - name: Check room QR invites
        run: node scripts/check-room-invites.mjs
      - name: Check Bible word search levels
        run: npm run check:wordsearch
      - name: Check Bible WOW levels
        run: npm run check:bible-wow
      - name: Verify the dark theme matches its sources
        run: npm run check:dark
      - name: Check Android ban enforcement
        run: node scripts/check-android-ban-enforcement.mjs
      - name: Check Android verified Telegram authentication
        run: node scripts/check-android-secure-auth.mjs
      - name: Check registration administrator notifications
        run: node scripts/check-registration-admin-notifications.mjs
      - name: Compare Web and Android game catalogs
        run: node scripts/check-web-android-game-parity.mjs
      - name: Check Android Biblical Treasures parity and level reachability
        run: node scripts/check-android-biblical-treasures.mjs
      - name: Play out Promised Land rules
        run: node scripts/check-promised-land.mjs
      - name: Check Promised Land building models
        run: node scripts/check-promised-land-models.mjs
      - name: Check Promised Land room state
        run: node scripts/check-promised-land-room.mjs
      - name: Measure Promised Land dice fairness
        run: node scripts/check-promised-land-dice.mjs
      - name: Play new Promised Land bots against the old ones
        run: node scripts/check-promised-land-bots.mjs
      - name: Audit Promised Land mechanics turn by turn
        run: node scripts/check-promised-land-logic.mjs
      - name: Audit Twelve Tribes card rules round by round
        run: node scripts/check-twelve-tribes.mjs
      - name: Install Promised Land preview tooling
        working-directory: cloudflare/promised-land-preview
        run: npm install --no-audit --no-fund
      - name: Validate Promised Land Worker bundle
        working-directory: cloudflare/promised-land-preview
        run: npx wrangler deploy --dry-run --outdir /tmp/promised-land-build
      - name: Play Promised Land over the network
        run: node scripts/check-promised-land-online.mjs
      - name: Install Quartet Worker tooling
        working-directory: cloudflare/quartet-worker
        run: npm install --no-audit --no-fund
      - name: Validate Cloudflare Worker bundle
        working-directory: cloudflare/quartet-worker
        run: npx wrangler deploy --dry-run --outdir /tmp/quartet-worker-build
      - name: Install Bible Sketch Worker tooling
        working-directory: cloudflare/bible-sketch-worker
        run: npm install --no-audit --no-fund
      - name: Validate Bible Sketch Worker bundle
        working-directory: cloudflare/bible-sketch-worker
        run: npx wrangler deploy --dry-run --outdir /tmp/bible-sketch-worker-build
      - name: Install observability Worker tooling
        working-directory: cloudflare/app-observability-worker
        run: npm install --no-audit --no-fund
      - name: Validate observability Worker bundle
        working-directory: cloudflare/app-observability-worker
        run: npx wrangler deploy --dry-run --outdir /tmp/app-observability-worker-build
      - name: Install core Worker tooling
        working-directory: cloudflare/app-core-worker
        run: npm install --no-audit --no-fund
      - name: Validate core Worker bundle
        working-directory: cloudflare/app-core-worker
        run: npx wrangler deploy --dry-run --outdir /tmp/app-core-worker-build

  smoke-games:
    name: Browser, mobile, home and error checks
    runs-on: ubuntu-latest
    # Пятнадцати минут задаче перестало хватать: браузерных проверок тридцать
    # одна, и самые тяжёлые идут по две-три минуты. Прошлый прогон оборвался на
    # двадцать второй, и хвост списка не проверился вовсе. Проверки теперь
    # ходят пачками по три, но запас нужен и на медленную машину.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tooling
        run: npm install --no-audit --no-fund
      - name: Verify the committed bundle matches its sources
        run: npm run check:build
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium is not installed on the GitHub runner"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Using $CHROME_BIN"
      - name: Check root-only languages and localized games
        run: npm run check:languages && node scripts/check-languages-browser.mjs
      - name: Check Android ID login runtime and Bible Sketch foreground
        run: npm run check:android
      - name: Check home dashboard startup and controls
        run: npm run check:home
      - name: Check admin live recovery on mobile
        run: npm run check:admin-live:browser
      - name: Check live presence game transitions
        run: npm run check:presence:browser
      - name: Check Cloudflare request budget in browser
        run: npm run check:request-budget:browser
      - name: Check Telegram swipe guard on game boards
        run: npm run check:swipe-guard
      - name: Open every game and return to menu
        run: npm run smoke:games
      - name: Test Biblical Treasures HQ icons and swipe
        run: npm run check:match-three:visual
      - name: Test Kids Ark Pairs gameplay
        run: npm run check:kids-pairs
      - name: Test Moses Nile runner gestures
        run: npm run check:nile-runner
      - name: Test Moses Nile V7.5 cinematic and lite modes
        run: npm run check:nile-v75
      - name: Check 390px and 320px phone layouts
        run: npm run check:mobile
      - name: Check friendly error boundary
        run: npm run check:errors
      - name: Check admin panel sections
        run: npm run check:admin-sections
      - name: Check word search level picker
        run: npm run check:level-modal
      # Игра по сети проверяется на настоящем воркере: проверка поднимает его
      # локально через wrangler, и без его зависимостей ей не на чем играть.
      - name: Install Promised Land preview tooling
        working-directory: cloudflare/promised-land-preview
        run: npm install --no-audit --no-fund
      # Проверки, которым нужен настоящий браузер. В задаче validate его нет —
      # там и зависимости не ставятся, — поэтому они живут здесь, рядом с
      # остальными браузерными.
      - name: Run browser-backed project checks
        run: npm run check:browser
      - name: Check Sacred Word without WebGL
        run: npm run check:sacred-fallback
