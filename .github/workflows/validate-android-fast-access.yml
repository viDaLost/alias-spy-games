name: Validate Android fast access

on:
  push:
    branches: [agent/android-fast-access-refresh-2.6.6]
    paths:
      - '.github/workflows/validate-android-fast-access.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-fast-access-refresh-2.6.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run targeted checks
        run: |
          npm run check
          node scripts/check-android-ban-enforcement.mjs
          node scripts/check-support-center.mjs
      - name: Build and lint Android debug APK
        run: gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon
      - name: Validate core Worker bundle
        working-directory: cloudflare/app-core-worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/app-core-worker-build
