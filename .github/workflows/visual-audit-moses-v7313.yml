name: Visual Audit Moses Nile V7.3.13

on:
  workflow_dispatch:
  push:
    branches: [feature/moses-nile-runner-mvp]
    paths:
      - 'web/games/moses-nile-v7/**'
      - '.github/workflows/visual-audit-moses-v7313.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for V7.3.13 preview
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/'
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 "${PREVIEW}?visualAuditProbe=${GITHUB_SHA}-${i}" | grep -q 'V7.3.13 · LOADING'; then exit 0; fi
            sleep 6
          done
          exit 1
      - name: Capture mobile and desktop frames
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          URL="https://alias-spy-games-moses-nile-v7-preview.vitaledanilov.workers.dev/?visualAudit=1&sha=${GITHUB_SHA}"
          mkdir -p visual-audit
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --hide-scrollbars --window-size=390,844 --virtual-time-budget=22000 --run-all-compositor-stages-before-draw --screenshot=visual-audit/mobile.png "$URL"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --hide-scrollbars --window-size=1280,800 --virtual-time-budget=22000 --run-all-compositor-stages-before-draw --screenshot=visual-audit/desktop.png "$URL"
          test -s visual-audit/mobile.png
          test -s visual-audit/desktop.png
          printf 'commit=%s\nversion=V7.3.13\ncapture=success\nurl=%s\n' "$GITHUB_SHA" "$URL" > visual-audit/status.txt
      - name: Publish screenshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B verify/moses-nile-v7313-visual
          git add visual-audit || true
          git commit -m 'Capture Moses Nile V7.3.13 visual audit' || true
          git push --force origin HEAD:refs/heads/verify/moses-nile-v7313-visual
