name: Apply Android network resilience 2.7.3

on:
  push:
    branches: [fix/android-network-resilience-2.7.3]
    paths:
      - 'scripts/apply-android-network-resilience-273.py'
      - '.github/workflows/apply-android-network-resilience-273.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-network-resilience-2.7.3
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: python scripts/apply-android-network-resilience-273.py

      - name: Update rate-limit regression check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-android-secure-auth.mjs')
          text = p.read_text(encoding='utf-8')
          old = 'MAX_CHALLENGES_PER_ID = 3'
          if old not in text:
              raise SystemExit('Old auth rate-limit marker missing')
          p.write_text(text.replace(old, 'MAX_CHALLENGES_PER_ID = 6'), encoding='utf-8')
          PY

      - name: Static and security checks
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/app-core-worker/src/index-v4.js
          node --check cloudflare/app-core-worker/src/android-auth-user-store.js
          node scripts/check-android-secure-auth.mjs
          node scripts/check-android-ban-enforcement.mjs
          node scripts/check-support-center.mjs
          grep -q 'private val authRequestClient' android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt
          grep -q 'postRoomViaCore' android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt
          grep -q "url.pathname === '/android/room-relay'" cloudflare/app-core-worker/src/index-v4.js
          grep -q 'MAX_CHALLENGES_PER_ID = 6' cloudflare/app-core-worker/src/android-auth-user-store.js
          grep -q "versionName '2.7.3-native'" android-app/app/build.gradle
          grep -q 'versionCode 23' android-app/app/build.gradle

      - name: Build and lint Android
        run: gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon

      - name: Validate core Worker bundle
        working-directory: cloudflare/app-core-worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/core-network-273

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloudflare/app-core-worker/node_modules
          rm -f cloudflare/app-core-worker/package-lock.json
          # The GitHub App can update source files but cannot push a commit that
          # modifies another workflow file. The release workflow naming change is
          # cosmetic, so restore that file here; the built APK still reads 2.7.3
          # from android-app/app/build.gradle.
          git checkout -- .github/workflows/build-android-apk.yml
          git config user.name "viDaLost"
          git config user.email "vitaledanilov@gmail.com"
          git add \
            .android-release-trigger \
            android-app/app/build.gradle \
            android-app/app/src/main/java/com/vidalost/biblegames/data/CloudRepository.kt \
            cloudflare/app-core-worker/src/index-v4.js \
            cloudflare/app-core-worker/src/android-auth-user-store.js \
            scripts/check-android-secure-auth.mjs \
            scripts/check-android-ban-enforcement.mjs \
            scripts/check-support-center.mjs
          git status --short
          git commit -m "Improve Android auth and room network resilience"
          git push origin HEAD:fix/android-network-resilience-2.7.3
