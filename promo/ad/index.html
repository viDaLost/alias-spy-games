<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Библейские игры — рекламный ролик</title>
<meta name="viewport" content="width=1440">
<!--
  Рекламный ролик приложения «Библейские игры»: 14 секунд петлёй, 7 тактов по 120 BPM.

  Всё, что видно внутри формы-экрана, снято с работающего приложения
  (capture_app.mjs, capture_moses.mjs): скриншоты экранов, отдельные элементы
  тех же экранов (буквы круга, строка набора, кнопки, тосты, уведомления) и
  настоящая запись заплыва «Моисея». Ролик ничего не рисует за приложение —
  только двигает снятое: форму экрана, камеру, палец, появление элементов.

  Любой кадр — чистая функция времени seek(t): ни переходов CSS, ни таймеров,
  ни состояния между кадрами. Пружины — отклик на ступеньку в закрытом виде;
  у значения с несколькими целями пружины складываются, вместе с прошлым
  кругом, поэтому кадр 14,0 с равен кадру 0,0.

  Кадр задаётся константами FRAME и ZONES: чтобы собрать 9:16, достаточно
  поменять размер кадра, полосу подписи и область экрана.
-->
<style>
  @font-face { font-family: 'Onest'; font-weight: 400 900; src: url('fonts/onest-cyrillic.woff2') format('woff2'); unicode-range: U+0400-045F, U+2116; }
  @font-face { font-family: 'Onest'; font-weight: 400 900; src: url('fonts/onest-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
  html, body { margin: 0; background: #0f1020; }
  body { font-family: 'Onest', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #frame { position: relative; width: 1440px; height: 1440px; overflow: hidden; background: #eaf3ff; }
  #backdrop { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  #veil { position: absolute; inset: 0; background: rgba(246, 251, 255, 0.34); }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
  #screen { position: absolute; left: 0; top: 0; overflow: hidden; background: #f6fbff;
    box-shadow: 0 34px 90px rgba(49, 46, 129, 0.24), 0 4px 14px rgba(49, 46, 129, 0.10); }
  .scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .inner { position: absolute; left: 0; top: 0; width: 390px; transform-origin: 0 0; }
  .a { position: absolute; left: 0; top: 0; }
  .inner img, .a img { display: block; }
  .crop { position: absolute; overflow: hidden; }
  .crop > img { position: absolute; left: 0; top: 0; }
  #caption { position: absolute; left: 0; top: 0; width: 100%; height: 0; }
  .cap { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 26px; white-space: nowrap; transform-origin: 50% 50%; }
  .cap img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 8px 22px rgba(49, 46, 129, 0.18); }
  .kicker { font-size: 25px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #4F46E5; margin-bottom: 4px; }
  .title { font-size: 62px; font-weight: 800; letter-spacing: -0.03em; color: #312E81; line-height: 1.02; }
  .final { position: absolute; left: 0; top: 0; white-space: nowrap; transform-origin: 50% 50%; text-align: center; }
  #cta { display: flex; align-items: center; justify-content: center; border-radius: 34px; color: #fff; font-size: 46px; font-weight: 800; letter-spacing: -0.01em;
    background: linear-gradient(135deg, #4f46e5, #0ea5e9); box-shadow: 0 18px 40px rgba(79, 70, 229, 0.30); }
  #finger { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  #finger .dot { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%; box-sizing: border-box;
    border: 4px solid #312E81; background: rgba(255, 255, 255, 0.82); box-shadow: 0 6px 18px rgba(49, 46, 129, 0.28); }
  #finger .ring { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%; box-sizing: border-box; border: 4px solid #4F46E5; }
  #hud { position: fixed; left: 0; bottom: 0; width: 1440px; padding: 10px 16px; box-sizing: border-box; display: flex; gap: 12px; align-items: center; color: #fff; font: 14px system-ui; background: #0f1020; }
  #hud input { flex: 1; }
  .render #hud { display: none; }
</style>
</head>
<body>
<div id="frame">
  <img id="backdrop" src="shots/backdrop.webp" alt="">
  <div id="veil"></div>
  <div id="stage">
    <div id="screen"></div>
    <div id="finals"></div>
  </div>
  <div id="caption"></div>
  <div id="finger"><div class="ring"></div><div class="dot"></div></div>
</div>
<div id="hud"><button id="play">▶</button><input id="scrub" type="range" min="0" max="14" step="0.001" value="0"><span id="clock">0.000</span></div>
<script src="shots/layout.js"></script>
<script src="shots/moses.js"></script>
<script>
'use strict';

// ——————————————————————————————————————————————— кадр и зоны

const FRAME = { w: 1440, h: 1440 };
const ZONES = {
  caption: { cx: 720, cy: 118 },          // полоса подписи
  screen: { cx: 720, cy: 818, h: 1170 },  // где стоит форма-экран
};
const C = { x: FRAME.w / 2, y: FRAME.h / 2 };

// ——————————————————————————————————————————————— время и сетка

const LOOP = 14;
let GRID = Array.from({ length: 29 }, (_, i) => i * 0.5);
function B(b) {
  const k = Math.floor(b / 28);
  const r = b - 28 * k;
  const i = Math.min(27, Math.floor(r));
  return GRID[i] + (r - i) * (GRID[i + 1] - GRID[i]) + k * LOOP;
}

// ——————————————————————————————————————————————— пружины

const SPR = {
  ui: [19, 0.86], soft: [12, 0.9], snap: [30, 0.86], morph: [15, 0.9], cam: [10, 0.96],
  cur: [13, 1], hop: [30, 1], drag: [9, 1], press: [42, 0.84], fade: [30, 1], pop: [22, 0.8], fall: [26, 0.78], slow: [7, 1],
};
function S(dt, name = 'ui') {
  if (dt <= 0) return 0;
  const [w, z] = SPR[name];
  if (z >= 1) return 1 - (1 + w * dt) * Math.exp(-w * dt);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
/** Критически задемпфированная пружина из (x0, v0) к цели. */
function springFrom(x0, v0, target, dt, w) {
  if (dt <= 0) return x0;
  const a = x0 - target;
  return target + (a + (v0 + w * a) * dt) * Math.exp(-w * dt);
}

/*
  Дорожка: начальное значение и цели на долях. Значение — сумма пружин по одной
  на смену цели, этого круга и прошлого. Последняя цель обязана равняться
  начальной — иначе петля не замкнётся.
*/
const TRACKS = [];
function track(v0, keys, name) {
  const ev = [];
  let prev = v0;
  for (const [b, v, sp] of keys) { ev.push([b, v - prev, sp || 'ui']); prev = v; }
  if (Math.abs(prev - v0) > 1e-6) throw new Error(`дорожка «${name}» не замкнута: ${v0} → ${prev}`);
  const f = (t) => {
    let v = v0;
    for (let k = -1; k <= 0; k += 1) for (const [b, d, sp] of ev) v += d * S(t - B(b) - k * LOOP, sp);
    return v;
  };
  TRACKS.push(name);
  return f;
}
/** Точка — две дорожки. keys: [доля, {x, y}, пружина]. */
function track2(p0, keys, name) {
  const fx = track(p0.x, keys.map(([b, p, sp]) => [b, p.x, sp]), `${name}.x`);
  const fy = track(p0.y, keys.map(([b, p, sp]) => [b, p.y, sp]), `${name}.y`);
  return (t) => ({ x: fx(t), y: fy(t) });
}
/** Видимость слоя: вход и выход — каждый со своим временем. */
function vis(t, bin, bout, sin = 'fade', sout = 'fade') {
  let best = 0;
  for (let k = -1; k <= 1; k += 1) {
    const tt = t + k * LOOP;
    best = Math.max(best, clamp(S(tt - B(bin), sin) - S(tt - B(bout), sout), 0, 1));
  }
  return best;
}
/** Время t, приведённое к кругу, в котором доля b ещё впереди или только что прошла. */
function near(t, b) { let d = t - B(b); d -= LOOP * Math.round(d / LOOP); return d; }
/** Импульс нажатия: 0 → 1 → 0 вокруг доли b (опускание и отпускание). */
function press(t, b, hold = 0.09) {
  const d = near(t, b) + 0.02;
  return clamp(S(d, 'press') - S(d - hold, 'press'), 0, 1.2);
}

// ——————————————————————————————————————————————— мелочи

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const px = (v) => `${v.toFixed(2)}px`;
function el(tag, cls, parent) { const n = document.createElement(tag); if (cls) n.className = cls; parent.appendChild(n); return n; }
function img(src, parent, cls = 'a') { const n = el('img', cls, parent); n.src = src; n.alt = ''; n.decoding = 'sync'; return n; }
function place(node, x, y, w, h) {
  node.style.transform = `translate(${px(x)}, ${px(y)})`;
  if (w != null) node.style.width = px(w);
  if (h != null) node.style.height = px(h);
}
/** Видимость узла с лёгким размытием на входе и выходе. */
function fade(node, p, blur = 8) {
  if (p < 0.003) { node.style.visibility = 'hidden'; return false; }
  node.style.visibility = 'visible';
  node.style.opacity = p > 0.997 ? '1' : p.toFixed(4);
  node.style.filter = p > 0.995 ? 'none' : `blur(${((1 - p) * blur).toFixed(2)}px)`;
  return true;
}

const L = window.LAYOUT;
const M = window.MOSES;
const WEB = '../../web/';
const SOUNDS = [];
const sound = (beat, kind) => SOUNDS.push({ beat, kind });

// ——————————————————————————————————————————————— сцены: вид на экран приложения

/*
  Каждая сцена — окно (view) в экран приложения в CSS-пикселях телефона 390×844
  и масштаб k. Отсюда — прямоугольник формы-экрана в кадре. Точка экрана
  приложения p переводится в кадр функцией at(scene, p).
*/
/*
  Состояния сцены: окно в экран и масштаб. На главных действиях окно сужается
  к нужной части экрана и увеличивает её — это и есть «приближение»: форма
  меняет пропорции вслед за окном и остаётся под подписью.
*/
const V = (x, y, w, h, k) => ({ view: { x, y, w, h }, k });
const SC = {
  menu:     { r: 58, states: [[-1, V(0, 0, 390, 780, 1.5)]] },
  words:    { r: 58, states: [[1.12, V(0, 58, 390, 786, 1.49)], [2.45, V(0, 462, 390, 382, 2.05)], [6.05, V(0, 62, 390, 360, 2.05)]] },
  lobby:    { r: 52, states: [[7.92, V(0, 62, 390, 820, 1.42)]] },
  game:     { r: 54, states: [[11.92, V(0, 0, 390, 844, 1.38)], [12.5, V(0, 296, 390, 548, 1.9)], [15.62, V(0, 0, 390, 844, 1.38)]] },
  treasure: { r: 50, states: [[15.92, V(0, 104, 390, 508, 1.62)], [16.5, V(0, 160, 390, 452, 1.95)]] },
  moses:    { r: 54, states: [[19.92, V(0, 0, 390, 844, 1.37)]] },
};
const EXIT = { menu: 1.6, words: 8.3, lobby: 12.3, game: 16.3, treasure: 20.3, moses: 24.3 };
for (const [key, s] of Object.entries(SC)) {
  for (const [, st] of s.states) { st.w = st.view.w * st.k; st.h = st.view.h * st.k; st.cx = ZONES.screen.cx; st.cy = ZONES.screen.cy; st.r = s.r; }
  Object.assign(s, s.states[0][1]);
  // дорожки окна: центр, размер, масштаб — к каждому состоянию и обратно к первому после выхода
  const keys = (f) => [...s.states.slice(1).map(([b, st]) => [b, f(st), 'morph']), ...(s.states.length > 1 ? [[EXIT[key], f(s.states[0][1]), 'morph']] : [])];
  const d = s.states[0][1];
  s.tk = track(d.k, keys((st) => st.k), `${key}.k`);
  s.tx = track(d.view.x + d.view.w / 2, keys((st) => st.view.x + st.view.w / 2), `${key}.vx`);
  s.ty = track(d.view.y + d.view.h / 2, keys((st) => st.view.y + st.view.h / 2), `${key}.vy`);
  s.tw = track(d.view.w, keys((st) => st.view.w), `${key}.vw`);
  s.th = track(d.view.h, keys((st) => st.view.h), `${key}.vh`);
}
const ICON_BOX = { cx: 720, cy: 500, w: 316, h: 316, r: 72 };
function stateAt(s, b) { let st = s.states[0][1]; for (const [sb, x] of s.states) if (sb <= b + 1e-9) st = x; return st; }
/** Точка экрана приложения p → точка кадра, в состоянии сцены на доле b. */
function at(s, p, b) {
  const st = b == null ? s.states[0][1] : stateAt(s, b);
  const v = st.view;
  return { x: st.cx + (p.x - (v.x + v.w / 2)) * st.k, y: st.cy + (p.y - (v.y + v.h / 2)) * st.k };
}
const mid = (r) => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });

// ——————————————————————————————————————————————— узлы

const screen = document.getElementById('screen');
const stage = document.getElementById('stage');
const finger = document.getElementById('finger');
const fingerDot = finger.querySelector('.dot');
const fingerRing = finger.querySelector('.ring');
const caption = document.getElementById('caption');
const finals = document.getElementById('finals');
const IMAGES = [];
function shot(name, parent, scale = 3) { const n = img(`shots/${name}.webp`, parent); IMAGES.push([n, scale]); return n; }

const N = {};
const LAYER = {}; const INNER = {};
for (const key of Object.keys(SC)) {
  LAYER[key] = el('div', 'scene', screen);
  INNER[key] = el('div', 'inner', LAYER[key]);
}

// 1. Меню: фон — закреплённая сцена приложения, поверх — лента меню, которая прокручивается.
N.menuBg = shot('menu-bg', INNER.menu, 2);
N.menuContent = shot('menu-content', INNER.menu, 2);
N.menuCard = shot('menu-card-words', screen, 2);   // карточка, раскрывающаяся в игру

// 2. «Библейские слова»
const W = L.words;
N.wordsBase = shot('words-noletters', INNER.words);
const ORDER = W.path;                               // И О Р Д А Н — индексы букв круга
const IORDAN = 'ИОРДАН';
const iordan = (() => {
  // слово стоит в одну линию: по столбцу или по строке — ищем шесть клеток подряд, дающих ИОРДАН
  const cells = W.final;
  for (const axis of ['x', 'y']) {
    const other = axis === 'x' ? 'y' : 'x';
    const lines = new Map();
    for (const c of cells) { const key = Math.round(c[axis]); (lines.get(key) || lines.set(key, []).get(key)).push(c); }
    for (const line of lines.values()) {
      line.sort((a, b) => a[other] - b[other]);
      for (let i = 0; i + 6 <= line.length; i += 1) if (line.slice(i, i + 6).map((c) => c.letter).join('') === IORDAN) return line.slice(i, i + 6);
    }
  }
  throw new Error('ИОРДАН не найден в кроссворде');
})();
const newCells = iordan.map((c, i) => ({ ...c, i, fresh: !W.base.some((b) => b.solved && Math.abs(b.x - c.x) < 1 && Math.abs(b.y - c.y) < 1) })).filter((c) => c.fresh);
// Открытая клетка — вырезка из того же скриншота, где эта буква уже открыта в другом слове.
N.cells = newCells.map((c) => {
  const src = W.base.find((b) => b.solved && b.letter === c.letter);
  if (!src) throw new Error(`нет открытой клетки с буквой ${c.letter}`);
  const pad = 2;
  const box = el('div', 'crop', INNER.words);
  box.style.left = px(c.x - pad); box.style.top = px(c.y - pad); box.style.width = px(c.w + pad * 2); box.style.height = px(c.h + pad * 2);
  const im = shot('words-base', box);
  im.style.transform = `translate(${px(-(src.x - pad))}, ${px(-(src.y - pad))})`;
  box.style.transformOrigin = '50% 50%';
  return { box, c };
});
N.line = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
N.line.setAttribute('class', 'a'); N.line.setAttribute('width', 390); N.line.setAttribute('height', 844); N.line.style.overflow = 'visible';
INNER.words.appendChild(N.line);
N.linePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
Object.entries({ fill: 'none', stroke: 'rgba(219,234,254,0.65)', 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }).forEach(([k, v]) => N.linePath.setAttribute(k, v));
N.line.appendChild(N.linePath);
N.letters = W.wheel.map((l) => ({ l, off: shot(`words-letter-${l.idx}`, INNER.words), on: shot(`words-letter-${l.idx}-on`, INNER.words) }));
N.previews = W.drag.map((d) => shot(`words-preview-${d.i}`, INNER.words));
N.stars = shot('words-stars-final', INNER.words);
N.message = shot('words-message', INNER.words);

// 3. «Квартет»: лобби
const Q = L.quartet;
N.lobby = [1, 2, 3, 4].map((i) => shot(`quartet-lobby-${i}`, INNER.lobby));
N.copyBtn = shot('quartet-copy-btn', INNER.lobby);
N.toast = shot('quartet-toast', INNER.lobby);
N.startBtn = shot('quartet-start-btn', INNER.lobby);

// 4. «Квартет»: партия
N.game = ['idle', 'target', 'card', 'success'].map((s) => shot(`quartet-game-${s}`, INNER.game));
N.flip = el('div', 'crop', INNER.game);           // карта Андрея: рубашка → рисунок
N.flipBack = shot('quartet-game-card', N.flip);
N.flipArt = img(`${WEB}assets/quartet/cards/apostles_andrew.webp`, N.flip);
N.noticeStart = shot('quartet-notice-start', INNER.game);
N.notice = shot('quartet-notice', INNER.game);

// 5. «Библейские сокровища»
const T = L.treasures;
N.trBase = shot('treasures-empty', INNER.treasure);
N.hud = ['b', 'c'].map((s) => shot(`treasures-hud-${s}`, INNER.treasure));
N.board = el('div', 'crop', INNER.treasure);
N.cascade = el('div', 'a', INNER.treasure);   // «КАСКАД ×2» — стилями игры (.bmt-fx-float)
N.cascade.textContent = 'КАСКАД ×2';
Object.assign(N.cascade.style, { ...T.floatStyle, width: '90px', textAlign: 'center', whiteSpace: 'nowrap' });

// 6. «Моисей»
N.moses = img('build/moses/f0000.jpg', INNER.moses);
N.moses.style.width = '390px';

// 7. Финал
N.icon = img(`${WEB}assets/pwa/icon-512.png`, screen);
N.icon.style.objectFit = 'cover';   // иконка не растягивается, пока форма перестраивается
N.fTitle = el('div', 'final', finals); N.fTitle.innerHTML = '<div style="font-size:112px;font-weight:900;letter-spacing:-0.04em;color:#312E81;line-height:1">Библейские игры</div>';
N.fSub = el('div', 'final', finals); N.fSub.innerHTML = '<div style="font-size:40px;font-weight:600;color:#3730A3;opacity:.86">Мини-игры для компании, друзей и семьи</div>';
N.fIcons = ['words', 'quartet', 'biblical-treasures-v38', 'moses-nile'].map((n) => {
  const box = el('div', 'final', finals);
  const im = img(`${WEB}assets/icons/${n}.webp`, box, '');
  im.style.cssText = 'width:128px;height:128px;border-radius:30px;box-shadow:0 10px 26px rgba(49,46,129,.20)';
  return box;
});
N.cta = el('div', 'final', finals); N.cta.innerHTML = '<div id="cta" style="width:620px;height:124px">Играть в Telegram</div>';

// Подписи сцен: надзаголовок как в шапке меню приложения и одна строка крупно.
const CAPS = [
  { from: -0.98, to: 1.15, icon: null, kicker: 'Библейские игры', title: 'Выберите игру' },
  { from: 1.3, to: 7.9, icon: 'words', kicker: 'Библейские слова', title: 'Собери слова из букв' },
  { from: 8.05, to: 11.9, icon: 'quartet', kicker: 'Квартет · онлайн-игра', title: 'Играйте по сети' },
  { from: 12.05, to: 15.9, icon: 'quartet', kicker: 'Квартет', title: 'Собери четыре карты' },
  { from: 16.05, to: 19.9, icon: 'biblical-treasures-v38', kicker: 'Библейские сокровища', title: 'Матч-3 с Путём света' },
  { from: 20.05, to: 23.85, icon: 'moses-nile', kicker: 'Моисей: Путь по Нилу', title: 'Ведите корзинку по течению' },
];
for (const c of CAPS) {
  c.node = el('div', 'cap', caption);

  Такт 3 · «Квартет», лобби

  Такт 5 · «Библейские сокровища»
  16    поле «Первого света», фишки падают рядами

*/

  z: track(1, [[0.9, 1.04, 'cam'], [1.25, 1, 'cam'], [8.6, 1.07, 'cam'], [9.6, 1, 'cam'], [20.6, 1.05, 'cam'], [23.55, 1, 'cam']], 'cam.z'),

};
const CAPTION_BOTTOM = 212;
function camera(t) {
  const z = cam.z(t);
  const m = cam.m(t);
  // Верх формы при приближении не заходит под подпись (мягкий минимум — без излома).
  const top = shape.cy(t) - shape.h(t) / 2;
  const limit = top + (C.y - CAPTION_BOTTOM) / z;
  const soft = 16;
  const h = Math.max(soft - Math.abs(m.y - limit), 0) / soft;
  m.y = Math.min(m.y, limit) - h * h * soft / 4;
  return { z, m };
}
const toScreen = (c, p) => ({ x: C.x + c.z * (p.x - c.m.x), y: C.y + c.z * (p.y - c.m.y) });

const FLICK = { from: P('menu', { x: 300, y: 690 }), to: P('menu', { x: 300, y: 300 }), b0: 0, b1: 0.3 };
/*
  Лента меню идёт за пальцем, пока он прижат (прокрутка = путь пальца), а после
  отпускания докатывается сама — пружиной, которая стартует со скоростью пальца.
*/
function menuScroll(t) {
  const d = near(t, FLICK.b0);
  const dur = B(FLICK.b1) - B(FLICK.b0);
  const k = SC.menu.k;
  if (d < 0) return 0;
  const t0 = t - d;
  const y0 = fingerP(t0).y;                     // где палец коснулся ленты
  const byFinger = (tt) => (y0 - fingerP(tt).y) / k;
  if (d <= dur) return byFinger(t0 + d);
  const x0 = byFinger(t0 + dur);
  const v0 = (byFinger(t0 + dur) - byFinger(t0 + dur - 0.004)) / 0.004;
  return springFrom(x0, v0, MENU_SCROLL, d - dur, 16);
}

const fingerKeys = [

  [1.6, P('words', { x: 250, y: 700 }), 'cur'], [2.3, letterAt(ORDER[0]), 'cur'],

];

// Нажатия: [доля, длительность удержания в секундах]
const TAPS = [[1, 0.1], [9, 0.1], [11, 0.1], [13, 0.1], [14, 0.1], [15, 0.1], [21, 0.1], [22, 0.1], [23, 0.1], [26, 0.12]];
const HOLDS = [[0, B(FLICK.b1) - B(FLICK.b0)], [3, B(6) - B(3)], [17, B(18) - B(17)]];
function fingerPress(t) {
  let p = 0;
  for (const [b, h] of [...TAPS, ...HOLDS]) p = Math.max(p, press(t, b, h));
  return p;
}
function ripple(t) {
  let best = null;
  for (const [b] of [...TAPS, ...HOLDS]) { const d = near(t, b); if (d >= 0 && d < 0.5 && (!best || d < best)) best = d; }
  return best;
}

// ——— «Библейские сокровища»: поле ———
/*
  Раскладка на поле уровня 1 — из тех же фишек, что у игры, и по её правилам:
  одна «Библия» переходит вправо и собирает ряд из трёх; после падения фишек
  ряд выше собирается сам — каскад ×2. Проверяется ниже: в исходной раскладке
  нет готовых рядов, после каждого падения — ровно один ряд.
*/
const PIECE = { B: 'bible', C: 'crown', F: 'fish', D: 'dove', A: 'ark', L: 'candle' };
const START = ['FLADFADA', 'AFDCDLCF', 'DCLABBFC', 'FACDLCBD', 'CDBFBBAL'];
const NEW1 = 'LCF';      // новые фишки сверху после первого сбора, столбцы 3–5
const NEW2 = 'DCL';      // после каскада, столбцы 4–6
const TB = { press: 17, release: 18, clear1: 18.28, fall1: 18.56, clear2: 19, fall2: 19.3, rowIn: (r) => 16.02 + r * 0.14 };
function simulate() {
  const g = START.map((r) => r.split(''));
  const triples = (b) => {
    const out = [];
    for (let r = 0; r < 5; r += 1) for (let c = 0; c < 8; c += 1) {
      if (c <= 5 && b[r][c] === b[r][c + 1] && b[r][c] === b[r][c + 2]) out.push(`r${r}c${c}`);
      if (r <= 2 && b[r][c] === b[r + 1][c] && b[r][c] === b[r + 2][c]) out.push(`v${r}c${c}`);
    }
    return out;
  };
  if (triples(g).length) throw new Error(`в исходной раскладке уже есть ряд: ${triples(g)}`);
  [g[4][2], g[4][3]] = [g[4][3], g[4][2]];
  if (triples(g).join() !== 'r4c3') throw new Error(`после обмена не тот ряд: ${triples(g)}`);
  const fall = (cols, row, fresh) => cols.forEach((c, i) => { for (let r = row; r > 0; r -= 1) g[r][c] = g[r - 1][c]; g[0][c] = fresh[i]; });
  fall([3, 4, 5], 4, NEW1);
  if (triples(g).join() !== 'r3c4') throw new Error(`каскад не собрался: ${triples(g)}`);
  fall([4, 5, 6], 3, NEW2);
  if (triples(g).length) throw new Error(`после каскада лишний ряд: ${triples(g)}`);
}
simulate();
/*
  Фишки как объекты: у каждой — клетка до и после каждого события. Положение —
  сумма пружин: обмен и падения сдвигают её на целое число клеток.
*/
const pieces = [];
for (let r = 0; r < 5; r += 1) for (let c = 0; c < 8; c += 1) pieces.push({ type: START[r][c], r, c, moves: [], clear: null });
const find = (r, c, list = pieces) => list.find((p) => p.r === r && p.c === c && !p.gone);
{
  const a = find(4, 2); const b = find(4, 3);
  a.moves.push([TB.release, 0, 1, 'snap']); b.moves.push([TB.release, 0, -1, 'snap']);
  a.c = 3; b.c = 2; a.dragged = true;
  const clear = (cells, beat) => cells.forEach(([r, c]) => { const p = find(r, c); p.clear = beat; p.gone = true; });
  const drop = (cols, row, fresh, beat) => cols.forEach((c, i) => {
    for (let r = row - 1; r >= 0; r -= 1) { const p = find(r, c); p.moves.push([beat + (row - r) * 0.03, 1, 0, 'fall']); p.r = r + 1; }
    pieces.push({ type: fresh[i], r: 0, c, moves: [[beat, 1.6, 0, 'fall']], clear: null, fresh: beat });
  });
  clear([[4, 3], [4, 4], [4, 5]], TB.clear1);
  drop([3, 4, 5], 4, NEW1, TB.fall1);
  clear([[3, 4], [3, 5], [3, 6]], TB.clear2);
  drop([4, 5, 6], 3, NEW2, TB.fall2);
}
const PITCH = { x: tile(0, 1).x - tile(0, 0).x, y: tile(1, 0).y - tile(0, 0).y };
const PIECE_BOX = { dx: tile(0, 0).piece.x - tile(0, 0).x, dy: tile(0, 0).piece.y - tile(0, 0).y, w: tile(0, 0).piece.w, h: tile(0, 0).piece.h };
for (const p of pieces) {
  p.node = img(`${WEB}assets/biblical-match-three/icons-v17/${PIECE[p.type]}.webp`, N.board);
  p.node.style.width = px(PIECE_BOX.w); p.node.style.height = px(PIECE_BOX.h); p.node.style.objectFit = 'contain';
  p.node.style.filter = 'drop-shadow(0 3px 3px rgba(38,54,98,.16))';   // как у фишек в игре
  p.node.style.transformOrigin = '50% 55%';
}
// исходная клетка каждой фишки (до всех ходов)
for (const p of pieces) {
  const dr = p.moves.reduce((s, m) => s + m[1], 0);
  const dc = p.moves.reduce((s, m) => s + m[2], 0);
  p.r0 = p.r - dr; p.c0 = p.c - dc;
}
sound(TB.rowIn(0), 'tick'); sound(TB.rowIn(2), 'tick'); sound(TB.rowIn(4), 'tick');

// ——————————————————————————————————————————————— кадр

function layoutScene(key, t, box) {
  const s = SC[key];
  const layer = LAYER[key];
  const inner = INNER[key];
  const [bin, bout] = WIN[key];
  const p = vis(t, bin, bout);
  if (!fade(layer, p, 12)) return false;
  // Содержимое масштабируется вместе с формой: во время перестройки кажется,
  // что сам экран приложения меняет пропорции.
  const sk = s.tk(t);
  const f = Math.sqrt((box.w / (s.tw(t) * sk)) * (box.h / (s.th(t) * sk)));
  const k = sk * f * (0.97 + 0.03 * p);
  const x = box.w / 2 - s.tx(t) * k;
  const y = box.h / 2 - s.ty(t) * k;
  inner.style.transform = `translate(${px(x)}, ${px(y)}) scale(${k.toFixed(5)})`;
  return true;
}

function sprite(node, rect, pad) {
  const x = Math.max(0, rect.x - pad); const y = Math.max(0, rect.y - pad);
  node.style.left = px(x); node.style.top = px(y);
  return { x, y };
}

let frameT = 0;
function render(t) {
  frameT = t;
  const c = camera(t);
  stage.style.transform = `translate(${px(C.x - c.z * c.m.x)}, ${px(C.y - c.z * c.m.y)}) scale(${c.z.toFixed(5)})`;

  // форма-экран
  const box = { cx: shape.cx(t), cy: shape.cy(t), w: shape.w(t), h: shape.h(t), r: shape.r(t) };
  place(screen, box.cx - box.w / 2, box.cy - box.h / 2, box.w, box.h);
  screen.style.borderRadius = px(box.r);

  // ——— меню ———
  if (layoutScene('menu', t, box)) {
    N.menuBg.style.top = '0px';
    N.menuContent.style.transform = `translate(0px, ${px(-menuScroll(t))})`;
  }
  // карточка «Библейские слова»: нажатие и раскрытие в экран игры
  {
    const dOpen = near(t, 1.12);
    const pOpen = S(dOpen, 'morph');
    const pIn = vis(t, 0.95, 1.45, 'fade', 'fade');
    const pr = press(t, 1, 0.1);
    if (fade(N.menuCard, pIn, 6)) {
      const f = Math.sqrt((box.w / SC.menu.w) * (box.h / SC.menu.h));
      const k = SC.menu.k * f;
      const card = { x: menuCard.x, y: menuCard.y - menuScroll(t), w: menuCard.w, h: menuCard.h };
      const cx0 = box.w / 2 + (card.x + card.w / 2 - 195) * k;
      const cy0 = box.h / 2 + (card.y + card.h / 2 - 390) * k;
      const cw0 = card.w * k, ch0 = card.h * k;
      const cx = lerp(cx0, box.w / 2, pOpen), cy = lerp(cy0, box.h / 2, pOpen);
      // карточка растёт равномерно и растворяется в экране игры
      const sx = lerp(1, 1.7, pOpen), sy = sx;
      const pad = 24 * k;
      N.menuCard.style.width = px(cw0 + pad * 2); N.menuCard.style.height = px(ch0 + pad * 2);
      N.menuCard.style.transform = `translate(${px(cx - cw0 / 2 - pad)}, ${px(cy - ch0 / 2 - pad)}) scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
      N.menuCard.style.transformOrigin = '50% 50%';
    }
  }

  // ——— «Библейские слова» ———
  if (layoutScene('words', t, box)) {
    N.letters.forEach(({ l, off, on }, i) => {
      const shown = vis(t, LETTER_IN[i], 8.4, 'pop', 'fade');
      const slot = ORDER.indexOf(l.idx);
      const active = slot >= 0 && near(t, LETTER_BEATS[slot]) >= 0 && near(t, 6) < 0 && near(t, 6) > -4;
      sprite(off, W[`letter${l.idx}`], 30); sprite(on, W[`letter${l.idx}`], 30);
      const s = (0.4 + 0.6 * Math.min(1, shown)) * (1 + 0.06 * press(t, LETTER_BEATS[slot] ?? -9, 0.05));
      for (const n of [off, on]) { n.style.transform = `scale(${s.toFixed(4)})`; n.style.transformOrigin = '50% 50%'; }
      fade(off, active ? 0 : shown, 6);
      fade(on, active ? shown : 0, 0);
    });
    // строка набора: растёт с каждой буквой, пока палец прижат
    const typed = LETTER_BEATS.filter((b) => near(t, b) >= 0 && near(t, 6) < 0 && near(t, 6) > -4).length;
    N.previews.forEach((n, i) => { sprite(n, W.drag[i].previewBox, 6); fade(n, typed === i + 1 ? 1 : 0, 0); });
    // линия от букв к пальцу — как рисует сама игра (цвет и толщина из её кода)
    if (typed > 0) {
      const pts = ORDER.slice(0, typed).map((idx) => W.wheel.find((l) => l.idx === idx));
      const fs = toContent('words', fingerP(t));
      const d = [...pts, fs].map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
      N.linePath.setAttribute('d', d); N.line.style.visibility = 'visible';
    } else N.line.style.visibility = 'hidden';
    // клетки ИОРДАНа
    N.cells.forEach(({ box: cell }, i) => {
      const d = near(t, CELL_BEAT(i));
      const p = d >= 0 && near(t, 8.4) < 0 ? S(d, 'pop') : 0;   // держатся, пока сцена гаснет
      if (fade(cell, Math.min(1, p * 1.6), 0)) cell.style.transform = `scale(${(0.55 + 0.45 * p).toFixed(4)})`;
    });
    // «Уровень пройден! +10⭐» и звёзды 30
    const pm = vis(t, 7, 8.4, 'pop', 'fade');
    sprite(N.message, W.message, 20);
    if (fade(N.message, Math.min(1, pm), 6)) { N.message.style.transform = `scale(${(0.8 + 0.2 * pm).toFixed(4)})`; N.message.style.transformOrigin = '50% 50%'; }
    sprite(N.stars, W.stars, 14);
    const ps = vis(t, 7.05, 8.4, 'pop', 'fade');
    if (fade(N.stars, Math.min(1, ps * 1.5), 0)) { N.stars.style.transform = `scale(${(1 + 0.12 * Math.sin(Math.PI * clamp(near(t, 7.05) / 0.3, 0, 1))).toFixed(4)})`; N.stars.style.transformOrigin = '50% 50%'; }
  }

  // ——— «Квартет»: лобби ———
  if (layoutScene('lobby', t, box)) {
    const joined = [10, 10.25, 10.5].filter((b) => near(t, b) >= 0 && near(t, 12.4) < 0).length;
    N.lobby.forEach((n, i) => fade(n, i === joined ? 1 : 0, 0));
    const pc = press(t, 9, 0.1);
    sprite(N.copyBtn, Q.lobby.copy, 16);
    N.copyBtn.style.transform = `scale(${(1 - 0.04 * pc).toFixed(4)})`; N.copyBtn.style.transformOrigin = '50% 50%';
    fade(N.copyBtn, pc > 0.01 ? 1 : 0, 0);
    const pt = vis(t, 9.05, 9.95, 'pop', 'fade');
    sprite(N.toast, Q.toast, 20);
    if (fade(N.toast, Math.min(1, pt), 6)) { N.toast.style.transform = `translate(0px, ${px((1 - Math.min(1, pt)) * 14)}) scale(${(0.9 + 0.1 * pt).toFixed(4)})`; N.toast.style.transformOrigin = '50% 50%'; }
    const ps = press(t, 11, 0.1);
    sprite(N.startBtn, Q.lobby.start, 16);
    N.startBtn.style.transform = `scale(${(1 - 0.04 * ps).toFixed(4)})`; N.startBtn.style.transformOrigin = '50% 50%';
    fade(N.startBtn, ps > 0.01 ? 1 : 0, 0);
  }

  // ——— «Квартет»: партия ———
  if (layoutScene('game', t, box)) {
    // состояния экрана сменяются, как в игре, — без анимации; здесь только короткий переход
    const GS = [11.9, 13.02, 14.02, 15.62, 16.4];
    const base = N.game.map((n, i) => vis(t, GS[i], GS[i + 1] + 0.3));   // старое держится под новым, пока то проявляется
    N.game.forEach((n, i) => fade(n, i === 0 ? 1 : base[i], 6));
    // уведомление «Партия началась» на первом ходу
    sprite(N.noticeStart, Q.game.noticeStart, 24);
    const pn = vis(t, 12.1, 12.9, 'pop', 'fade');
    if (fade(N.noticeStart, Math.min(1, pn), 6)) { N.noticeStart.style.transform = `translate(0px, ${px((1 - Math.min(1, pn)) * 16)})`; }
    // карта Андрея переворачивается: рубашка → рисунок
    const art = Q.game.andrewArt;
    const df = near(t, 15.02);
    const flipOn = df >= 0 && near(t, 16.2) < 0;
    if (fade(N.flip, flipOn ? base[2] * (1 - base[3]) : 0, 6)) {
      place(N.flip, art.x, art.y, art.w, art.h);
      N.flip.style.borderRadius = '12px';
      const u = clamp(df / (B(15.4) - B(15.02)), 0, 1);
      const sx = Math.abs(Math.cos(Math.PI * u));
      N.flipBack.style.transform = `translate(${px(-art.x)}, ${px(-art.y)})`;
      N.flipBack.style.visibility = u < 0.5 ? 'visible' : 'hidden';
      N.flipArt.style.width = px(art.w); N.flipArt.style.height = px(art.h); N.flipArt.style.objectFit = 'cover';
      N.flipArt.style.visibility = u >= 0.5 ? 'visible' : 'hidden';
      N.flip.style.transform = `translate(${px(art.x)}, ${px(art.y)}) scale(${Math.max(0.02, sx).toFixed(4)}, 1)`;
      N.flip.style.transformOrigin = '50% 50%';
    }
    // «Успешный запрос»
    sprite(N.notice, Q.game.notice, 24);
    const pa = vis(t, 15.42, 16, 'pop', 'fade');
    if (fade(N.notice, Math.min(1, pa), 6)) { N.notice.style.transform = `translate(0px, ${px((1 - Math.min(1, pa)) * 16)})`; }
  }

  // ——— «Библейские сокровища» ———
  if (layoutScene('treasure', t, box)) {
    const hudY = T.hud.y;
    N.hud.forEach((n, i) => { n.style.left = '0px'; n.style.top = px(hudY); fade(n, vis(t, i === 0 ? TB.clear1 : TB.clear2, i === 0 ? TB.clear2 + 0.3 : 20.4, 'fade', 'fade'), 0); });
    place(N.board, T.board.x, T.board.y, T.board.w, T.board.h);
    N.board.style.transform = `translate(${px(T.board.x)}, ${px(T.board.y)})`;
    const f = fingerP(t);
    const fc = toContent('treasure', f);
    for (const p of pieces) {
      let r = p.r0, cc = p.c0;
      for (const [b, dr, dc, sp] of p.moves) { const s = S(near(t, b), sp); r += dr * s; cc += dc * s; }
      let x = tile(0, 0).x + cc * PITCH.x + PIECE_BOX.dx - T.board.x;
      let y = tile(0, 0).y + r * PITCH.y + PIECE_BOX.dy - T.board.y;
      // ряды падают на поле при входе сцены (новые фишки сверху — нет, они падают позже)
      if (p.fresh == null) y -= (1 - S(near(t, TB.rowIn(p.r0)), 'fall')) * PITCH.y * 5.5;
      // фишку под пальцем ведёт палец — с сопротивлением, как в «свайпе» игры
      if (p.dragged) {
        const nudge = (tt) => PITCH.x * 0.34 * Math.tanh((toContent('treasure', fingerP(tt), tt).x - mid(tile(4, 2)).x) / (PITCH.x * 0.6));
        const dh = near(t, TB.press); const dr = near(t, TB.release);
        if (dh >= 0 && dr < 0) x += nudge(t);
        else if (dr >= 0 && dr < 1) x += nudge(t - dr - 0.001) * (1 - S(dr, 'snap'));
      }
      let scale = 1, op = 1;
      if (p.clear != null && near(t, p.clear) >= 0) {
        const d = near(t, p.clear);
        const u = S(d, 'fade');
        scale = (1 + 0.16 * Math.sin(Math.PI * Math.min(1, d / 0.12))) * (1 - u);
        op = 1 - u;
      }
      p.node.style.visibility = op > 0.01 && scale > 0.02 ? 'visible' : 'hidden';
      p.node.style.opacity = op.toFixed(3);
      p.node.style.transform = `translate(${px(x)}, ${px(y)}) scale(${Math.max(0.001, scale).toFixed(4)})`;
    }
    // «КАСКАД ×2» — надпись самой игры над каскадом
    const pk = vis(t, TB.clear2, 19.85, 'pop', 'fade');
    const anchor = mid(tile(3, 5));
    N.cascade.style.left = px(anchor.x - 45); N.cascade.style.top = px(anchor.y - 6);
    if (fade(N.cascade, Math.min(1, pk), 0)) N.cascade.style.transform = `translate(0px, ${px(-26 * S(near(t, TB.clear2), 'slow'))}) scale(${(0.7 + 0.3 * Math.min(1, pk)).toFixed(4)})`;
  }

  // ——— «Моисей» ———
  if (layoutScene('moses', t, box)) {
    let d = t - M.adStart; if (d < -LOOP / 2) d += LOOP;
    const j = clamp(Math.round(d / M.step) + M.frameAtAdStart, 0, M.frames - 1);
    const src = `build/moses/f${String(j).padStart(4, '0')}.jpg`;
    if (!N.moses.src.endsWith(src)) N.moses.src = src;
  }

  // ——— финал: иконка приложения, название, кнопка ———
  {
    const pIcon = vis(t, 23.92, 27.03, 'fade', 'fade');
    if (fade(N.icon, pIcon, 10)) place(N.icon, 0, 0, box.w, box.h);
    const fin = (node, bin, bout, x, y, dy = 18) => {
      const p = vis(t, bin, bout, 'pop', 'fade');
      if (!fade(node, Math.min(1, p), 10)) return;
      node.style.transform = `translate(${px(x)}, ${px(y + (1 - Math.min(1, p)) * dy)}) translate(-50%, -50%) scale(${(0.94 + 0.06 * Math.min(1, p)).toFixed(4)})`;
    };
    fin(N.fTitle, 24.3, 26.95, 720, 764);
    fin(N.fSub, 25, 26.95, 720, 858);
    N.fIcons.forEach((n, i) => fin(n, 25 + i * 0.25, 26.95, 720 + (i - 1.5) * 164, 1028, 26));
    const pc = press(t, 26, 0.12);
    fin(N.cta, 25.5, 26.95, CTA.x, CTA.y);
    N.cta.firstChild.style.transform = `scale(${(1 - 0.05 * pc).toFixed(4)})`;
  }

  // ——— подписи: выход и вход — порознь ———
  for (const cp of CAPS) {
    const p = vis(t, cp.from, cp.to, 'pop', 'fade');
    if (!fade(cp.node, Math.min(1, p), 10)) continue;
    cp.node.style.transform = `translate(${px(ZONES.caption.cx)}, ${px(ZONES.caption.cy + (1 - Math.min(1, p)) * 16)}) translate(-50%, -50%)`;
  }

  // ——— палец: в экранных координатах, постоянного размера ———
  const fp = toScreen(c, fingerP(t));
  const pr = fingerPress(t);
  finger.style.transform = `translate(${px(fp.x)}, ${px(fp.y)})`;
  fingerDot.style.transform = `scale(${(1 - 0.16 * Math.min(1, pr)).toFixed(4)})`;
  fingerDot.style.background = `rgba(${Math.round(lerp(255, 199, pr))}, ${Math.round(lerp(255, 210, pr))}, 255, 0.86)`;
  const rp = ripple(t);
  if (rp != null) {
    const u = S(rp, 'soft');
    fingerRing.style.visibility = 'visible';
    fingerRing.style.opacity = (0.55 * (1 - u) * clamp(rp / 0.05, 0, 1)).toFixed(3);
    fingerRing.style.transform = `scale(${(1 + 0.75 * u).toFixed(4)})`;
  } else fingerRing.style.visibility = 'hidden';
}

// Точка кадра (сцена в координатах сцены) → точка экрана приложения.
function toContent(key, p, t = frameT) {
  const s = SC[key];
  const k = s.tk(t);
  return { x: (p.x - ZONES.screen.cx) / k + s.tx(t), y: (p.y - ZONES.screen.cy) / k + s.ty(t) };
}

// ——————————————————————————————————————————————— вход

window.SOUNDS = SOUNDS;
window.setGrid = (beats, loop) => {
  const t0 = beats[0];
  GRID = [...beats.map((b) => b - t0), loop];
};
async function decodeAll() {
  const all = [...document.images];
  await Promise.all(all.map((n) => (n.complete && n.naturalWidth ? Promise.resolve() : new Promise((r) => { n.onload = r; n.onerror = r; }))));
  for (const [n, scale] of IMAGES) { n.style.width = px(n.naturalWidth / scale); n.style.height = px(n.naturalHeight / scale); }
  await Promise.all(all.map((n) => n.decode().catch(() => {})));
  await document.fonts.ready;
}
window.ready = decodeAll().then(() => { render(0); return true; });
window.seek = (t) => {
  render(((t % LOOP) + LOOP) % LOOP);
  // запись заплыва — единственная картинка, которая меняется от кадра к кадру
  return N.moses.complete ? Promise.resolve() : N.moses.decode().catch(() => {});
};

const params = new URLSearchParams(location.search);
if (params.has('render')) document.body.classList.add('render');
const scrub = document.getElementById('scrub');
const clockEl = document.getElementById('clock');
let playing = false; let t0 = 0; let base = 0;
function tick(now) {
  if (!playing) return;
  const t = ((base + (now - t0) / 1000) % LOOP);
  render(t); scrub.value = t; clockEl.textContent = t.toFixed(3);
  requestAnimationFrame(tick);
}
document.getElementById('play').onclick = () => { playing = !playing; t0 = performance.now(); base = +scrub.value; if (playing) requestAnimationFrame(tick); };
scrub.oninput = () => { render(+scrub.value); clockEl.textContent = (+scrub.value).toFixed(3); };
window.ready.then(() => { const t = +(params.get('t') || 0); render(t); scrub.value = t; });
</script>
