<!doctype html>

<meta charset="utf-8">
<title>Библейские игры — ролик 60 с</title>
<meta name="viewport" content="width=1440">
<!--
  Рекламный ролик «Библейские игры», минутная версия: 62,4 секунды петлёй,
  26 тактов по 100 BPM, 104 доли. Все пятнадцать открытых игр приложения, и
  каждая перетекает в следующую.

  Устроен как promo/ad-28/index.html и берёт оттуда сцены восьми игр вместе с
  их хореографией: доли тех сцен записаны по старой шкале и встают на новую
  сетку со сдвигом (SEG), а доля здесь длиннее — всё идёт на пятую часть
  медленнее. Между ними — семь новых игр, снятых в shots/ этой папки
  (capture_new.mjs).

  Перетекания семи новых игр:
    плитки ИОРДАНа → на те же буквы сетки «Поиска слов»;
    «Н» из сетки → на клавишу «Н» «Священного слова» (НОЙ);
    «Н» из отгаданного слова → буква раунда «Соображариума» на тему «Имя»;
    карточка переворачивается → «Алиас»; экран кубом → «Опиши слово»;
    «Следующий игрок» — телефон передаётся по кругу → «Соглядатай»;
    окно из карточки «Соглядатая» → лобби «Квартета»;
    «Ковчег» с поля «Сокровищ» → рубашка карточки «Найди пару для ковчега»;
    из последней пары круглым окном разливается Нил.

  Всё внутри формы-экрана снято с работающих игр. Любой кадр — чистая функция
  времени seek(t); кадр 62,4 с равен кадру 0,0.
-->
<style>
  @font-face { font-family: 'Onest'; font-weight: 400 900; src: url('../ad/fonts/onest-cyrillic.woff2') format('woff2'); unicode-range: U+0400-045F, U+2116; }
  @font-face { font-family: 'Onest'; font-weight: 400 900; src: url('../ad/fonts/onest-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
  html, body { margin: 0; background: #0f1020; }
  body { font-family: 'Onest', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #frame { position: relative; width: 1440px; height: 1440px; overflow: hidden; background: #eaf3ff; }
  #backdrop { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  #veil { position: absolute; inset: 0; background: rgba(246, 251, 255, 0.34); }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
  #screen { position: absolute; left: 0; top: 0; overflow: hidden; background: #f6fbff; transform-origin: 50% 50%;
    box-shadow: 0 34px 90px rgba(49, 46, 129, 0.24), 0 4px 14px rgba(49, 46, 129, 0.10); }
  .scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .inner { position: absolute; left: 0; top: 0; width: 390px; transform-origin: 0 0; }
  .a { position: absolute; left: 0; top: 0; }
  .inner img, .a img { display: block; }
  .crop { position: absolute; overflow: hidden; }
  .crop > img { position: absolute; left: 0; top: 0; }
  #water { position: absolute; inset: 0; background: #3f5d58; }
  #fly { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .fly { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.back { transform: rotateY(180deg); }
  .face img { position: absolute; left: 0; top: 0; max-width: none; }
  #caption { position: absolute; left: 0; top: 0; width: 100%; height: 0; }
  .cap { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 26px; white-space: nowrap; transform-origin: 50% 50%; }
  .cap img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 8px 22px rgba(49, 46, 129, 0.18); }
  .kicker { font-size: 25px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #4F46E5; margin-bottom: 4px; }
  .title { font-size: 62px; font-weight: 800; letter-spacing: -0.03em; color: #312E81; line-height: 1.02; }
  .final { position: absolute; left: 0; top: 0; white-space: nowrap; transform-origin: 50% 50%; text-align: center; }
  #cta { display: flex; align-items: center; justify-content: center; border-radius: 34px; color: #fff; font-size: 46px; font-weight: 800; letter-spacing: -0.01em;
    background: linear-gradient(135deg, #4f46e5, #0ea5e9); box-shadow: 0 18px 40px rgba(79, 70, 229, 0.30); }
  #finger { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  #finger .dot { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%; box-sizing: border-box;
    border: 4px solid #312E81; background: rgba(255, 255, 255, 0.82); box-shadow: 0 6px 18px rgba(49, 46, 129, 0.28); }
  #finger .ring { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%; box-sizing: border-box; border: 4px solid #4F46E5; }

  #hud input { flex: 1; }
  .render #hud { display: none; }
</style>

<body>
<div id="frame">
  <img id="backdrop" src="../ad/shots/backdrop.webp" alt="">
  <div id="veil"></div>
  <div id="stage">
    <div id="screen"></div>

<script>
'use strict';

// ——————————————————————————————————————————————— кадр и зоны

const FRAME = { w: 1440, h: 1440 };
const ZONES = {
  caption: { cx: 720, cy: 118 },          // полоса подписи
  screen: { cx: 720, cy: 818, h: 1170 },  // где стоит форма-экран
};
const C = { x: FRAME.w / 2, y: FRAME.h / 2 };

// ——————————————————————————————————————————————— время и сетка

/*
  Минута: 26 тактов по 100 BPM, 104 доли по 0,6 с.

  Сцены 28-секундного ролика перенесены сюда вместе со всей хореографией: их
  доли записаны как там (0–56 при 120 BPM), а отрезки этой шкалы встают на
  новую сетку со сдвигом. Доля длиннее (0,6 с вместо 0,5), поэтому всё, что там
  происходило за долю, здесь происходит на пятую часть медленнее. Между
  отрезками — новые игры; их доли — «виртуальные»: nb(х) — доля х новой сетки
  в первом промежутке, np(х) — во втором.
*/
const BEAT_S = 0.6;
const LOOP = 62.4;
const NB = 104;
const OLD_NB = 56;
//         виртуальные доли      → с какой доли новой сетки
const SEG = [
  [0, 8, 0],            // меню, «Библейские слова»
  [100, 140, 8],        // «Поиск слов», «Священное слово», «Соображариум», «Алиас», «Опиши слово», «Соглядатай»
  [8, 19.6, 48],        // «Квартет», «Библейские сокровища»
  [200, 208, 59.6],     // «Найди пару для ковчега»
  [19.6, OLD_NB, 67.6], // Нил, «Земля обетованная», «Двенадцать колен», «Художник», «Угадай персонажа», финал
];
function toNew(v) {
  if (v < 0) return toNew(v + OLD_NB) - NB;
  if (v >= OLD_NB && v < 100) return toNew(v - OLD_NB) + NB;
  for (const [a, b, n] of SEG) if (v >= a && (v < b || (a >= 100 && v <= b))) return n + (v - a);
  throw new Error(`доля ${v} вне шкалы`);
}
const nb = (x) => { if (x < 8 || x > 48) throw new Error(`nb(${x}) вне первого промежутка`); return 100 + x - 8; };
const np = (x) => { if (x < 59.6 || x > 67.6) throw new Error(`np(${x}) вне второго промежутка`); return 200 + x - 59.6; };
/** Доля новой сетки → виртуальная доля (для сцен старой шкалы — их собственная доля). */
function fromNew(n) {
  for (const [a, b, s0] of SEG) if (n >= s0 && n < s0 + (b - a)) return a + n - s0;
  return n - NB + OLD_NB;   // хвост за последней долей
}
let GRID = Array.from({ length: NB + 1 }, (_, i) => i * BEAT_S);
function B(v) {
  const b = toNew(v);
  const k = Math.floor(b / NB);
  const r = b - NB * k;
  const i = Math.min(NB - 1, Math.floor(r));
  return GRID[i] + (r - i) * (GRID[i + 1] - GRID[i]) + k * LOOP;
}

// ——————————————————————————————————————————————— пружины

const SPR = {
  ui: [19, 0.86], soft: [12, 0.9], snap: [30, 0.86], morph: [15, 0.9], cam: [10, 0.96],
  cur: [13, 1], hop: [30, 1], drag: [9, 1], press: [42, 0.84], fade: [30, 1], pop: [22, 0.8], fall: [26, 0.78], slow: [7, 1],
  flip: [13, 1], fly: [11, 1], cut: [400, 1], tilt: [9, 0.92],
};
function S(dt, name = 'ui') {
  if (dt <= 0) return 0;
  const [w, z] = SPR[name];
  if (z >= 1) return 1 - (1 + w * dt) * Math.exp(-w * dt);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
/** Критически задемпфированная пружина из (x0, v0) к цели. */
function springFrom(x0, v0, target, dt, w) {
  if (dt <= 0) return x0;
  const a = x0 - target;
  return target + (a + (v0 + w * a) * dt) * Math.exp(-w * dt);
}

/*
  Дорожка: начальное значение и цели на долях. Значение — сумма пружин по одной
  на смену цели, этого круга и прошлого. Последняя цель обязана равняться
  начальной — иначе петля не замкнётся.
*/
const TRACKS = [];
function track(v0, keys, name) {
  const ev = [];
  let prev = v0;
  // цели по порядку во времени: доли разных отрезков шкалы по величине не сравнить
  const sorted = keys.map((k, i) => [k, i]).sort((a, b) => toNew(a[0][0]) - toNew(b[0][0]) || a[1] - b[1]).map(([k]) => k);
  for (const [b, v, sp] of sorted) { ev.push([b, v - prev, sp || 'ui']); prev = v; }
  if (Math.abs(prev - v0) > 1e-6) throw new Error(`дорожка «${name}» не замкнута: ${v0} → ${prev}`);
  const f = (t) => {
    let v = v0;
    for (let k = -1; k <= 0; k += 1) for (const [b, d, sp] of ev) v += d * S(t - B(b) - k * LOOP, sp);
    return v;
  };
  TRACKS.push(name);
  return f;
}
/** Точка — две дорожки. keys: [доля, {x, y}, пружина]. */
function track2(p0, keys, name) {
  const fx = track(p0.x, keys.map(([b, p, sp]) => [b, p.x, sp]), `${name}.x`);
  const fy = track(p0.y, keys.map(([b, p, sp]) => [b, p.y, sp]), `${name}.y`);
  return (t) => ({ x: fx(t), y: fy(t) });
}
/** Видимость слоя: вход и выход — каждый со своим временем. */
function vis(t, bin, bout, sin = 'fade', sout = 'fade') {
  let best = 0;
  for (let k = -1; k <= 1; k += 1) {
    const tt = t + k * LOOP;
    best = Math.max(best, clamp(S(tt - B(bin), sin) - S(tt - B(bout), sout), 0, 1));
  }
  return best;
}
/** Время t, приведённое к кругу, в котором доля b ещё впереди или только что прошла. */
function near(t, b) { let d = t - B(b); d -= LOOP * Math.round(d / LOOP); return d; }
/** Импульс нажатия: 0 → 1 → 0 вокруг доли b (опускание и отпускание). */
function press(t, b, hold = 0.09) {
  const d = near(t, b) + 0.02;
  return clamp(S(d, 'press') - S(d - hold, 'press'), 0, 1.2);
}
/** Доля новой сетки (с нуля, дробная) для момента t. */
function newBeatNow(t) {
  const tt = ((t % LOOP) + LOOP) % LOOP;
  let i = 0;
  while (i < NB - 1 && GRID[i + 1] <= tt) i += 1;
  return i + (tt - GRID[i]) / (GRID[i + 1] - GRID[i]);
}
/** Виртуальная доля для момента t — в той шкале, в которой записана сцена. */
const beatNow = (t) => fromNew(newBeatNow(t));
/** Ход от 0 к 1 за время от доли a до доли b — плавный, как у движения пальца. */
function ramp(t, a, b) {
  const u = clamp(near(t, a) / (B(b) - B(a)), 0, 1);
  return u * u * (3 - 2 * u);
}

// ——————————————————————————————————————————————— мелочи

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const px = (v) => `${v.toFixed(2)}px`;
function el(tag, cls, parent) { const n = document.createElement(tag); if (cls) n.className = cls; parent.appendChild(n); return n; }
function img(src, parent, cls = 'a') { const n = el('img', cls, parent); n.src = src; n.alt = ''; n.decoding = 'sync'; return n; }
function place(node, x, y, w, h) {
  node.style.transform = `translate(${px(x)}, ${px(y)})`;
  if (w != null) node.style.width = px(w);
  if (h != null) node.style.height = px(h);
}
/*
  Скрытый узел получает и прозрачность 0: потомок с visibility: visible виден
  даже в скрытом родителе, а прозрачность гасит всё поддерево.
*/
/** Видимость без фильтра — для предметов с двумя сторонами (фильтр сплющил бы 3D). */
function show(node, p) {
  if (p < 0.003) { node.style.visibility = 'hidden'; node.style.opacity = '0'; return false; }
  node.style.visibility = 'visible';
  node.style.opacity = p > 0.997 ? '1' : p.toFixed(4);
  return true;
}
/** Видимость узла с лёгким размытием на входе и выходе. */
function fade(node, p, blur = 8) {
  if (p < 0.003) { node.style.visibility = 'hidden'; node.style.opacity = '0'; return false; }
  node.style.visibility = 'visible';
  node.style.opacity = p > 0.997 ? '1' : p.toFixed(4);
  node.style.filter = p > 0.995 ? 'none' : `blur(${((1 - p) * blur).toFixed(2)}px)`;
  return true;
}

const L = window.LAYOUT;       // экраны 14-секундного ролика (promo/ad/shots)
const L2 = window.LAYOUT28;    // новые экраны (shots/)
const M = window.MOSES;
const PR = window.PROMISED;
const WEB = '../../web/';
const SOUNDS = [];
const sound = (beat, kind) => SOUNDS.push({ beat, kind });   // доля — виртуальная; в новую сетку переводится при выдаче

// ——————————————————————————————————————————————— сцены: вид на экран приложения

/*
  Каждая сцена — окно (view) в экран приложения в CSS-пикселях телефона и
  масштаб k: 390×844 стоя, 844×390 боком («Земля обетованная» и «Художник» —
  игры, которые сами просят повернуть телефон). На главных действиях окно
  сужается к нужной части экрана и увеличивает её — это и есть «приближение»:
  форма меняет пропорции вслед за окном и остаётся под подписью.
*/
const V = (x, y, w, h, k) => ({ view: { x, y, w, h }, k });
const SC = {
  menu:     { r: 58, cw: 390, states: [[-1, V(0, 0, 390, 780, 1.5)]] },
  words:    { r: 58, cw: 390, states: [[1.12, V(0, 58, 390, 786, 1.49)], [2.45, V(0, 462, 390, 382, 2.05)], [6.05, V(0, 62, 390, 360, 2.05)]] },
  ws:       { r: 52, cw: 390, states: [[nb(8), V(0, 88, 390, 690, 1.62)], [nb(9.3), V(0, 196, 390, 530, 2.08)]] },
  sacred:   { r: 52, cw: 390, states: [[nb(14.1), V(0, 170, 390, 580, 1.75)], [nb(18.3), V(0, 170, 390, 410, 2.25)]] },
  coim:     { r: 54, cw: 390, states: [[nb(20.1), V(0, 120, 390, 440, 2.1)]] },
  alias:    { r: 54, cw: 390, states: [[nb(25), V(0, 40, 390, 530, 1.9)]] },
  describe: { r: 54, cw: 390, states: [[nb(31.5), V(0, 80, 390, 320, 2.5)]] },
  spy:      { r: 54, cw: 390, states: [[nb(35.9), V(0, 10, 390, 820, 1.38)]] },
  lobby:    { r: 52, cw: 390, states: [[nb(45.9), V(0, 62, 390, 820, 1.42)]] },
  game:     { r: 54, cw: 390, states: [[11.92, V(0, 0, 390, 844, 1.38)], [12.5, V(0, 296, 390, 548, 1.9)], [15.5, V(0, 0, 390, 844, 1.38)]] },
  treasure: { r: 50, cw: 390, states: [[15.92, V(0, 104, 390, 508, 1.62)], [16.5, V(0, 160, 390, 452, 1.95)]] },
  pairs:    { r: 52, cw: 390, states: [[np(59.7), V(0, 80, 390, 650, 1.7)]] },
  moses:    { r: 54, cw: 390, states: [[np(66.5), V(0, 0, 390, 844, 1.37)]] },
  promised: { r: 46, cw: 844, states: [[24.95, V(131, 190, 200, 192, 3)], [26.5, V(0, 0, 844, 390, 1.5)], [29.45, V(338, 158, 130, 70, 4.6)]] },
  tribes:   { r: 50, cw: 390, states: [[30.1, V(0, 50, 390, 670, 1.68)]] },
  sketch:   { r: 40, cw: 844, states: [[36.1, V(170, 50, 480, 266, 2.5)], [40.35, V(0, 0, 844, 390, 1.5)]] },
  guess:    { r: 50, cw: 390, states: [[43.95, V(0, 76, 390, 240, 2.9)]] },
};
const EXIT = { menu: 1.6, words: 8.3, ws: nb(15), sacred: nb(21), lobby: 12.3, game: 16.3, treasure: 20.3, moses: 24.3, promised: 30.6, tribes: 36.3, sketch: 44.4, guess: 48.2 };
for (const [key, s] of Object.entries(SC)) {
  for (const [, st] of s.states) { st.w = st.view.w * st.k; st.h = st.view.h * st.k; st.cx = ZONES.screen.cx; st.cy = ZONES.screen.cy; st.r = s.r; }
  Object.assign(s, s.states[0][1]);
  // дорожки окна: центр, размер, масштаб — к каждому состоянию и обратно к первому после выхода
  const keys = (f) => [...s.states.slice(1).map(([b, st]) => [b, f(st), 'morph']), ...(s.states.length > 1 ? [[EXIT[key], f(s.states[0][1]), 'morph']] : [])];
  const d = s.states[0][1];
  s.tk = track(d.k, keys((st) => st.k), `${key}.k`);
  s.tx = track(d.view.x + d.view.w / 2, keys((st) => st.view.x + st.view.w / 2), `${key}.vx`);
  s.ty = track(d.view.y + d.view.h / 2, keys((st) => st.view.y + st.view.h / 2), `${key}.vy`);
  s.tw = track(d.view.w, keys((st) => st.view.w), `${key}.vw`);
  s.th = track(d.view.h, keys((st) => st.view.h), `${key}.vh`);
}
function stateAt(s, b) { let st = s.states[0][1]; for (const [sb, x] of s.states) if (sb <= b + 1e-9) st = x; return st; }
/** Точка экрана приложения p → точка кадра, в состоянии сцены на доле b (форма уже встала). */
function at(s, p, b) {
  const st = b == null ? s.states[0][1] : stateAt(s, b);
  const v = st.view;
  return { x: st.cx + (p.x - (v.x + v.w / 2)) * st.k, y: st.cy + (p.y - (v.y + v.h / 2)) * st.k };
}
const mid = (r) => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });
const P = (s, p, b) => at(SC[s], p, b);

// ——————————————————————————————————————————————— 3D-перевороты формы

/*
  Переворот: форма поворачивается на 180° вокруг оси; на ребре (90°) старое
  содержимое сменяется новым, и форма доворачивается к зрителю уже им — угол
  скачком переходит с 90° на −90°, поэтому новое содержимое не зеркально.
*/

  const at = (m, a, b) => 3 * m * (1 - m) ** 2 * a + 3 * m * m * (1 - m) * b + m ** 3;

    N.spy.forEach((n, i) => fade(n, SPY_SHOTS[i] === base ? 1 : 0, 0));
    if (show(N.spyFlip.box, flip ? 1 : 0)) {
      const card = SP.card; const pad = SPY_FLIP.pad;
      const o = { x: Math.max(0, card.x - pad), y: Math.max(0, card.y - pad) };
      const im = N.spyFlip.backs[0];
      N.spyFlip.backs.forEach((n, i) => { n.style.visibility = i === flip[1] ? 'inherit' : 'hidden'; });
      N.spyFlip.box.style.width = im.style.width; N.spyFlip.box.style.height = im.style.height;
      N.spyFlip.box.style.transformOrigin = `${px(card.x + card.w / 2 - o.x)} ${px(card.y + card.h / 2 - o.y)}`;
      N.spyFlip.box.style.transform = `translate(${px(o.x)}, ${px(o.y)}) perspective(1300px) rotateY(${(180 * SPY_FLIP.ease(flip[0] / SPY_FLIP.s)).toFixed(3)}deg)`;
    }
  }

  // ——— «Квартет»: лобби ———
  const lm = layoutScene('lobby', t, box);
  if (lm) {
    // ⇄ лобби проявляется в круглом окне из карточки «Соглядатая»
    const d = near(t, SPB.iris);
    const R = Math.hypot(box.w, box.h) * S(d, 'morph');
    const c0 = toFrame('spy', mid(SP.card), t);
    LAYER.lobby.style.clipPath = d >= 0 && d < 1.5 && R < Math.hypot(box.w, box.h) * 0.999 ? `circle(${px(R)} at ${px(c0.x - (box.cx - box.w / 2))} ${px(c0.y - (box.cy - box.h / 2))})` : 'none';
    const joined = [10, 10.25, 10.5].filter((b) => near(t, b) >= 0 && near(t, 12.4) < 0).length;
    N.lobby.forEach((n, i) => fade(n, i === joined ? 1 : 0, 0));
    const pc = press(t, 9, 0.1);
    sprite(N.copyBtn, Q.lobby.copy, 16);
    N.copyBtn.style.transform = `scale(${(1 - 0.04 * pc).toFixed(4)})`; N.copyBtn.style.transformOrigin = '50% 50%';
    fade(N.copyBtn, pc > 0.01 ? 1 : 0, 0);
    const pt = vis(t, 9.05, 9.95, 'pop', 'fade');
    sprite(N.toast, Q.toast, 20);
    if (fade(N.toast, Math.min(1, pt), 6)) { N.toast.style.transform = `translate(0px, ${px((1 - Math.min(1, pt)) * 14)}) scale(${(0.9 + 0.1 * pt).toFixed(4)})`; N.toast.style.transformOrigin = '50% 50%'; }
    const ps = press(t, 11, 0.1);
    sprite(N.startBtn, Q.lobby.start, 16);
    N.startBtn.style.transform = `scale(${(1 - 0.04 * ps).toFixed(4)})`; N.startBtn.style.transformOrigin = '50% 50%';
    fade(N.startBtn, ps > 0.01 ? 1 : 0, 0);
  }

  // ——— «Квартет»: партия ———
  if (layoutScene('game', t, box)) {
    const GS = [11.9, 13.02, 14.02, 15.62, 16.4];
    const base = N.game.map((n, i) => vis(t, GS[i], GS[i + 1] + 0.3));
    N.game.forEach((n, i) => fade(n, i === 0 ? 1 : base[i], 6));
    sprite(N.noticeStart, Q.game.noticeStart, 24);
    const pn = vis(t, 12.1, 12.9, 'pop', 'fade');
    if (fade(N.noticeStart, Math.min(1, pn), 6)) { N.noticeStart.style.transform = `translate(0px, ${px((1 - Math.min(1, pn)) * 16)})`; }
    const art = Q.game.andrewArt;
    const df = near(t, 15.02);
    const flipOn = df >= 0 && near(t, FISH.b) < 0;       // дальше карту несёт полёт
    if (fade(N.flip, flipOn ? 1 : 0, 0)) {
      place(N.flip, art.x, art.y, art.w, art.h);
      N.flip.style.borderRadius = '12px';
      const u = clamp(df / (B(15.4) - B(15.02)), 0, 1);
      const sx = Math.abs(Math.cos(Math.PI * u));
      N.flipBack.style.transform = `translate(${px(-art.x)}, ${px(-art.y)})`;
      N.flipBack.style.visibility = u < 0.5 ? 'visible' : 'hidden';
      N.flipArt.style.width = px(art.w); N.flipArt.style.height = px(art.h); N.flipArt.style.objectFit = 'cover';
      N.flipArt.style.visibility = u >= 0.5 ? 'visible' : 'hidden';
      N.flip.style.transform = `translate(${px(art.x)}, ${px(art.y)}) scale(${Math.max(0.02, sx).toFixed(4)}, 1)`;
      N.flip.style.transformOrigin = '50% 50%';
    }
    sprite(N.notice, Q.game.notice, 24);
    const pa = vis(t, 15.42, 16, 'pop', 'fade');
    if (fade(N.notice, Math.min(1, pa), 6)) { N.notice.style.transform = `translate(0px, ${px((1 - Math.min(1, pa)) * 16)})`; }
  }
  // ⇄ карта Андрея переворачивается в полёте и ложится фишкой «Рыба»
  {
    const d = near(t, FISH.b);
    const on = d >= 0 && near(t, FISH.land) < 0.02;
    if (show(N.andrewFly, on ? 1 : 0)) {
      const u = clamp(d / (B(FISH.land) - B(FISH.b)), 0, 1);
      const e = u * u * (3 - 2 * u);
      const from = rectToFrame('game', Q.game.andrewArt, B(FISH.b));
      const to = rectToFrame('treasure', pieceRect(FISH.r, FISH.c), B(FISH.land));
      const r = morphRect(from, to, e, 120);
      N.andrewFront.style.borderRadius = N.andrewBack.style.borderRadius = px(12 * r.w / from.w);
      flyTo(N.andrewFly, r, 0, 180 * e);
    }
  }

  // ——— «Библейские сокровища» ———
  if (layoutScene('treasure', t, box)) {
    const hudY = T.hud.y;
    N.hud.forEach((n, i) => { n.style.left = '0px'; n.style.top = px(hudY); fade(n, vis(t, i === 0 ? TB.clear1 : TB.clear2, i === 0 ? TB.clear2 + 0.3 : 20.4, 'fade', 'fade'), 0); });
    place(N.board, T.board.x, T.board.y, T.board.w, T.board.h);
    N.board.style.transform = `translate(${px(T.board.x)}, ${px(T.board.y)})`;
    for (const p of pieces) {
      let r = p.r0, cc = p.c0;
      for (const [b, dr, dc, sp] of p.moves) { const s = S(near(t, b), sp); r += dr * s; cc += dc * s; }
      let x = tile(0, 0).x + cc * PITCH.x + PIECE_BOX.dx - T.board.x;
      let y = tile(0, 0).y + r * PITCH.y + PIECE_BOX.dy - T.board.y;
      if (p.fresh == null && p.flyIn == null) y -= (1 - S(near(t, TB.rowIn(p.r0)), 'fall')) * PITCH.y * 5.5;
      if (p.dragged) {
        const nudge = (tt) => PITCH.x * 0.34 * Math.tanh((toContent('treasure', fingerP(tt), tt).x - mid(tile(4, 2)).x) / (PITCH.x * 0.6));
        const dh = near(t, TB.press); const dr = near(t, TB.release);
        if (dh >= 0 && dr < 0) x += nudge(t);
        else if (dr >= 0 && dr < 1) x += nudge(t - dr - 0.001) * (1 - S(dr, 'snap'));
      }
      let scale = 1, op = 1;
      if (p.clear != null && near(t, p.clear) >= 0) {
        const d = near(t, p.clear);
        const u = S(d, 'fade');
        scale = (1 + 0.16 * Math.sin(Math.PI * Math.min(1, d / 0.12))) * (1 - u);
        op = 1 - u;
      }
      // прилетевшая карта становится фишкой; «Ковчег» улетает разливать Нил
      if (p.flyIn != null && near(t, p.flyIn) < 0 && near(t, p.flyIn) > -4) op = 0;
      if (p.flyOut != null && near(t, p.flyOut) >= 0 && near(t, p.flyOut) < 2) op = 0;
      p.node.style.visibility = op > 0.01 && scale > 0.02 ? 'visible' : 'hidden';
      p.node.style.opacity = op.toFixed(3);
      p.node.style.transform = `translate(${px(x)}, ${px(y)}) scale(${Math.max(0.001, scale).toFixed(4)})`;
    }
    const pk = vis(t, TB.clear2, 19.85, 'pop', 'fade');
    const anchor = mid(tile(3, 5));
    N.cascade.style.left = px(anchor.x - 45); N.cascade.style.top = px(anchor.y - 6);
    if (fade(N.cascade, Math.min(1, pk), 0)) N.cascade.style.transform = `translate(0px, ${px(-26 * S(near(t, TB.clear2), 'slow'))}) scale(${(0.7 + 0.3 * Math.min(1, pk)).toFixed(4)})`;
  }
  // ⇄ «Ковчег» поднимается с поля, переворачивается и ложится рубашкой карточки «Найди пару для ковчега»
  {
    const d = near(t, ARK.b);
    const on = d >= 0 && near(t, PAB.land) < 0.04;
    if (show(N.arkFly, on ? 1 : 0)) {
      const e = ramp(t, ARK.b, PAB.land);
      const from = rectToFrame('treasure', pieceRect(ARK.r, ARK.c), B(ARK.b));
      const card = pairCard(PAIR_ORDER[0]);
      const to = rectToFrame('pairs', card, B(PAB.land));
      const r = morphRect(from, to, e, 150);
      const kc = r.w / card.w;
      N.arkCard.style.width = px(N.arkCard.naturalWidth / 3 * kc); N.arkCard.style.height = px(N.arkCard.naturalHeight / 3 * kc);
      N.arkCard.style.transform = `translate(${px(-PAIR_FLIP.pad * kc)}, ${px(-PAIR_FLIP.pad * kc)})`;
      flyTo(N.arkFly, r, 0, 180 * e);
    }
  }

  // ——— «Найди пару для ковчега»: карточки переворачиваются, как в игре ———
  const pm2 = layoutScene('pairs', t, box);
  if (pm2) {
    let base = 0; let hole = -1; let flip = null;
    PAB.taps.forEach((b, i) => {
      const d = near(t, b);
      if (d < 0) return;
      if (d < PAIR_FLIP.s) { hole = i; flip = [d, i]; } else base = i + 1;
    });
    N.pairs.forEach((n, i) => fade(n, hole < 0 && i === base ? 1 : 0, 0));
    N.pairsHole.forEach((n, i) => fade(n, i === hole ? 1 : 0, 0));
    if (show(N.pairFlip.box, flip ? 1 : 0)) {
      const card = pairCard(PAIR_ORDER[flip[1]]); const pad = PAIR_FLIP.pad;
      const im = N.pairFlip.backs[flip[1]];
      N.pairFlip.backs.forEach((n, i) => { n.style.visibility = i === flip[1] ? 'inherit' : 'hidden'; });
      N.pairFlip.box.style.width = im.style.width; N.pairFlip.box.style.height = im.style.height;
      N.pairFlip.box.style.transformOrigin = '50% 50%';
      N.pairFlip.box.style.transform = `translate(${px(card.x - pad)}, ${px(card.y - pad)}) perspective(1300px) rotateY(${(180 * PAIR_FLIP.ease(flip[0] / PAIR_FLIP.s)).toFixed(3)}deg)`;
    }
  }
  // из последней открытой карточки круглым окном разливается Нил
  const nileFrom = toFrame('pairs', mid(pairCard(PAIR_ORDER[3])), t);

  // ——— «Моисей» ———
  const mm = layoutScene('moses', t, box);
  if (mm) {
    const src = `../ad-28/build/moses/f${String(footageFrame(M, t)).padStart(4, '0')}.jpg`;
    if (!N.moses.src.endsWith(src)) N.moses.src = src;
    // круглое окно из последней пары: Нил проявляется от неё по всей форме
    const d = near(t, PAB.iris);
    const R = Math.hypot(box.w, box.h) * S(d, 'morph');
    const cx = nileFrom.x - (box.cx - box.w / 2);
    const cy = nileFrom.y - (box.cy - box.h / 2);
    LAYER.moses.style.clipPath = d >= 0 && d < 1.2 && R < Math.hypot(box.w, box.h) * 0.999 ? `circle(${px(R)} at ${px(cx)} ${px(cy)})` : 'none';
  }
  // ⇄ толща воды: корзинка ныряет — и экран вместе с ней
  // под водой ещё угадывается река; когда её не стало, вода густеет до конца
  fade(N.water, vis(t, 24.3, 26.6, 'soft', 'fade') * (0.84 + 0.16 * (1 - sceneVis('moses', t))), 0);

  // ——— «Земля обетованная» ———
  const pm = layoutScene('promised', t, box);
  if (pm) {
    const src = `../ad-28/build/promised/f${String(footageFrame(PR, t)).padStart(4, '0')}.jpg`;
    if (!N.pl.src.endsWith(src)) N.pl.src = src;
    // из колодца открывается окно — вода смыкается над ним
    const d1 = near(t, WELL.open); const d2 = near(t, WELL.spread);
    const R = WELL.r * pm.k * S(d1, 'pop') + Math.hypot(box.w, box.h) * S(d2, 'morph');
    const full = d2 > 0.9 || d1 < -4;
    if (full) LAYER.promised.style.clipPath = 'none';
    else if (R < 0.5) { LAYER.promised.style.visibility = 'hidden'; LAYER.promised.style.opacity = '0'; }
    else LAYER.promised.style.clipPath = `circle(${px(R)} at ${px(pm.x + WELL.x * pm.k)} ${px(pm.y + WELL.y * pm.k)})`;
  }
  // ⇄ грань кубика с тройкой переворачивается картой «3 Дан»
  {
    const d = near(t, THREE.b);
    const on = d >= 0 && near(t, THREE.land) < 0.03;
    if (show(N.dieFly, on ? 1 : 0)) {
      const u = clamp(d / (B(THREE.land) - B(THREE.b)), 0, 1);
      const e = u * u * (3 - 2 * u);
      const from = rectToFrame('promised', DIE, B(THREE.b));
      const to = rectToFrame('tribes', TT.threeRect, B(THREE.land) + 0.25);
      const r = morphRect(from, to, e, 60);
      // лицевая сторона — сама грань в кадре записи, оборот — карта игры
      const sx = r.w / DIE.w, sy = r.h / DIE.h;
      N.dieImg.style.width = px(844 * sx); N.dieImg.style.height = px(390 * sy);
      N.dieImg.style.transform = `translate(${px(-DIE.x * sx)}, ${px(-DIE.y * sy)})`;
      const kc = r.w / TT.threeRect.w;
      N.dieCard.style.width = px(N.dieCard.naturalWidth / 3 * kc); N.dieCard.style.height = px(N.dieCard.naturalHeight / 3 * kc);
      N.dieCard.style.transform = `translate(${px(-CARD_PAD * kc)}, ${px(-CARD_PAD * kc)})`;
      N.dieFront.style.borderRadius = px(4 * sx);
      flyTo(N.dieFly, r, 0, 180 * e);
    }
  }

  // ——— «Двенадцать колен» ———
  if (layoutScene('tribes', t, box)) {
    // экран игры сменяется, как в самой игре, — сразу
    const idx = [TR.play + 0.05, TR.bots, TR.jordanOn, TR.shabbatOn].filter((b) => bt >= b).length;
    N.tribes.forEach((n, i) => { fade(n, i === idx ? 1 : 0, 0); n.style.zIndex = String(i); });
    // тройка Дана летит на сброс; сброс под ней — ещё тройка Рувима
    const dp = near(t, TR.play + 0.05);
    const flying = dp >= 0 && near(t, TR.played) < 0;
    const pile = TT.pile; const pad = 8;
    if (fade(N.pilePatch, flying ? 1 : 0, 0)) {
      place(N.pilePatch, pile.x - pad, pile.y - pad, pile.w + pad * 2, pile.h + pad * 2);
      N.pilePatch.style.left = '0px'; N.pilePatch.style.top = '0px';
      N.pilePatchImg.style.transform = `translate(${px(-(pile.x - pad))}, ${px(-(pile.y - pad))})`;
      N.pilePatch.style.zIndex = '8';
    }
    if (fade(N.playCard, flying ? 1 : 0, 0)) {
      const u = S(dp, 'fly');
      const a = TT.threeRect;
      const x = lerp(a.x, pile.x, u); const y = lerp(a.y, pile.y, u) - 40 * Math.sin(Math.PI * Math.min(1, u));
      N.playCard.style.transform = `translate(${px(x - CARD_PAD)}, ${px(y - CARD_PAD)}) rotate(${(-6 * Math.sin(Math.PI * Math.min(1, u))).toFixed(2)}deg)`;
      N.playCard.style.zIndex = '9';
    }
  }
  // ⇄ последняя карта переворачивается — её оборот становится холстом
  {
    const d = near(t, CANVAS.b);
    const on = d >= 0 && near(t, CANVAS.land) < 0.08;
    // гаснет только оборот: прозрачность на самом 3D-узле сплющила бы его, и проступило бы лицо карты
    N.cardBack.style.opacity = on ? (1 - S(near(t, CANVAS.land), 'fade')).toFixed(4) : '1';
    if (show(N.cardFly, on ? 1 : 0)) {
      const u = clamp(d / (B(CANVAS.land) - B(CANVAS.b)), 0, 1);
      const e = u * u * (3 - 2 * u);
      const from = rectToFrame('tribes', JUDAH, B(CANVAS.b));
      const to = rectToFrame('sketch', SK.canvas, B(CANVAS.land) + 0.3);
      const r = morphRect(from, to, e, 80);
      const kk = r.w / JUDAH.w; const kh = r.h / JUDAH.h;
      N.cardImg.style.width = px(390 * kk); N.cardImg.style.height = px(844 * kh);
      N.cardImg.style.transform = `translate(${px(-JUDAH.x * kk)}, ${px(-JUDAH.y * kh)})`;
      N.cardFront.style.borderRadius = px(JUDAH.r * kk);
      N.cardBack.style.borderRadius = px(lerp(JUDAH.r * from.w / JUDAH.w, 14 * to.w / SK.canvas.w, e));
      flyTo(N.cardFly, r, 0, 180 * e);
    }
  }

  // ——— «Библейский художник» ———
  if (layoutScene('sketch', t, box)) {
    const idx = [SKB.vote, SKB.review, SKB.result].filter((b) => bt >= b).length;
    N.sketch.forEach((n, i) => fade(n, i === idx ? 1 : 0, 0));
    const drawing = idx === 0 && bt > 30;
    N.canvas.style.visibility = drawing ? 'visible' : 'hidden';
    if (drawing) STROKES.forEach((s, i) => {
      const d = near(t, s.a);
      const u = d < 0 ? 0 : ramp(t, s.a, s.b);
      if (u <= 0) { N.strokes[i].setAttribute('d', ''); return; }
      const pts = strokeUpTo(s, u);
      N.strokes[i].setAttribute('d', pts.map((q, j) => `${j ? 'L' : 'M'}${q.x.toFixed(2)} ${q.y.toFixed(2)}`).join(' '));
    });
  }

  // ——— «Угадай персонажа» ———
  if (layoutScene('guess', t, box)) {
    const second = bt >= FLIPS.card.mid && bt < 50;
    fade(N.guess[0], second ? 0 : 1, 0);
    fade(N.guess[1], second ? 1 : 0, 0);
  }

  // ——— финал: иконка приложения, название, кнопка ———
  {
    const pIcon = vis(t, FLIPS.icon.mid, OLD_NB - 0.97, 'cut', 'fade');
    if (fade(N.icon, pIcon, 10)) place(N.icon, 0, 0, box.w, box.h);
    const fin = (node, bin, bout, x, y, dy = 18) => {
      const p = vis(t, bin, bout, 'pop', 'fade');
      if (!fade(node, Math.min(1, p), 10)) return;
      node.style.transform = `translate(${px(x)}, ${px(y + (1 - Math.min(1, p)) * dy)}) translate(-50%, -50%) scale(${(0.94 + 0.06 * Math.min(1, p)).toFixed(4)})`;
    };
    fin(N.fTitle, FIN.title, FIN.out, 720, 764);
    fin(N.fSub, FIN.sub, FIN.out, 720, 858);
    N.fIcons.forEach((n, i) => { const q = iconAt(i); fin(n, FIN.icons + i * 0.125, FIN.out, q.x, q.y, 26); });
    const pc = press(t, FIN.tap, 0.12);
    fin(N.cta, FIN.cta, FIN.out, CTA.x, CTA.y);
    N.cta.firstChild.style.transform = `scale(${(1 - 0.05 * pc).toFixed(4)})`;
  }

  // ——— подписи: выход и вход — порознь ———
  for (const cp of CAPS) {
    const p = vis(t, cp.from, cp.to, 'pop', 'fade');
    if (!fade(cp.node, Math.min(1, p), 10)) continue;
    cp.node.style.transform = `translate(${px(ZONES.caption.cx)}, ${px(ZONES.caption.cy + (1 - Math.min(1, p)) * 16)}) translate(-50%, -50%) scale(${cp.fit.toFixed(4)})`;
  }

  // ——— палец: в экранных координатах, постоянного размера ———
  const fp = toScreen(c, fingerP(t));
  const pr = fingerPress(t);
  finger.style.transform = `translate(${px(fp.x)}, ${px(fp.y)})`;
  fingerDot.style.transform = `scale(${(1 - 0.16 * Math.min(1, pr)).toFixed(4)})`;
  fingerDot.style.background = `rgba(${Math.round(lerp(255, 199, pr))}, ${Math.round(lerp(255, 210, pr))}, 255, 0.86)`;
  const rp = ripple(t);
  if (rp != null) {
    const u = S(rp, 'soft');
    fingerRing.style.visibility = 'visible';
    fingerRing.style.opacity = (0.55 * (1 - u) * clamp(rp / 0.05, 0, 1)).toFixed(3);
    fingerRing.style.transform = `scale(${(1 + 0.75 * u).toFixed(4)})`;
  } else fingerRing.style.visibility = 'hidden';
}

// Точка кадра → точка экрана приложения (без учёта перестройки формы — для пальца на неподвижной сцене).
function toContent(key, p, t = frameT) {
  const s = SC[key];
  const k = s.tk(t);
  return { x: (p.x - ZONES.screen.cx) / k + s.tx(t), y: (p.y - ZONES.screen.cy) / k + s.ty(t) };
}

// ——————————————————————————————————————————————— вход

window.SOUNDS = SOUNDS.map((s) => ({ ...s, beat: toNew(s.beat) }));
window.setGrid = (beats, loop) => {
  const t0 = beats[0];
  GRID = [...beats.map((b) => b - t0), loop];
};
async function decodeAll() {
  const all = [...document.images];
  await Promise.all(all.map((n) => (n.complete && n.naturalWidth ? Promise.resolve() : new Promise((r) => { n.onload = r; n.onerror = r; }))));
  for (const [n, scale] of IMAGES) { n.style.width = px(n.naturalWidth / scale); n.style.height = px(n.naturalHeight / scale); }
  await Promise.all(all.map((n) => n.decode().catch(() => {})));
  await document.fonts.ready;
  // длинная строка подписи ужимается, чтобы остаться в кадре
  for (const c of CAPS) { c.node.style.visibility = 'visible'; c.fit = Math.min(1, 1300 / c.node.offsetWidth); }
}
window.ready = decodeAll().then(() => { render(0); return true; });
window.seek = (t) => {
  render(((t % LOOP) + LOOP) % LOOP);
  // записи заплыва и партии — единственные картинки, которые меняются от кадра к кадру
  return Promise.all([N.moses, N.pl].map((n) => (n.complete ? Promise.resolve() : n.decode().catch(() => {}))));
};

const params = new URLSearchParams(location.search);
if (params.has('render')) document.body.classList.add('render');
const scrub = document.getElementById('scrub');
const clockEl = document.getElementById('clock');
let playing = false; let t0 = 0; let base = 0;
function tick(now) {
  if (!playing) return;
  const t = ((base + (now - t0) / 1000) % LOOP);
  render(t); scrub.value = t; clockEl.textContent = t.toFixed(3);
  requestAnimationFrame(tick);
}
document.getElementById('play').onclick = () => { playing = !playing; t0 = performance.now(); base = +scrub.value; if (playing) requestAnimationFrame(tick); };
scrub.oninput = () => { render(+scrub.value); clockEl.textContent = (+scrub.value).toFixed(3); };
window.ready.then(() => { const t = +(params.get('t') || 0); render(t); scrub.value = t; });
</script>
</body>
