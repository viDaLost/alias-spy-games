plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningReady = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every {
    it != null && !it.trim().isEmpty()
}

android {
    namespace 'com.vidalost.biblegames'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vidalost.biblegames'
        minSdk 24
        targetSdk 36
        versionCode 29
        versionName '3.0.2-web-parity'
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        if (releaseSigningReady) {
            production {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (releaseSigningReady) {
                signingConfig signingConfigs.production
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion = '1.5.14' }

    packaging {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/assets/native'))
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any {
        it.project == project && (it.name == 'assembleRelease' || it.name == 'bundleRelease' || it.name == 'apkForDistribution' || it.name == 'bundleForPlay')
    }
    if (releaseRequested && !releaseSigningReady) {
        throw new GradleException(
                'Production signing is not configured. Set ANDROID_KEYSTORE_PATH, ' +
                'ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.'
        )
    }
    if (releaseRequested && !file(releaseStoreFile).isFile()) {
        throw new GradleException('ANDROID_KEYSTORE_PATH does not point to a readable keystore file')
    }
}

tasks.register('bundleForPlay') {
    group = 'build'
    description = 'Builds a production-signed Android App Bundle.'
    dependsOn 'bundleRelease'
}

tasks.register('apkForDistribution') {
    group = 'build'
    description = 'Builds a production-signed APK for direct distribution.'
    dependsOn 'assembleRelease'
}

def repositoryRoot = rootProject.projectDir.parentFile
def generatedNativeAssets = layout.buildDirectory.dir('generated/assets/native')

tasks.register('syncNativeAssets', Exec) {
    workingDir repositoryRoot
    commandLine 'node', new File(repositoryRoot, 'scripts/sync-android-assets.mjs').absolutePath, generatedNativeAssets.get().asFile.absolutePath
    inputs.files(fileTree(repositoryRoot) {
        include 'index.html'
        include 'web/**'
        include 'scripts/sync-android-assets.mjs'
        exclude 'node_modules/**', 'android-app/**'
    })
    outputs.dir(generatedNativeAssets)
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncNativeAssets')
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
