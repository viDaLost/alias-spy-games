<!--
  Ширина и высота проставлены нарочно. Без них у рисунка нет своего размера:
  в <img> браузер отдаёт naturalWidth = 0, и проверка главного меню честно
  сообщает, что значок не отрисовался. Все прочие значки меню — растровые и
  свой размер имеют; этот теперь тоже.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="57" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#312E81"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
    <linearGradient id="gold" x1="20" y1="24" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE259"/><stop offset="1" stop-color="#FFA751"/></linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#bg)"/>
  <circle cx="32" cy="34" r="15" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.4" stroke-dasharray="2 3"/>
  <path d="M20 40l2-14 6 6 4-9 4 9 6-6 2 14z" fill="url(#gold)" stroke="#92400E" stroke-width="1"/>
  <rect x="20" y="40" width="24" height="4" rx="1.5" fill="#B45309"/>
  <circle cx="18" cy="20" r="3" fill="#22D3EE"/>
  <circle cx="46" cy="20" r="3" fill="#FB923C"/>
  <circle cx="14" cy="34" r="3" fill="#84CC16"/>
  <circle cx="50" cy="34" r="3" fill="#F59E0B"/>
  <circle cx="32" cy="12" r="3" fill="#818CF8"/>
</svg>
