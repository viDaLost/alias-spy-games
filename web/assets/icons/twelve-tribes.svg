<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Двенадцать колен">
  <!--
    Иконка меню: четыре карты веером, по одной на стан. Цвета те же, что на
    столе игры, — красный Иуда, синий Рувим, зелёный Ефрем, золотой Дан, — и
    по ним игра узнаётся в меню раньше, чем прочитано название.

    Рисунок, а не фотография: он весит полтора килобайта, не ждёт сети и
    остаётся чётким на любом экране.
  -->
  <defs>
    <linearGradient id="tt-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7a4d"/>
      <stop offset="1" stop-color="#0e4a30"/>
    </linearGradient>
    <filter id="tt-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.2" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tt-tile)"/>
  <g filter="url(#tt-drop)">
    <g transform="rotate(-21 32 44)">
      <rect x="21" y="18" width="22" height="31" rx="4" fill="#c0392b"/>
      <rect x="23.6" y="20.6" width="16.8" height="25.8" rx="2.4" fill="#fdf6f5"/>
    </g>
    <g transform="rotate(-7 32 44)">
      <rect x="21" y="16" width="22" height="31" rx="4" fill="#1d4ed8"/>
      <rect x="23.6" y="18.6" width="16.8" height="25.8" rx="2.4" fill="#f4f7ff"/>
    </g>
    <g transform="rotate(7 32 44)">
      <rect x="21" y="16" width="22" height="31" rx="4" fill="#15803d"/>
      <rect x="23.6" y="18.6" width="16.8" height="25.8" rx="2.4" fill="#f3fbf5"/>
    </g>
    <g transform="rotate(21 32 44)">
      <rect x="21" y="18" width="22" height="31" rx="4" fill="#b7791f"/>
      <rect x="23.6" y="20.6" width="16.8" height="25.8" rx="2.4" fill="#fdf9ef"/>
      <!-- Жребий на верхней карте: четыре точки по числу станов. -->
      <g fill="#b7791f">
        <circle cx="29" cy="28" r="2.1"/>
        <circle cx="35" cy="28" r="2.1"/>
        <circle cx="29" cy="37" r="2.1"/>
        <circle cx="35" cy="37" r="2.1"/>
      </g>
    </g>
  </g>
</svg>
