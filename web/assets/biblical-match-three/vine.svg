<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Тернии">
  <defs>
    <linearGradient id="vineStem" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f9a6b"/>
      <stop offset=".5" stop-color="#2f6743"/>
      <stop offset="1" stop-color="#1a3f28"/>
    </linearGradient>
    <linearGradient id="vineLeaf" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93d5a8"/>
      <stop offset="1" stop-color="#3d8a58"/>
    </linearGradient>
  </defs>

  <!-- Плеть терния: одна толстая петля через всю клетку и вторая, поменьше. -->
  <g fill="none" stroke="#173823" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round" opacity=".28">
    <path d="M6 33c6 5 13 4 17-2 4-7 11-8 17-3"/>
    <path d="M8 15c7-5 14-3 18 3"/>
  </g>
  <g fill="none" stroke="url(#vineStem)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 33c6 5 13 4 17-2 4-7 11-8 17-3"/>
    <path d="M8 15c7-5 14-3 18 3"/>
  </g>
  <g fill="none" stroke="#7cc294" stroke-width="1.5" stroke-linecap="round" opacity=".75">
    <path d="M8 32c5 3 10 2 13-3"/>
    <path d="M11 15c5-3 10-2 13 2"/>
  </g>

  <!-- Шипы: без них плеть читается просто как лоза. -->
  <g fill="#173823">
    <path d="M12 29l-1-7 5 5z"/>
    <path d="M23 27l4-7 2 7z"/>
    <path d="M34 26l6-3-2 7z"/>
    <path d="M17 39l-2-6 6 2z"/>
    <path d="M15 15l1-6 4 4z"/>
    <path d="M26 21l6-2-3 5z"/>
  </g>

  <g fill="url(#vineLeaf)" stroke="#255c3b" stroke-width="1.1">
    <path d="M31 33c-5 1-8 5-7 9 5-1 8-5 7-9z"/>
    <path d="M20 9c4 2 6 6 4 10-4-2-5-6-4-10z"/>
  </g>
</svg>
