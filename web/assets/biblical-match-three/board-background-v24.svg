<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="Светлый сиренево-голубой арочный фон игрового поля">
  <defs>
    <linearGradient id="center" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe8ff"/>
      <stop offset=".18" stop-color="#eef5ff"/>
      <stop offset=".52" stop-color="#f5fbff"/>
      <stop offset=".82" stop-color="#edf3ff"/>
      <stop offset="1" stop-color="#d9d5ff"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e4e1ff"/><stop offset=".28" stop-color="#c2c3ff"/><stop offset=".55" stop-color="#9aa4ec"/><stop offset=".78" stop-color="#c9c5ff"/><stop offset="1" stop-color="#8d8edb"/>
    </linearGradient>
    <linearGradient id="stoneLight" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b5b7f1"/><stop offset=".28" stop-color="#f5f2ff"/><stop offset=".55" stop-color="#c8c8ff"/><stop offset=".82" stop-color="#f0edff"/><stop offset="1" stop-color="#9b9de1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c79a54"/><stop offset=".25" stop-color="#ffe2a4"/><stop offset=".55" stop-color="#d3a357"/><stop offset=".8" stop-color="#ffe2a3"/><stop offset="1" stop-color="#b77e3f"/>
    </linearGradient>
    <radialGradient id="lav" cx="50%" cy="42%" r="68%">
      <stop stop-color="#fff" stop-opacity=".86"/><stop offset=".48" stop-color="#e7f2ff" stop-opacity=".48"/><stop offset="1" stop-color="#bfb7ff" stop-opacity=".42"/>
    </radialGradient>
    <radialGradient id="gem" cx="35%" cy="28%" r="75%">
      <stop stop-color="#f8ffff"/><stop offset=".25" stop-color="#94ecff"/><stop offset=".55" stop-color="#667ee8"/><stop offset=".78" stop-color="#a650e3"/><stop offset="1" stop-color="#5d55bd"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="mosaic" width="150" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H150V150H0Z M22 22H128V128H22Z" fill="none" stroke="#98aee9" stroke-opacity=".08" stroke-width="7"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="url(#center)"/>
  <ellipse cx="540" cy="930" rx="470" ry="790" fill="url(#lav)"/>
  <rect x="82" y="150" width="916" height="1600" rx="410" fill="url(#mosaic)" opacity=".65"/>
  <ellipse cx="540" cy="790" rx="370" ry="600" fill="#fff" opacity=".18" filter="url(#soft)"/>

  <!-- monumental arch -->
  <path d="M72 400C80 182 268 30 540 30s460 152 468 370" fill="none" stroke="url(#stone)" stroke-width="92"/>
  <path d="M86 393C101 195 282 72 540 72s439 123 454 321" fill="none" stroke="#f4f2ff" stroke-opacity=".58" stroke-width="17"/>
  <path d="M97 386C126 215 298 92 540 92s414 123 443 294" fill="none" stroke="url(#gold)" stroke-width="7" opacity=".9"/>

  <!-- side pillars -->
  <g>
    <path d="M0 390H124V1788H0Z" fill="url(#stone)"/>
    <path d="M18 430H92V1737H18Z" fill="url(#stoneLight)" opacity=".8"/>
    <path d="M41 465H46V1688H41Z" fill="#f9f7ff" opacity=".62"/>
    <path d="M72 465H77V1688H72Z" fill="url(#gold)"/>
    <path d="M0 390H150V438H0Z" fill="url(#stoneLight)"/><path d="M0 428H150V446H0Z" fill="url(#gold)" opacity=".78"/>
    <path d="M0 1718H145V1787H0Z" fill="url(#stoneLight)"/>
  </g>
  <g transform="translate(1080 0) scale(-1 1)">
    <path d="M0 390H124V1788H0Z" fill="url(#stone)"/>
    <path d="M18 430H92V1737H18Z" fill="url(#stoneLight)" opacity=".8"/>
    <path d="M41 465H46V1688H41Z" fill="#f9f7ff" opacity=".62"/>
    <path d="M72 465H77V1688H72Z" fill="url(#gold)"/>
    <path d="M0 390H150V438H0Z" fill="url(#stoneLight)"/><path d="M0 428H150V446H0Z" fill="url(#gold)" opacity=".78"/>
    <path d="M0 1718H145V1787H0Z" fill="url(#stoneLight)"/>
  </g>

  <!-- corner ornaments -->
  <path d="M0 1788C82 1790 145 1753 190 1688c-8 79-61 161-150 195H0Z" fill="url(#stone)"/>
  <path d="M1080 1788c-82 2-145-35-190-100 8 79 61 161 150 195h40Z" fill="url(#stone)"/>
  <path d="M0 1814c83 2 144-28 196-89" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <path d="M1080 1814c-83 2-144-28-196-89" fill="none" stroke="url(#gold)" stroke-width="6"/>

  <!-- gems -->
  <g filter="url(#glow)">
    <g transform="translate(540 46) rotate(45)"><rect x="-27" y="-27" width="54" height="54" rx="4" fill="url(#gem)" stroke="#f8e8ff" stroke-width="8"/></g>
    <g transform="translate(43 213) rotate(45)"><rect x="-19" y="-19" width="38" height="38" rx="3" fill="url(#gem)" stroke="#f7e9ff" stroke-width="6"/></g>
    <g transform="translate(1037 213) rotate(45)"><rect x="-19" y="-19" width="38" height="38" rx="3" fill="url(#gem)" stroke="#f7e9ff" stroke-width="6"/></g>
    <g transform="translate(42 622) rotate(45)"><rect x="-22" y="-22" width="44" height="44" rx="3" fill="url(#gem)" stroke="#f7e9ff" stroke-width="6"/></g>
    <g transform="translate(1038 622) rotate(45)"><rect x="-22" y="-22" width="44" height="44" rx="3" fill="url(#gem)" stroke="#f7e9ff" stroke-width="6"/></g>
    <g transform="translate(43 1676) rotate(45)"><rect x="-18" y="-18" width="36" height="36" rx="3" fill="url(#gem)" stroke="#f7e9ff" stroke-width="6"/></g>
    <g transform="translate(1037 1676) rotate(45)"><rect x="-18" y="-18" width="36" height="36" rx="3" fill="url(#gem)" stroke="#f7e9ff" stroke-width="6"/></g>
    <circle cx="168" cy="1804" r="25" fill="url(#gem)" stroke="#d8c6ff" stroke-width="7"/>
    <circle cx="912" cy="1804" r="25" fill="url(#gem)" stroke="#d8c6ff" stroke-width="7"/>
    <g transform="translate(540 1845) rotate(45)"><rect x="-18" y="-18" width="36" height="36" fill="url(#gem)" stroke="#eadcff" stroke-width="6"/></g>
  </g>

  <!-- tiny sparkles -->
  <g fill="#fff" opacity=".78"><circle cx="256" cy="310" r="3"/><circle cx="820" cy="354" r="4"/><circle cx="225" cy="1170" r="3"/><circle cx="858" cy="1320" r="3"/><path d="M320 510l5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/><path d="M760 940l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/></g>
</svg>